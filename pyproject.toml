[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soveryn"
version = "0.0.0"
description = "SOVERYN vNext — clean rebuild of the multi-agent system"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "jsonschema>=4.0",
    "trafilatura>=2.0",  # web fetch + main-content extraction (soveryn.platform.web.fetch)
    "pipecat-ai[silero,webrtc,elevenlabs]>=1.3.0,<2",
    # vett-harness vendored deps (upstream pat-jj/harness-1)
    "anthropic>=0.86.0",
    "baseten-performance-client>=0.1.9",
    "chromadb>=1.1.1",
    "datasketch>=1.10.0",
    "json_repair>=0.58.0",
    "openai>=2.30.0",
    "openai-harmony>=0.0.4",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.10.0",
    "rank-bm25>=0.2.2",
    "requests>=2.32.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.0",
    "tiktoken>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["soveryn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that hit live services (router, lattice, etc.); opt-in with --run-integration",
    "rig: runs against real GPUs; fleet must be down",
]
