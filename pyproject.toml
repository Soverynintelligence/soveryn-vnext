[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soveryn"
version = "0.0.0"
description = "SOVERYN vNext — clean rebuild of the multi-agent system"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["soveryn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
