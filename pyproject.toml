[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soveryn"
version = "0.0.0"
description = "SOVERYN vNext — clean rebuild of the multi-agent system"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "jsonschema>=4.0",
    # Lattice recall scores every embedded node against the query. In pure
    # Python that is 2,638 x 4,096 float multiplications and takes 790 ms —
    # 73% of recall. numpy does it as one matrix product in ~30 ms. The scorer
    # falls back to the pure-Python loop if the import fails, so this is a
    # performance dependency, not a correctness one.
    "numpy>=1.26",
    "turbovec>=1.0.0",  # reference KB (Part B) — not used for lattice memory
    "trafilatura>=2.0",  # web fetch + main-content extraction (soveryn.platform.web.fetch)
    "croniter>=2.0",  # automations scheduler due detection
    "pipecat-ai[silero,webrtc,elevenlabs]>=1.3.0,<2",
    "requests>=2.32.0",
    "requests-oauthlib>=2.0.0",  # X/presence OAuth1 (soveryn.agents.presence.x_client)
    "pywebpush>=2.0.0",  # Messages PWA Web Push (Gate / needs-you)
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=62",
    "pypdf>=5.0",
    "pymupdf>=1.24",
]

[tool.setuptools.packages.find]
where = [".", "packages/soveryn-acttruth/src"]
include = ["soveryn*", "acttruth*"]

[tool.setuptools.package-data]
soveryn = ["automations/routines/*.md"]
acttruth = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -p no:langsmith_plugin"
# langsmith's autoloaded pytest plugin imports requests at config-parse time,
# before ini filterwarnings apply, so its env-version warning breaks out onto
# raw stderr in every run. The plugin is unused here; block it and keep the
# filter as belt-and-suspenders for any in-capture occurrences.
filterwarnings = [
    "ignore:urllib3.*doesn't match a supported version",
]
markers = [
    "integration: tests that hit live services (router, lattice, etc.); opt-in with --run-integration",
    "rig: runs against real GPUs; fleet must be down",
]

# Editable path dep for ActTruth portable package (pip/uv).
[tool.uv.sources]
soveryn-acttruth = { path = "packages/soveryn-acttruth", editable = true }
