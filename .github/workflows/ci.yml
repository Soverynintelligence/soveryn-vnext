# First CI for this repo. Intentionally minimal: install, ruff correctness,
# default-marker pytest. Do not deselect known-red tests here; the fixes PR
# owns the hard-coded ~/soveryn_vnext root, missing PDF extras, the live
# heartbeat stream test, and the two F821 NameErrors.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install package and test deps
        id: install
        run: |
          set -eux
          python -m pip install -U pip setuptools wheel
          # Workaround: pip rejects the relative file: dep in
          # [project.dependencies] ("relative path without a working
          # directory"). Install acttruth first, then the remaining
          # runtime deps, then the editable tree without resolving
          # dependencies. Can be simplified to `pip install -e .`
          # once the fixes PR lands.
          python -m pip install -e packages/soveryn-acttruth
          python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          class InstallPlan:
              @staticmethod
              def runtime_deps_without_acttruth() -> list[str]:
                  data = tomllib.loads(Path("pyproject.toml").read_text())
                  return [
                      dep
                      for dep in data["project"]["dependencies"]
                      if "soveryn-acttruth" not in dep
                  ]

          subprocess.check_call(
              [
                  "python",
                  "-m",
                  "pip",
                  "install",
                  *InstallPlan.runtime_deps_without_acttruth(),
              ]
          )
          PY
          python -m pip install -e . --no-deps
          python -m pip install pytest ruff

      - name: Ruff (correctness only)
        if: steps.install.outcome == 'success'
        run: ruff check --select E9,F821 soveryn scripts packages

      - name: Pytest (default markers)
        if: steps.install.outcome == 'success'
        run: python -m pytest
