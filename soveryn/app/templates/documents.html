<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOVERYN · Documents</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="/static/lab-favicon.png">
<link rel="stylesheet" href="/static/lab-console.css">
<style>
  body { min-height: 100vh; }
  .page { max-width: 1280px; margin: 0 auto; padding: 0 0 48px; }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1.8fr;
    gap: 0;
    border-top: 1px solid var(--line);
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  .layout > .lab-panel {
    border-right: 1px solid var(--line);
    min-height: 60vh;
  }
  @media (max-width: 900px) {
    .layout > .lab-panel { border-right: none; border-bottom: 1px solid var(--line); }
  }
  .layout > .lab-panel:last-child { border-right: none; }

  .lab-panel-body { padding: 16px 18px 22px; }

  .filter-row {
    display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap;
  }
  .filter-row select, .filter-row input[type="text"] {
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 6px 10px;
    font-size: 12px;
    font-family: var(--mono);
    outline: none;
  }
  .filter-row select:focus, .filter-row input[type="text"]:focus {
    border-color: var(--gold-dim);
  }

  .doc-list { display: flex; flex-direction: column; gap: 0; }

  .doc-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 4px;
    border-top: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .doc-item:first-child { border-top: none; }
  .doc-item:hover { background: rgba(198, 166, 100, 0.04); }
  .doc-item.active { background: rgba(198, 166, 100, 0.08); }

  .doc-item .agent-disc {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid var(--line-lit);
    background: var(--panel-2);
    color: var(--gold);
  }
  .doc-item[data-agent="aetheria"] .agent-disc { color: var(--ok); }
  .doc-item[data-agent="vett"] .agent-disc { color: var(--ink); }
  .doc-item[data-agent="scotty"] .agent-disc { color: var(--down); }

  .doc-item .doc-meta { flex: 1; min-width: 0; }
  .doc-item .doc-title {
    font-size: 13px; font-weight: 500; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .doc-item .doc-sub { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
  .doc-item .doc-sub .status { text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }
  .doc-item .doc-sub .status[data-status="draft"] { color: var(--gold); }
  .doc-item .doc-sub .status[data-status="final"] { color: var(--ok); }
  .doc-item .doc-sub .status[data-status="archived"] { color: var(--ink-3); }

  .doc-item .download-group { display: flex; gap: 6px; flex-shrink: 0; }
  .dl-btn {
    padding: 4px 8px;
    border-radius: var(--r-sm);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: 1px solid var(--line);
    color: var(--ink-2);
  }
  .dl-btn:hover { border-color: var(--gold-dim); color: var(--gold); }

  .empty-state {
    padding: 28px 0;
    text-align: center;
    color: var(--ink-3);
    font-style: italic;
  }

  .viewer-panel { position: sticky; top: 56px; }
  .viewer-panel .viewer-placeholder {
    padding: 48px 24px;
    text-align: center;
    color: var(--ink-3);
    font-style: italic;
  }
  .viewer-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .viewer-header .viewer-title { font-size: 15px; font-weight: 500; line-height: 1.35; color: var(--ink); }
  .viewer-header .viewer-meta { font-size: 11px; color: var(--ink-3); margin-top: 4px; letter-spacing: 0.04em; }
  .viewer-header .viewer-downloads { display: flex; gap: 6px; flex-shrink: 0; }

  .doc-content {
    max-height: 65vh; overflow-y: auto; padding-right: 4px;
    font-family: var(--sans);
    font-size: 13px; line-height: 1.65; color: var(--ink-2);
  }
  .doc-content h1 { font-size: 18px; font-weight: 600; margin: 0 0 12px; color: var(--ink); font-family: var(--mono); }
  .doc-content h2 { font-size: 15px; font-weight: 600; margin: 16px 0 8px; color: var(--ink); font-family: var(--mono); }
  .doc-content h3 { font-size: 13px; font-weight: 600; margin: 12px 0 6px; color: var(--ink); font-family: var(--mono); }
  .doc-content p  { margin: 6px 0; }
  .doc-content ul, .doc-content ol { margin: 6px 0 6px 18px; }
  .doc-content li { margin: 2px 0; }
  .doc-content pre {
    background: var(--panel-2);
    border: 1px solid var(--line);
    padding: 10px 14px;
    border-radius: var(--r-sm);
    font-size: 12px;
    overflow-x: auto;
    font-family: var(--mono);
  }
  .doc-content code {
    font-size: 12px;
    background: var(--panel-2);
    padding: 1px 5px;
    border-radius: var(--r-sm);
    font-family: var(--mono);
  }
  .doc-content pre code { background: none; padding: 0; }
  .doc-content blockquote {
    border-left: 2px solid var(--gold-dim);
    padding: 4px 12px;
    margin: 8px 0;
    color: var(--ink-3);
  }
  .doc-content table { border-collapse: collapse; width: 100%; font-size: 12px; margin: 10px 0; }
  .doc-content th, .doc-content td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .doc-content th { background: var(--panel-2); color: var(--ink); }

  .loading-spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--line-lit);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .panel-count {
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.08em;
  }
</style>
</head>
<body class="lab">

<div class="plate">
  <a class="id" href="/messages">
    <img src="/static/lab-seal.png" alt="" width="44" height="44">
    <span><b>SOVERYN</b><i>Documents</i></span>
  </a>
  <nav>
    <a href="/messages" class="keep">Messages</a>
    <a href="/citizens" class="keep">Staff</a>
    <a href="/command-center">Desk</a>
    <a href="/fleet">Fleet</a>
    <a href="/documents" class="active">Docs</a>
    <a href="/charters" class="keep">Charters</a>
  </nav>
</div>

<div class="page">
  <div class="layout">

    <section class="lab-panel" id="list-panel">
      <div class="lab-panel-head">
        <span class="n">01</span>
        <h2>Agent documents</h2>
        <span class="r panel-count" id="doc-count">—</span>
      </div>
      <div class="lab-panel-body">
        <div class="filter-row">
          <select id="agent-filter">
            <option value="">All agents</option>
            <option value="aetheria">Aetheria</option>
            <option value="vett">Vett</option>
            <option value="scotty">Scotty</option>
            <option value="kernel">Kernel</option>
            <option value="eve">Eve</option>
          </select>
          <select id="status-filter">
            <option value="">All statuses</option>
            <option value="draft">Draft</option>
            <option value="final">Final</option>
            <option value="archived">Archived</option>
          </select>
        </div>
        <div class="doc-list" id="doc-list">
          <div class="empty-state">Loading…</div>
        </div>
      </div>
    </section>

    <section class="lab-panel viewer-panel" id="viewer-panel">
      <div class="lab-panel-head">
        <span class="n">02</span>
        <h2>Viewer</h2>
        <span class="r">select a document</span>
      </div>
      <div class="lab-panel-body">
        <div class="viewer-placeholder" id="viewer-placeholder">
          Select a document to view its content.
        </div>
        <div id="viewer-body" style="display:none">
          <div class="viewer-header">
            <div>
              <div class="viewer-title" id="viewer-title"></div>
              <div class="viewer-meta" id="viewer-meta"></div>
            </div>
            <div class="viewer-downloads" id="viewer-downloads"></div>
          </div>
          <div class="doc-content" id="viewer-content"></div>
        </div>
      </div>
    </section>

  </div>
</div>

<footer class="lab-foot">House network · my data is my data · no corporate call-home</footer>

<script>
// ─── Tiny markdown renderer (no external deps) ────────────────────────────
// Covers headings, bold, italic, code, links, blockquote, lists, paragraphs.
// For full fidelity, we delegate to the server /download?fmt=html.
function renderMarkdown(md) {
  // Escape HTML entities first so raw HTML in docs isn't executed
  let s = md
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Fenced code blocks
  s = s.replace(/```[\s\S]*?```/g, m => {
    const inner = m.slice(3, -3).replace(/^\w*\n/, '');
    return `<pre><code>${inner}</code></pre>`;
  });
  // Inline code
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Headings
  s = s.replace(/^######\s+(.*)$/gm, '<h6>$1</h6>');
  s = s.replace(/^#####\s+(.*)$/gm, '<h5>$1</h5>');
  s = s.replace(/^####\s+(.*)$/gm, '<h4>$1</h4>');
  s = s.replace(/^###\s+(.*)$/gm, '<h3>$1</h3>');
  s = s.replace(/^##\s+(.*)$/gm, '<h2>$1</h2>');
  s = s.replace(/^#\s+(.*)$/gm, '<h1>$1</h1>');
  // Blockquote
  s = s.replace(/^&gt;\s+(.*)$/gm, '<blockquote>$1</blockquote>');
  // Bold + italic
  s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Links
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Unordered lists
  s = s.replace(/((?:^[-*]\s+.+\n?)+)/gm, m => {
    const items = m.trim().split('\n').map(l => `<li>${l.replace(/^[-*]\s+/, '')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  // Ordered lists
  s = s.replace(/((?:^\d+\.\s+.+\n?)+)/gm, m => {
    const items = m.trim().split('\n').map(l => `<li>${l.replace(/^\d+\.\s+/, '')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });
  // Paragraphs (double newline → <p>)
  s = s.replace(/\n{2,}/g, '</p><p>');
  s = '<p>' + s + '</p>';
  // Clean up stray empty paras
  s = s.replace(/<p>\s*<\/p>/g, '');
  return s;
}

// ─── State ───────────────────────────────────────────────────────────────────
let allDocs = [];
let activeDocId = null;

// ─── Fetch helpers ───────────────────────────────────────────────────────────
async function fetchDocs(agent, status) {
  const params = new URLSearchParams();
  if (agent)  params.set('agent', agent);
  if (status) params.set('status', status);
  const url = '/api/documents' + (params.toString() ? '?' + params.toString() : '');
  const res = await fetch(url);
  if (!res.ok) throw new Error('Failed to fetch documents: ' + res.status);
  return (await res.json()).documents;
}

async function fetchDoc(id) {
  const res = await fetch('/api/documents/' + encodeURIComponent(id));
  if (!res.ok) throw new Error('Failed to fetch document ' + id);
  return res.json();
}

// ─── Render list ─────────────────────────────────────────────────────────────
function renderList(docs) {
  allDocs = docs;
  const list = document.getElementById('doc-list');
  const count = document.getElementById('doc-count');
  count.textContent = docs.length + ' doc' + (docs.length !== 1 ? 's' : '');

  if (!docs.length) {
    list.innerHTML = '<div class="empty-state">No documents yet.</div>';
    return;
  }

  list.innerHTML = docs.map(d => {
    const when = relativeTime(d.updated_at);
    const agentInitial = d.agent ? d.agent[0].toUpperCase() : '?';
    return `
      <div class="doc-item${d.id === activeDocId ? ' active' : ''}"
           data-id="${esc(d.id)}" data-agent="${esc(d.agent)}"
           role="button" tabindex="0" aria-label="View ${esc(d.title)}">
        <div class="agent-disc">${agentInitial}</div>
        <div class="doc-meta">
          <div class="doc-title">${esc(d.title)}</div>
          <div class="doc-sub">
            ${esc(d.agent)}
            &nbsp;·&nbsp;
            <span class="status" data-status="${esc(d.status)}">${esc(d.status)}</span>
            &nbsp;·&nbsp;${when}
          </div>
        </div>
        <div class="download-group">
          <a class="dl-btn" href="/documents/${esc(d.id)}/download?fmt=md"
             download title="Download Markdown" onclick="event.stopPropagation()">md</a>
          <a class="dl-btn" href="/documents/${esc(d.id)}/download?fmt=html"
             download title="Download HTML" onclick="event.stopPropagation()">html</a>
          <a class="dl-btn" href="/documents/${esc(d.id)}/download?fmt=pdf"
             download title="Download PDF" onclick="event.stopPropagation()">pdf</a>
          <a class="dl-btn" href="/documents/${esc(d.id)}/download?fmt=docx"
             download title="Download DOCX" onclick="event.stopPropagation()">docx</a>
        </div>
      </div>`;
  }).join('');

  // Click handlers
  list.querySelectorAll('.doc-item').forEach(el => {
    const open = () => openDoc(el.dataset.id);
    el.addEventListener('click', open);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') open(); });
  });
}

// ─── Open doc viewer ─────────────────────────────────────────────────────────
async function openDoc(id) {
  activeDocId = id;
  // Mark active in list
  document.querySelectorAll('.doc-item').forEach(el =>
    el.classList.toggle('active', el.dataset.id === id));

  const placeholder = document.getElementById('viewer-placeholder');
  const viewerBody  = document.getElementById('viewer-body');
  placeholder.innerHTML = '<span class="loading-spinner"></span> Loading…';
  placeholder.style.display = '';
  viewerBody.style.display = 'none';

  try {
    const doc = await fetchDoc(id);
    document.getElementById('viewer-title').textContent = doc.title;
    document.getElementById('viewer-meta').textContent =
      doc.agent + ' · ' + doc.status + ' · ' + relativeTime(doc.updated_at);
    document.getElementById('viewer-downloads').innerHTML =
      ['md','html','pdf','docx'].map(fmt =>
        `<a class="dl-btn" href="/documents/${esc(doc.id)}/download?fmt=${fmt}" download>${fmt}</a>`
      ).join('');
    document.getElementById('viewer-content').innerHTML = renderMarkdown(doc.content || '');
    placeholder.style.display = 'none';
    viewerBody.style.display = '';
  } catch (err) {
    placeholder.innerHTML = '<span style="color:rgba(236,243,244,0.4)">Failed to load document.</span>';
    console.error(err);
  }
}

// ─── Filter wiring ───────────────────────────────────────────────────────────
async function reload() {
  const agent  = document.getElementById('agent-filter').value;
  const status = document.getElementById('status-filter').value;
  try {
    const docs = await fetchDocs(agent, status);
    renderList(docs);
  } catch (err) {
    document.getElementById('doc-list').innerHTML =
      '<div class="empty-state">Failed to load documents.</div>';
    console.error(err);
  }
}

document.getElementById('agent-filter').addEventListener('change', reload);
document.getElementById('status-filter').addEventListener('change', reload);

// ─── Helpers ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function relativeTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60)    return 'just now';
  if (diff < 3600)  return Math.round(diff / 60) + 'm ago';
  if (diff < 86400) return Math.round(diff / 3600) + 'h ago';
  return Math.round(diff / 86400) + 'd ago';
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
reload();
</script>
</body>
</html>
