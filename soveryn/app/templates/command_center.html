<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOVERYN · Desk</title>
<style>
  :root{--bg:#0d0f10;--panel:#15181a;--line:rgba(232,227,213,.10);--ink:#ece6d6;--dim:rgba(232,227,213,.55);
        --acc:#c0824f;--ok:#5ee1a0;--warn:#d4a827;--bad:#e0645a;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
  a{color:inherit} .page{max-width:1440px;margin:0 auto;padding:18px 22px 40px}
  .plate{display:flex;align-items:center;gap:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .plate .id{display:flex;gap:10px;align-items:center;text-decoration:none}
  .plate .id b{letter-spacing:.18em;font-size:13px} .plate .id i{display:block;font-style:normal;color:var(--dim);font-size:11px}
  .plate nav{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
  .plate nav a{padding:6px 11px;border-radius:6px;text-decoration:none;color:var(--dim);font-size:13px}
  .plate nav a.active,.plate nav a:hover{background:rgba(192,130,79,.14);color:var(--ink)}
  .status-strip{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--dim);white-space:nowrap}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .pill[data-s=ok] .dot{background:var(--ok)} .pill[data-s=warn] .dot{background:var(--warn)} .pill[data-s=bad] .dot{background:var(--bad)}
  .pill b{color:var(--ink);font-weight:600}
  h2.sd-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:20px 0 10px;font-weight:600}
  .agent-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .agent-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center}
  .agent-card .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:rgba(192,130,79,.18);color:var(--acc)}
  .agent-card .body{flex:1;min-width:0} .agent-card .name{font-weight:600} .agent-card .role,.agent-card .state{color:var(--dim);font-size:12px}
  .agent-card .state{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .agent-act{display:inline-block;padding:6px 12px;border-radius:6px;border:1px solid var(--line);text-decoration:none;font-size:12px;background:transparent;color:var(--ink);cursor:pointer}
  .agent-act.primary{background:var(--acc);border-color:var(--acc);color:#1a120b;font-weight:600}
  .at{font:11px var(--mono);color:var(--dim);margin-top:3px}
  .grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;margin-top:4px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  .kernel{display:flex;flex-direction:column;height:calc(100vh - 250px);min-height:520px}
  .k-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .k-head select{flex:1;min-width:220px;background:#0f1213;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px}
  .k-head button,.k-input button{background:#0f1213;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:12px}
  .k-head button.primary,.k-input button.primary{background:var(--acc);border-color:var(--acc);color:#1a120b;font-weight:600}
  .k-head button:disabled,.k-input button:disabled{opacity:.4;cursor:default}
  .k-lease{font-size:12px;color:var(--dim)} .k-lease b{color:var(--ink)}
  .k-log{flex:1;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px;background:#0f1213}
  .msg{margin:0 0 12px} .msg .who{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .msg .txt{white-space:pre-wrap;word-wrap:break-word} .msg.user .txt{color:#f3e7db}
  .msg.tool .txt{font:12px var(--mono);color:#9fb7b0;max-height:160px;overflow:auto}
  .msg.sys .txt{font-size:12px;color:var(--warn)}
  .k-input{display:flex;gap:8px;margin-top:10px} .k-input textarea{flex:1;min-height:58px;resize:vertical;background:#0f1213;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
  .k-cli{margin-top:8px;font:12px var(--mono);color:var(--dim);word-break:break-all}
  .k-cli code{color:var(--ink)}
  .ny-item,.res-item{display:block;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;text-decoration:none}
  .ny-item .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);margin-right:8px}
  .ny-item[data-sev=bad] .k{color:var(--bad)}
  .ny-empty,.res-empty{color:var(--dim);font-size:13px}
  .res-item summary{cursor:pointer;list-style:none} .res-item summary .t{font-weight:600}
  .res-item summary .m{color:var(--dim);font-size:12px;margin-left:6px}
  .res-item[data-seen=false] summary .t::before{content:"● ";color:var(--acc)}
  .res-item .c{white-space:pre-wrap;font-size:13px;margin-top:8px;max-height:280px;overflow:auto;color:#d9d3c4}
  .right{display:flex;flex-direction:column;gap:16px}
  .p-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .p-head h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .p-head button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;font-size:11px;padding:3px 8px;cursor:pointer}
  @media (max-width:980px){.grid{grid-template-columns:1fr}.agent-row{grid-template-columns:1fr}.kernel{height:auto}}
  .agent-card .av.sov-cit{width:54px;height:54px;border-radius:0;background:transparent}
</style>
<link rel="stylesheet" href="/static/citizen-icons.css?v=20261103flat">
</head>
<body data-testid="command-center">
<div class="page">
  <div class="plate">
    <a class="id" href="/messages"><img src="/static/lab-seal.png" alt="" width="36" height="36"><span><b>SOVERYN</b><i>Desk</i></span></a>
    <!--sd-nav:desk-->
    <div class="status-strip" data-testid="status-strip">
      <span class="pill" data-pill="kernel" data-s="unknown" title="Kernel"><span class="dot"></span><b>Kernel</b><span data-v>…</span></span>
      <span class="pill" data-pill="heartbeat" data-s="unknown"><span class="dot"></span>Heartbeat<span data-v></span></span>
      <span class="pill" data-pill="patrol" data-s="unknown"><span class="dot"></span>Patrol<span data-v></span></span>
      <span class="pill" data-pill="ares" data-s="unknown"><span class="dot"></span>Ares<span data-v></span></span>
    </div>
  </div>

  <h2 class="sd-h">Citizens</h2>
  <section class="agent-row" data-testid="agent-row" aria-label="Your team">
    <div class="agent-card" data-agent="aetheria">
      <span class="av" data-av="aetheria">A</span>
      <div class="body"><div class="name">Aetheria</div><div class="role">Runs the house</div>
        <div class="state" data-agent-state>—</div><div class="at" data-at="aetheria"></div></div>
      <a class="agent-act primary" href="/messages/aetheria">Talk</a>
    </div>
    <div class="agent-card" data-agent="forge" data-testid="forge-card">
      <span class="av" data-av="forge">F</span>
      <div class="body"><div class="name">Forge</div><div class="role">Builds &amp; fixes code · Kernel</div>
        <div class="state" data-agent-state>—</div><div class="at" data-at="forge"></div></div>
      <a class="agent-act primary" href="/messages/forge">Talk</a>
    </div>
    <div class="agent-card" data-agent="eve">
      <span class="av" data-av="eve">E</span>
      <div class="body"><div class="name">Eve</div><div class="role">Research + ship</div>
        <div class="state" data-agent-state>—</div><div class="at" data-at="eve"></div></div>
      <a class="agent-act primary" href="/messages/eve">Talk</a>
    </div>
  </section>

  <div class="grid">
    <section class="panel kernel" data-testid="kernel-pane" aria-label="Kernel thread">
      <div class="p-head"><h3>Kernel thread · Forge</h3><span class="k-lease" data-k-lease>—</span></div>
      <div class="k-head">
        <select data-k-select aria-label="Thread"></select>
        <button data-k-open>Open</button>
        <button class="primary" data-k-new>New thread</button>
        <button data-k-release title="Stop the Desk's writer and free the lease so the CLI can resume">Hand to CLI</button>
      </div>
      <div class="k-log" data-k-log aria-live="polite"><div class="ny-empty">Pick a thread or start a new one.</div></div>
      <form class="k-input" data-k-form>
        <textarea data-k-text placeholder="Ask the Kernel…  (Ctrl+Enter to send)" maxlength="20000"></textarea>
        <div style="display:flex;flex-direction:column;gap:6px">
          <button class="primary" type="submit" data-k-send>Send</button>
          <button type="button" data-k-steer>Steer</button>
          <button type="button" data-k-abort>Stop</button>
        </div>
      </form>
      <div class="k-cli" data-k-cli></div>
    </section>

    <div class="right">
      <section class="panel" data-testid="needs-you" aria-label="Needs you">
        <div class="p-head"><h3>Needs you <span data-ny-count></span></h3><a class="agent-act" href="/house#approvals-anchor">Review in House</a></div>
        <div data-ny-list><div class="ny-empty">Loading…</div></div>
      </section>
      <section class="panel" data-testid="today-results" aria-label="Today's results">
        <div class="p-head"><h3>Today's results <span data-res-count></span></h3><button data-res-seen>Mark all seen</button></div>
        <div data-res-list><div class="res-empty">Loading…</div></div>
      </section>
    </div>
  </div>
</div>

<script src="/static/citizen-icons.js?v=20261103flat"></script>
<script>
(function(){
  "use strict";
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  async function getJson(url){ try{ const r = await fetch(url, {cache:"no-store"}); if(!r.ok) return null; return await r.json(); }catch(_){ return null; } }
  function ago(iso){ if(!iso) return ""; const t = Date.parse(iso); if(isNaN(t)) return ""; const s=(Date.now()-t)/1000;
    if(s<90) return "just now"; if(s<3600) return Math.round(s/60)+"m ago"; if(s<86400) return Math.round(s/3600)+"h ago"; return Math.round(s/86400)+"d ago"; }
  function pill(name, state, text){ const p=$(`[data-pill="${name}"]`); if(!p) return; p.dataset.s=state; $("[data-v]",p).textContent=text?(" · "+text):""; }

  // ── status strip: Kernel label from /api/ops/brain (EXL3), daemons ──
  async function renderStatus(){
    const [brain, bench, d] = await Promise.all([getJson("/api/ops/brain"), getJson("/api/system/bench_flash"), getJson("/api/system/daemons")]);
    if(brain){
      const up = bench && bench.router_ok && bench.model_status === "loaded";
      pill("kernel", up ? "ok" : "bad", `${brain.house_name || brain.alias} · ${brain.blurb || ""}${up ? "" : " · down"}`);
    } else pill("kernel","bad","status unavailable");
    if(d){
      for(const k of ["heartbeat","patrol","ares"]){
        const v = d[k] || {}; const st = v.status || "unknown";
        pill(k, st==="active"||st==="quiet"?"ok":(st==="stale"?"warn":"bad"), st + (v.last_tick ? " · "+ago(v.last_tick) : ""));
      }
    }
  }

  // ── citizens row (same endpoints as before; UI only) ──
  // animated citizens (state follows /api/messages/presence: live / busy / down)
  function paintAvatars(){
    if(!window.soverynCitizenIcon) return;
    document.querySelectorAll(".agent-card .av[data-av]").forEach(el => {
      const id = el.getAttribute("data-av");
      soverynCitizenIcon.paint(el, id, { size: 54, label: el.closest(".agent-card").querySelector(".name").textContent, state: soverynCitizenIcon.stateOf(id) || "live" });
    });
    soverynCitizenIcon.watchPresence(30000);
  }
  paintAvatars();
  async function renderCitizens(){
    const at = await getJson("/api/system/acttruth");
    for(const agent of ["aetheria","forge","eve"]){
      const s = await getJson(`/sessions?agent=${agent}&limit=1`);
      const recent = s && s.sessions && s.sessions[0];
      const el = $(`.agent-card[data-agent="${agent}"] [data-agent-state]`);
      if(el) el.textContent = recent ? `Last talk ${ago(recent.updated_at) || "recently"}` : "Quiet — no recent session";
      const b = at && at.agents && at.agents[agent] && at.agents[agent].budget;
      const atEl = $(`[data-at="${agent}"]`);
      if(atEl && b) atEl.textContent = `ActTruth ${b.remaining}/${b.limit} left`;
    }
  }

  // ── needs you ──
  async function renderNeedsYou(){
    const [gate, deleg, xs, ares] = await Promise.all([getJson("/api/approvals/pending"), getJson("/api/delegation/pending"), getJson("/api/x/staged"), getJson("/api/ares/findings?limit=50")]);
    const items = [];
    for(const a of (gate && gate.approvals) || []) items.push({k:"gate", sev:"warn", t:`${a.citizen || ""}: ${a.summary || a.action || a.id}`, href:"/house#approvals-anchor"});
    for(const t of (Array.isArray(deleg) ? deleg : [])) items.push({k:"diff", sev:"warn", t:(t.summary||t.objective||t.id).split("\n")[0].slice(0,140), href:"/house#approvals-anchor"});
    for(const p of (Array.isArray(xs) ? xs : [])) items.push({k:"x post", sev:"warn", t:(p.text||p.id||"").slice(0,140), href:"/house#approvals-anchor"});
    for(const f of ((ares && ares.findings) || []).filter(f => f.severity==="emergency"||f.severity==="critical"))
      items.push({k:"ares "+f.severity, sev:"bad", t:`${f.finding_type} · last seen ${ago(f.last_seen)}`, href:"/estate#ares"});
    $("[data-ny-count]").textContent = items.length ? `(${items.length})` : "";
    $("[data-ny-list]").innerHTML = items.length ? items.map(i => `<a class="ny-item" data-sev="${i.sev}" href="${i.href}"><span class="k">${esc(i.k)}</span>${esc(i.t)}</a>`).join("") : `<div class="ny-empty">Nothing needs you.</div>`;
  }

  // ── today's results (seen = local only; no backend writes) ──
  const SEEN_KEY = "soveryn-desk-seen";
  const seen = () => { try{ return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]")); }catch(_){ return new Set(); } };
  const saveSeen = (s) => { try{ localStorage.setItem(SEEN_KEY, JSON.stringify([...s].slice(-500))); }catch(_){} };
  let lastResults = [];
  async function renderResults(){
    const d = await getJson("/api/automations/inbox?limit=40");
    const today = new Date().toLocaleDateString("en-CA");
    lastResults = ((d && d.inbox) || []).filter(x => (x.fired_at || "").slice(0,10) === today);
    const s = seen(); const unseen = lastResults.filter(x => !s.has(x.id)).length;
    $("[data-res-count]").textContent = lastResults.length ? `(${unseen} new / ${lastResults.length})` : "";
    $("[data-res-list]").innerHTML = lastResults.length ? lastResults.map(x => `
      <details class="res-item" data-id="${esc(x.id)}" data-seen="${s.has(x.id)}">
        <summary><span class="t">${esc(x.title || x.automation_id)}</span><span class="m">${esc(x.agent||"")} · ${esc((x.fired_at||"").slice(11,16))}${x.status && x.status!=="ok" ? " · "+esc(x.status) : ""}</span></summary>
        <div class="c">${esc(x.content || x.error || "")}</div></details>`).join("") : `<div class="res-empty">No results yet today.</div>`;
  }
  document.addEventListener("toggle", (e) => {
    const el = e.target; if(!el.classList || !el.classList.contains("res-item") || !el.open) return;
    const s = seen(); s.add(el.dataset.id); saveSeen(s); el.dataset.seen = "true";
  }, true);
  $("[data-res-seen]").addEventListener("click", () => { const s = seen(); lastResults.forEach(x => s.add(x.id)); saveSeen(s); renderResults(); });

  // ── Kernel thread (Pi RPC over SSE) ──
  let csrf = null, current = null, es = null, streamEl = null;
  async function token(){ if(!csrf){ const d = await getJson("/api/kernel/csrf"); csrf = d && d.token; } return csrf; }
  async function post(url, body){
    const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json","X-Kernel-CSRF": await token()}, body: JSON.stringify(body || {})});
    let j = null; try{ j = await r.json(); }catch(_){}
    return {status:r.status, body:j};
  }
  const log = () => $("[data-k-log]");
  function addMsg(cls, who, text){
    const d = document.createElement("div"); d.className = "msg " + cls;
    d.innerHTML = `<div class="who">${esc(who)}</div><div class="txt"></div>`;
    $(".txt", d).textContent = text || ""; log().appendChild(d); log().scrollTop = log().scrollHeight; return $(".txt", d);
  }
  async function loadThreads(selectId){
    const d = await getJson("/api/kernel/threads?limit=30");
    const sel = $("[data-k-select]");
    sel.innerHTML = ((d && d.threads) || []).map(t => {
      const tag = t.open_in_desk ? "● desk" : (t.lease.held ? "⛔ " + t.lease.owner : "");
      const when = new Date(t.mtime*1000).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
      return `<option value="${esc(t.id)}">${esc(when)} · ${esc((t.preview || t.id).slice(0,60))} ${tag}</option>`;
    }).join("");
    if(selectId) sel.value = selectId;
  }
  async function showInfo(sid){
    const i = await getJson(`/api/kernel/threads/${encodeURIComponent(sid)}`);
    if(!i) return;
    const l = i.lease || {};
    $("[data-k-lease]").innerHTML = i.open_in_desk ? "writer: <b>Desk</b>" : (l.held ? `writer: <b>${esc(l.owner)}</b> (pid ${esc(l.pid)})` : "writer: <b>none</b>");
    $("[data-k-cli]").innerHTML = `Resume in CLI: <code>${esc(i.resume)}</code>`;
    $("[data-k-release]").disabled = !i.open_in_desk;
    for(const b of ["[data-k-send]","[data-k-steer]","[data-k-abort]"]) $(b).disabled = !i.open_in_desk;
  }
  async function renderHistory(sid){
    const d = await getJson(`/api/kernel/threads/${encodeURIComponent(sid)}/messages`);
    log().innerHTML = "";
    for(const m of (d && d.messages) || []){
      if(m.role === "toolResult") addMsg("tool", "tool result", m.text);
      else addMsg(m.role, m.role === "user" ? "you" : "kernel", m.text + (m.tools && m.tools.length ? `\n[tools: ${m.tools.join(", ")}]` : ""));
    }
    if(!log().children.length) log().innerHTML = `<div class="ny-empty">Empty thread. Say something.</div>`;
  }
  function attach(sid){
    if(es) es.close();
    es = new EventSource(`/api/kernel/threads/${encodeURIComponent(sid)}/events`);
    es.onmessage = (ev) => {
      let r; try{ r = JSON.parse(ev.data); }catch(_){ return; }
      if(r.type === "message_start" && r.message && r.message.role === "assistant") streamEl = addMsg("assistant","kernel","");
      else if(r.type === "message_update" && r.assistantMessageEvent && r.assistantMessageEvent.type === "text_delta"){
        if(!streamEl) streamEl = addMsg("assistant","kernel","");
        streamEl.textContent += r.assistantMessageEvent.delta; log().scrollTop = log().scrollHeight;
      }
      else if(r.type === "message_end" && r.message && r.message.role === "assistant") streamEl = null;
      else if(r.type === "tool_execution_start") addMsg("tool", "tool · " + r.toolName, JSON.stringify(r.args || {}).slice(0, 600));
      else if(r.type === "tool_execution_end") addMsg("tool", "result · " + r.toolName + (r.isError ? " (error)" : ""), ((r.result && r.result.content) || []).map(c => c.text || "").join("").slice(0, 1200));
      else if(r.type === "auto_retry_start") addMsg("sys","retry", `attempt ${r.attempt}/${r.maxAttempts}: ${r.errorMessage || ""}`);
      else if(r.type === "response" && r.success === false) addMsg("sys","error", r.error || "command failed");
      else if(r.type === "desk_exit"){ addMsg("sys","desk","Desk writer stopped."); es.close(); es = null; showInfo(sid); loadThreads(sid); }
    };
  }
  async function openThread(sid){
    current = sid;
    await renderHistory(sid);
    const r = await post(`/api/kernel/threads/${encodeURIComponent(sid)}/open`);
    if(r.status === 409) addMsg("sys", "lease", (r.body && r.body.error) || "Another writer holds this thread.");
    else if(r.status === 200) attach(sid);
    await showInfo(sid); await loadThreads(sid);
  }
  $("[data-k-open]").addEventListener("click", () => { const v = $("[data-k-select]").value; if(v) openThread(v); });
  $("[data-k-select]").addEventListener("change", async (e) => { current = e.target.value; await renderHistory(current); await showInfo(current); });
  $("[data-k-new]").addEventListener("click", async () => {
    const r = await post("/api/kernel/threads");
    if(r.status !== 200){ addMsg("sys","error",(r.body && r.body.error) || "could not start"); return; }
    current = r.body.session_id; log().innerHTML = ""; attach(current);
    setTimeout(async () => { await loadThreads(current); await showInfo(current); }, 1500);
  });
  $("[data-k-release]").addEventListener("click", async () => {
    if(!current) return;
    const r = await post(`/api/kernel/threads/${encodeURIComponent(current)}/release`);
    if(r.body) addMsg("sys","handed to CLI", r.body.resume);
    if(es){ es.close(); es = null; }
    await showInfo(current); await loadThreads(current);
  });
  async function send(mode){
    const ta = $("[data-k-text]"); const msg = ta.value.trim(); if(!msg || !current) return;
    addMsg("user","you",msg); ta.value = "";
    const r = await post(`/api/kernel/threads/${encodeURIComponent(current)}/prompt`, {message: msg, mode});
    if(r.status !== 200) addMsg("sys","error",(r.body && r.body.error) || ("HTTP "+r.status));
  }
  $("[data-k-form]").addEventListener("submit", (e) => { e.preventDefault(); send(null); });
  $("[data-k-text]").addEventListener("keydown", (e) => { if(e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); send(null); } });
  $("[data-k-steer]").addEventListener("click", () => send("steer"));
  $("[data-k-abort]").addEventListener("click", () => current && post(`/api/kernel/threads/${encodeURIComponent(current)}/abort`));

  // ── boot: one 30 s loop for the right column + strip; Kernel is push (SSE) ──
  async function refresh(){ renderStatus(); renderCitizens(); renderNeedsYou(); renderResults(); }
  refresh(); setInterval(refresh, 30000);
  loadThreads().then(() => { const v = $("[data-k-select]").value; if(v){ current = v; renderHistory(v); showInfo(v); } });
})();
</script>
</body>
</html>
