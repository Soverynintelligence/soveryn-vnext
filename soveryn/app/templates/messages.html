<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages · SOVERYN</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOVERYN">
<link rel="manifest" href="/static/messages/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/messages/icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500&display=swap">
<style>
  :root {
    --bg: #000; --row: #0c0b0a; --line: rgba(255,255,255,0.08);
    --ink: #f5f2ea; --mute: rgba(245,242,234,0.45); --gold: #c6a664; --mint: #6fb98a;
    /* Same face as Desk / Staff (lab-console) — one house, not two systems */
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
    min-height: 100vh; min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top));
    background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  header .sub {
    margin: 2px 0 0; font-size: 12px; color: var(--mute); font-weight: 400;
    letter-spacing: 0.02em;
  }
  header .brand { display: flex; flex-direction: column; min-width: 0; }
  header .links { display: flex; gap: 14px; align-items: center; flex-shrink: 0; }
  header a { color: var(--gold); text-decoration: none; font-size: 15px; }
  header a.muted { color: var(--mute); font-size: 13px; }
  /* Phone OS = Messages. Desk HUD is optional and usually unused on phone. */
  @media (max-width: 720px) {
    header a[href="/command-center"],
    header a[href="/citizens"] { display: none; }
  }
  [data-push-banner] {
    margin: 0; padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: #12100e;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    justify-content: space-between;
  }
  [data-push-banner][hidden] { display: none !important; }
  [data-push-banner][data-tone="on"] { background: rgba(111,185,138,0.08); }
  [data-push-banner] .push-copy {
    flex: 1; min-width: 0; font-size: 13px; line-height: 1.4; color: var(--ink);
  }
  [data-push-banner] .push-copy strong { color: var(--gold); font-weight: 600; }
  [data-push-banner][data-tone="on"] .push-copy strong { color: var(--mint); }
  [data-push-banner] .push-note { color: var(--mute); font-size: 12px; }
  [data-push-banner] .push-allow {
    flex-shrink: 0; font: inherit; font-size: 14px; font-weight: 600;
    padding: 10px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--gold); background: var(--gold); color: #0c0b0a;
  }
  [data-push-banner] .push-allow:disabled { opacity: 0.5; }
  .list { list-style: none; margin: 0; padding: 0; }
  .row {
    display: flex; gap: 14px; align-items: center;
    padding: 12px 16px; text-decoration: none; color: inherit;
    border-bottom: 1px solid var(--line); background: var(--row);
  }
  .row:active { background: #151311; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px; color: #0c0b0a;
    background: linear-gradient(145deg, var(--gold), #8a7038);
  }
  .avatar[data-agent="vett"] { background: linear-gradient(145deg, #7ec8e3, #3a7a9a); }
  .avatar[data-agent="scotty"] { background: linear-gradient(145deg, #e8a87c, #a65d3b); }
  .avatar[data-agent="eve"] { background: linear-gradient(145deg, #e0b0ff, #7a4a9a); }
  .avatar[data-agent="kernel"] { background: linear-gradient(145deg, #9ee0b8, #3d7a55); }
  .avatar[data-agent="t_critic"] { background: linear-gradient(145deg, #d4a574, #6b4a2e); }
  .avatar[data-agent="t_scout"] { background: linear-gradient(145deg, #8eb8d4, #3a5a70); }
  .meta { flex: 1; min-width: 0; }
  .meta .name {
    display: flex; justify-content: space-between; gap: 8px;
    font-weight: 600; font-size: 17px; margin-bottom: 3px;
  }
  .meta .name time { font-weight: 400; font-size: 13px; color: var(--mute); }
  .meta .preview {
    font-size: 14px; color: var(--mute);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .meta .preview.hot { color: var(--mint); }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Messages</h1>
      <p class="sub">Your house — talk to them here</p>
    </div>
    <div class="links">
      <a class="muted" href="/citizens">Staff</a>
      <a class="muted" href="/command-center">Desk</a>
    </div>
  </header>
  <!-- Server-rendered so phones see this even if JS/cache is stale -->
  <div data-push-banner role="region" aria-label="House alerts" data-tone="ask">
    <div class="push-copy">
      <strong>House alerts</strong> — Gate and needs-you from any citizen (not only Signal).<br>
      <span class="push-note">On iPhone: Safari Share → <strong>Add to Home Screen</strong>, open the SOVERYN icon, then tap Allow below.</span>
    </div>
    <button type="button" data-push-allow class="push-allow">Allow house alerts</button>
  </div>
  <ul class="list" data-testid="messages-list" aria-label="Your house">
    <!-- filled by JS -->
  </ul>
<script src="/messages-push-client.js?v=20260825c" defer></script>
<script>
(function () {
  const CONTACTS = [
    { id: "aetheria", name: "Aetheria", role: "Runs the house", letter: "A" },
    { id: "vett", name: "Vett", role: "Checks the work", letter: "V" },
    { id: "scotty", name: "Scotty", role: "Gets it done", letter: "S" },
    { id: "eve", name: "Eve", role: "Shows up online", letter: "E" },
    { id: "kernel", name: "Kernel", role: "Builds with you", letter: "K" },
    // Teammates overnight → Messages (merge). Read-only inboxes.
    { id: "t_critic", name: "Critic", role: "Overnight review", letter: "C" },
    { id: "t_scout", name: "Scout", role: "Overnight scan", letter: "Sc" },
  ];

  const list = document.querySelector("[data-testid=messages-list]");

  function esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function rel(iso) {
    if (!iso) return "";
    try {
      const t = new Date(iso).getTime();
      const d = Date.now() - t;
      if (d < 60000) return "now";
      if (d < 3600000) return Math.floor(d/60000) + "m";
      if (d < 86400000) return Math.floor(d/3600000) + "h";
      return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
    } catch { return ""; }
  }

  const INBOX_ONLY = { t_critic: true, t_scout: true };

  function isRoomSession(s) {
    return ((s && s.title) || "").trim().startsWith("[room:");
  }

  // Match message_thread: don't preview heartbeat/commission/room as the DM.
  function isResumableDmSession(s) {
    if (!s || !s.session_id) return false;
    const t = ((s && s.title) || "").trim();
    if (!t) return true;
    if (isRoomSession(s)) return false;
    if (/^\[(heartbeat|direct:|commission|signal|specialist|webhook)/i.test(t)) return false;
    if (t.startsWith("automation:")) return false;
    if (t.startsWith("verify-")) return false;
    if (t.startsWith("[m]")) return true;
    if (t.startsWith("[")) return false;
    return true;
  }

  async function preview(agent) {
    const inbox = !!INBOX_ONLY[agent];
    const fallback = inbox ? "Overnight inbox" : "Tap to talk";
    try {
      const r = await fetch("/sessions?agent=" + encodeURIComponent(agent) + "&limit=30");
      if (!r.ok) return { text: fallback, hot: false, when: "" };
      const d = await r.json();
      const list = d.sessions || [];
      const s = inbox
        ? (list[0] || null)
        : (list.find(isResumableDmSession) || null);
      if (!s) return { text: fallback, hot: false, when: "" };
      let text = inbox ? (s.title || "Overnight inbox") : "Continue conversation";
      let hot = false;
      if (agent === "aetheria" && s.session_id) {
        try {
          const c = await fetch("/api/rooms/collabs?dm_session_id=" + encodeURIComponent(s.session_id));
          if (c.ok) {
            const cj = await c.json();
            const active = (cj.collabs || []).find((ev) => {
              const st = (ev.state || "").toLowerCase();
              return st === "working" || (!st && ev.peer);
            });
            if (active && active.peer && active.at) {
              const age = Date.now() - new Date(active.at).getTime();
              if (age < 2 * 3600 * 1000) {
                text = "Working with " + active.peer;
                hot = true;
              }
            }
          }
        } catch (_) {}
      }
      if (!hot && !inbox && s.title && !String(s.title).startsWith("[")) text = s.title;
      return { text, hot, when: rel(s.updated_at), session: s.session_id };
    } catch {
      return { text: fallback, hot: false, when: "" };
    }
  }

  async function paint() {
    if (!list) return;
    try {
      const rows = await Promise.all(CONTACTS.map(async (c) => {
        const p = await preview(c.id);
        const href = "/messages/" + encodeURIComponent(c.id);
        return (
          '<li><a class="row" href="' + href + '">' +
            '<div class="avatar" data-agent="' + esc(c.id) + '">' + esc(c.letter) + '</div>' +
            '<div class="meta">' +
              '<div class="name"><span>' + esc(c.name) + '</span><time>' + esc(p.when) + '</time></div>' +
              '<div class="preview' + (p.hot ? ' hot' : '') + '">' + esc(p.text) + '</div>' +
            '</div>' +
          '</a></li>'
        );
      }));
      list.innerHTML = rows.join("");
    } catch (e) {
      list.innerHTML =
        '<li style="padding:16px;color:var(--mute)">Couldn\'t load contacts — ' +
        esc(e.message || "network error") + "</li>";
    }
  }

  paint();
})();
</script>
</body>
</html>
