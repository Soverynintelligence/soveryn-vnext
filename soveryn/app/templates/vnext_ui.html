<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOVERYN vNext</title>
<style>
  /* ── Variables ─────────────────────────────────────────────────────── */
  :root {
    --bg:        #0d0f12;
    --surface:   #13171c;
    --border:    #1e2530;
    --muted:     #2a3040;
    --text:      #c8cdd6;
    --text-dim:  #6b7585;
    --accent:    #4a9eff;
    --accent-lo: #1a3a5c;
    --green:     #3dba6f;
    --yellow:    #d4a827;
    --red:       #c0392b;
    --font:      "Courier New", "Consolas", monospace;
    --radius:    3px;
  }

  /* ── Reset ─────────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; }
  button { font-family: var(--font); font-size: 13px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: var(--radius); padding: 4px 10px; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  select { font-family: var(--font); font-size: 13px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 8px; cursor: pointer; }
  input, textarea { font-family: var(--font); font-size: 13px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); outline: none; }
  input:focus, textarea:focus { border-color: var(--accent); }
  a { color: var(--accent); text-decoration: none; }

  /* ── Layout ────────────────────────────────────────────────────────── */
  #app { display: flex; flex-direction: column; width: 100vw; height: 100vh; }

  /* Header */
  #header {
    display: flex; align-items: center; gap: 16px;
    padding: 0 16px; height: 42px; min-height: 42px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #header .logo { font-size: 14px; letter-spacing: 0.12em; color: var(--text); font-weight: bold; }
  #header .logo span { color: var(--accent); }
  #health-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
  #health-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #health-dot.ok  { background: var(--green); }
  #health-dot.warn { background: var(--yellow); }
  #health-dot.err  { background: var(--red); }
  #header .spacer { flex: 1; }
  #persona-btn { font-size: 11px; color: var(--text-dim); }
  #legacy-link { font-size: 11px; color: var(--text-dim); }
  #legacy-link:hover { color: var(--accent); }

  /* Body */
  #body { display: flex; flex: 1; min-height: 0; }

  /* Left panel */
  #left {
    width: 200px; min-width: 160px; max-width: 260px;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .panel-section { padding: 12px 10px 6px; }
  .panel-label {
    font-size: 10px; letter-spacing: 0.1em; color: var(--text-dim);
    text-transform: uppercase; margin-bottom: 6px;
    border-bottom: 1px solid var(--border); padding-bottom: 4px;
  }
  /* Agent list */
  #agent-list { display: flex; flex-direction: column; gap: 2px; padding: 0 6px 8px; }
  .agent-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: var(--radius);
    cursor: pointer; color: var(--text-dim); border: 1px solid transparent;
  }
  .agent-item:hover { background: var(--muted); color: var(--text); }
  .agent-item.selected { background: var(--accent-lo); border-color: var(--accent); color: var(--accent); }
  .agent-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .agent-item.selected .agent-dot { background: var(--accent); }
  .agent-name { font-size: 12px; }
  /* Session list */
  #sessions-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #session-list { flex: 1; overflow-y: auto; padding: 0 6px 8px; display: flex; flex-direction: column; gap: 2px; }
  #session-list::-webkit-scrollbar { width: 4px; }
  #session-list::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }
  .session-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px; border-radius: var(--radius);
    cursor: pointer; color: var(--text-dim); border: 1px solid transparent;
  }
  .session-item:hover { background: var(--muted); color: var(--text); }
  .session-item.selected { background: var(--accent-lo); border-color: var(--accent); color: var(--accent); }
  .session-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
  .session-time { font-size: 10px; color: var(--text-dim); flex-shrink: 0; margin-left: 6px; }
  .session-del {
    font-size: 10px; color: var(--text-dim); cursor: pointer; padding: 0 2px;
    visibility: hidden;
  }
  .session-item:hover .session-del { visibility: visible; }
  .session-del:hover { color: var(--red); }
  #new-session-btn { margin: 0 10px 10px; font-size: 11px; }

  /* Right panel */
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* Conversation header */
  #conv-header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text-dim);
    background: var(--bg); flex-shrink: 0;
  }
  #conv-title { color: var(--text); }

  /* Message list */
  #messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 0;
  }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }

  .msg { max-width: 86%; display: flex; flex-direction: column; gap: 3px; }
  .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-start; }
  .msg-role { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
  .msg.user .msg-role { text-align: right; }
  .msg-bubble {
    padding: 8px 12px; border-radius: var(--radius);
    line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .msg-bubble { background: var(--accent-lo); border: 1px solid var(--accent); color: var(--text); }
  .msg.assistant .msg-bubble { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
  .msg.error .msg-bubble { background: #1a0a0a; border-color: var(--red); color: var(--red); }
  .msg.streaming .msg-bubble::after { content: "▌"; animation: blink 0.7s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 12px; text-align: center;
  }

  /* Input area */
  #input-area {
    border-top: 1px solid var(--border);
    padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;
    background: var(--surface); flex-shrink: 0;
  }
  #input-row { display: flex; gap: 8px; align-items: flex-end; }
  #msg-input {
    flex: 1; resize: none; padding: 8px 10px;
    min-height: 38px; max-height: 120px; line-height: 1.4;
  }
  #send-btn { flex-shrink: 0; }
  #send-btn.busy { color: var(--red); border-color: var(--red); }
  #mode-select { flex-shrink: 0; }

  /* Persona modal */
  #persona-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    align-items: flex-start; justify-content: center;
    padding-top: 60px;
  }
  #persona-overlay.open { display: flex; }
  #persona-modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); width: 660px; max-width: 92vw;
    max-height: 72vh; display: flex; flex-direction: column;
  }
  #persona-modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--text-dim);
  }
  #persona-modal-title { color: var(--text); }
  #persona-close { background: none; border: none; color: var(--text-dim); font-size: 16px; padding: 0; }
  #persona-close:hover { color: var(--text); border: none; }
  #persona-body { overflow-y: auto; padding: 16px; font-size: 12px; line-height: 1.6; white-space: pre-wrap; color: var(--text); }
  #persona-body::-webkit-scrollbar { width: 6px; }
  #persona-body::-webkit-scrollbar-thumb { background: var(--muted); }
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <div class="logo">SOVERYN <span>vNext</span></div>
    <div id="health-badge">
      <div id="health-dot"></div>
      <span id="health-text">checking…</span>
    </div>
    <div class="spacer"></div>
    <button id="persona-btn" title="Show current agent persona">persona ▾</button>
    <a id="legacy-link" href="/legacy">legacy</a>
  </div>

  <!-- Body -->
  <div id="body">

    <!-- Left: agent + session list -->
    <div id="left">
      <div class="panel-section">
        <div class="panel-label">Agents</div>
      </div>
      <div id="agent-list"><!-- populated by JS --></div>

      <div id="sessions-panel">
        <div class="panel-section">
          <div class="panel-label">Sessions</div>
        </div>
        <div id="session-list"><!-- populated by JS --></div>
        <button id="new-session-btn" title="Create new session for selected agent">+ new session</button>
      </div>
    </div>

    <!-- Right: conversation + input -->
    <div id="right">
      <div id="conv-header">
        <span id="conv-title">select an agent to begin</span>
      </div>
      <div id="messages">
        <div class="empty-state" id="empty-hint">
          Select an agent, then create or pick a session.
        </div>
      </div>
      <div id="input-area">
        <div id="input-row">
          <textarea id="msg-input" placeholder="type message…" rows="1" disabled></textarea>
          <select id="mode-select" title="Chat mode">
            <option value="stream" selected>stream</option>
            <option value="sync">sync</option>
          </select>
          <button id="send-btn" disabled>send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Persona modal -->
<div id="persona-overlay">
  <div id="persona-modal">
    <div id="persona-modal-header">
      <span id="persona-modal-title">persona</span>
      <button id="persona-close">✕</button>
    </div>
    <div id="persona-body">loading…</div>
  </div>
</div>

<script>
"use strict";

// ── State ────────────────────────────────────────────────────────────────────
const S = {
  agents: {},           // { name: model_file }
  selectedAgent: null,
  sessions: [],         // [{session_id, agent, title, created_at, updated_at}]
  selectedSession: null,
  inflight: null,       // AbortController | EventSource for current stream
};

// ── Utilities ────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function relTime(isoStr) {
  if (!isoStr) return "";
  const diff = (Date.now() - new Date(isoStr).getTime()) / 1000;
  const rtf = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
  const abs = Math.abs(diff);
  if (abs < 60)   return rtf.format(-Math.round(abs), "second");
  if (abs < 3600) return rtf.format(-Math.round(abs / 60), "minute");
  if (abs < 86400) return rtf.format(-Math.round(abs / 3600), "hour");
  return rtf.format(-Math.round(abs / 86400), "day");
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function apiFetch(path, opts = {}) {
  const resp = await fetch(path, opts);
  if (!resp.ok) {
    let body;
    try { body = await resp.json(); } catch { body = null; }
    const err = body?.error;
    throw new Error(err ? `${err.code}: ${err.message}` : `HTTP ${resp.status}`);
  }
  return resp.json();
}

// ── Health ───────────────────────────────────────────────────────────────────
async function pollHealth() {
  const dot = $("health-dot");
  const txt = $("health-text");
  try {
    const data = await apiFetch("/health");
    const n = (data.active_agents || []).length;
    if (n >= 3)      { dot.className = "ok";   }
    else if (n > 0)  { dot.className = "warn";  }
    else             { dot.className = "err";   }
    txt.textContent = `healthy ${n} active`;
  } catch {
    dot.className = "err";
    txt.textContent = "unreachable";
  }
}

// ── Agents ───────────────────────────────────────────────────────────────────
async function loadAgents() {
  try {
    const data = await apiFetch("/api/models");
    S.agents = data;
    renderAgents();
  } catch (e) {
    $("agent-list").innerHTML =
      `<div style="padding:8px;color:var(--red);font-size:11px">${escHtml(e.message)}</div>`;
  }
}

function renderAgents() {
  const el = $("agent-list");
  el.innerHTML = "";
  for (const [name] of Object.entries(S.agents)) {
    const item = document.createElement("div");
    item.className = "agent-item" + (name === S.selectedAgent ? " selected" : "");
    item.dataset.agent = name;
    item.innerHTML = `<div class="agent-dot"></div><span class="agent-name">${escHtml(name)}</span>`;
    item.addEventListener("click", () => selectAgent(name));
    el.appendChild(item);
  }
}

async function selectAgent(name) {
  if (name === S.selectedAgent) return;
  cancelInflight();
  S.selectedAgent = name;
  S.selectedSession = null;
  renderAgents();
  $("conv-title").textContent = `agent: ${name}`;
  clearMessages();
  showEmptyHint("Loading sessions…");
  await loadSessions();
  if (S.sessions.length === 0) {
    showEmptyHint("No sessions yet — click [+ new session] to start.");
  } else {
    showEmptyHint("Select a session or create a new one.");
  }
  updateInputState();
}

// ── Sessions ─────────────────────────────────────────────────────────────────
async function loadSessions() {
  if (!S.selectedAgent) return;
  try {
    const data = await apiFetch(`/sessions?agent=${encodeURIComponent(S.selectedAgent)}`);
    S.sessions = (data.sessions || []).sort(
      (a, b) => new Date(b.updated_at) - new Date(a.updated_at)
    );
    renderSessions();
  } catch (e) {
    $("session-list").innerHTML =
      `<div style="padding:8px;color:var(--red);font-size:11px">${escHtml(e.message)}</div>`;
  }
}

function renderSessions() {
  const el = $("session-list");
  el.innerHTML = "";
  for (const sess of S.sessions) {
    const item = document.createElement("div");
    item.className = "session-item" + (sess.session_id === S.selectedSession ? " selected" : "");
    item.dataset.sid = sess.session_id;
    const label = sess.title || sess.session_id.slice(0, 8) + "…";
    const t = relTime(sess.updated_at || sess.created_at);
    item.innerHTML = `
      <span class="session-label" title="${escHtml(sess.session_id)}">${escHtml(label)}</span>
      <span class="session-time">${escHtml(t)}</span>
      <span class="session-del" title="Delete session" data-sid="${escHtml(sess.session_id)}">✕</span>
    `;
    item.addEventListener("click", (ev) => {
      if (ev.target.classList.contains("session-del")) return;
      selectSession(sess.session_id);
    });
    item.querySelector(".session-del").addEventListener("click", (ev) => {
      ev.stopPropagation();
      deleteSession(sess.session_id);
    });
    el.appendChild(item);
  }
}

async function selectSession(sid) {
  if (sid === S.selectedSession) return;
  cancelInflight();
  S.selectedSession = sid;
  renderSessions();
  const sess = S.sessions.find(s => s.session_id === sid);
  $("conv-title").textContent = sess
    ? `${sess.agent} · ${sess.title || sid.slice(0,8)}`
    : sid.slice(0, 8);
  clearMessages();
  await loadHistory(sid);
  updateInputState();
}

async function loadHistory(sid) {
  try {
    const data = await apiFetch(`/sessions/${encodeURIComponent(sid)}/history`);
    const turns = data.turns || [];
    if (turns.length === 0) {
      showEmptyHint("No messages yet. Send the first message.");
      return;
    }
    hideEmptyHint();
    for (const turn of turns) {
      appendMessage(turn.role, turn.content, false);
    }
    scrollToBottom();
  } catch (e) {
    showInlineError(e.message);
  }
}

async function createSession() {
  if (!S.selectedAgent) return;
  try {
    const data = await apiFetch("/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ agent: S.selectedAgent }),
    });
    await loadSessions();
    await selectSession(data.session_id);
  } catch (e) {
    showInlineError(e.message);
  }
}

async function deleteSession(sid) {
  try {
    const resp = await fetch(`/sessions/${encodeURIComponent(sid)}`, { method: "DELETE" });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    if (S.selectedSession === sid) {
      S.selectedSession = null;
      clearMessages();
      showEmptyHint("Session deleted. Select or create another.");
      updateInputState();
    }
    await loadSessions();
  } catch (e) {
    showInlineError(e.message);
  }
}

// ── Chat ─────────────────────────────────────────────────────────────────────
function cancelInflight() {
  if (!S.inflight) return;
  if (S.inflight.abort) S.inflight.abort();         // AbortController
  if (S.inflight.close) S.inflight.close();         // EventSource
  S.inflight = null;
}

async function sendMessage() {
  const text = $("msg-input").value.trim();
  if (!text || !S.selectedAgent) return;

  // Auto-create session if none
  if (!S.selectedSession) {
    await createSession();
    if (!S.selectedSession) return;
  }

  $("msg-input").value = "";
  autoResizeInput();
  hideEmptyHint();
  appendMessage("user", text, false);
  scrollToBottom();

  const mode = $("mode-select").value;
  setInputBusy(true);

  if (mode === "stream") {
    await sendStream(text);
  } else {
    await sendSync(text);
  }
  setInputBusy(false);
}

async function sendSync(text) {
  let msgEl = null;
  try {
    const ctrl = new AbortController();
    S.inflight = ctrl;
    const data = await apiFetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        agent: S.selectedAgent,
        session_id: S.selectedSession,
        message: text,
      }),
      signal: ctrl.signal,
    });
    S.inflight = null;
    appendMessage("assistant", data.content || "", false);
    scrollToBottom();
    await loadSessions(); // refresh timestamps
  } catch (e) {
    S.inflight = null;
    if (e.name === "AbortError") return;
    showInlineError(e.message);
  }
}

async function sendStream(text) {
  const ctrl = new AbortController();
  S.inflight = ctrl;

  let msgEl = null;
  let bubble = null;

  try {
    const resp = await fetch("/chat_stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        agent: S.selectedAgent,
        session_id: S.selectedSession,
        message: text,
      }),
      signal: ctrl.signal,
    });

    if (!resp.ok) {
      let body;
      try { body = await resp.json(); } catch { body = null; }
      const err = body?.error;
      throw new Error(err ? `${err.code}: ${err.message}` : `HTTP ${resp.status}`);
    }

    // Create streaming bubble
    msgEl = appendMessage("assistant", "", true);
    bubble = msgEl.querySelector(".msg-bubble");
    scrollToBottom();

    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });

      // SSE: split on double-newline
      const parts = buf.split(/\n\n/);
      buf = parts.pop(); // last part may be incomplete
      for (const part of parts) {
        for (const line of part.split("\n")) {
          if (!line.startsWith("data:")) continue;
          const raw = line.slice(5).trim();
          if (!raw || raw === "[DONE]") continue;
          let evt;
          try { evt = JSON.parse(raw); } catch { continue; }
          if (evt.type === "token") {
            bubble.textContent += evt.delta || "";
            scrollToBottom();
          } else if (evt.type === "done") {
            // Finalize — replace accumulated text with canonical content
            if (evt.content != null) bubble.textContent = evt.content;
            msgEl.classList.remove("streaming");
            await loadSessions();
          } else if (evt.type === "error") {
            msgEl.classList.remove("streaming");
            msgEl.classList.add("error");
            bubble.textContent = `${evt.code || "error"}: ${evt.message || "stream error"}`;
          }
        }
      }
    }
    if (msgEl) msgEl.classList.remove("streaming");
  } catch (e) {
    if (msgEl) {
      msgEl.classList.remove("streaming");
      msgEl.classList.add("error");
      if (bubble) bubble.textContent = e.name === "AbortError" ? "cancelled" : e.message;
    } else if (e.name !== "AbortError") {
      showInlineError(e.message);
    }
  } finally {
    S.inflight = null;
  }
}

// ── Messages DOM ─────────────────────────────────────────────────────────────
function appendMessage(role, content, streaming) {
  const hint = $("empty-hint");
  if (hint) hint.remove();

  const wrap = document.createElement("div");
  wrap.className = `msg ${role}${streaming ? " streaming" : ""}`;
  const roleLabel = role === "user" ? "you" : role;
  wrap.innerHTML = `
    <div class="msg-role">${escHtml(roleLabel)}</div>
    <div class="msg-bubble">${escHtml(content)}</div>
  `;
  $("messages").appendChild(wrap);
  return wrap;
}

function showInlineError(msg) {
  const hint = $("empty-hint");
  if (hint) hint.remove();
  const wrap = document.createElement("div");
  wrap.className = "msg error";
  wrap.innerHTML = `<div class="msg-bubble">${escHtml(msg)}</div>`;
  $("messages").appendChild(wrap);
  scrollToBottom();
}

function clearMessages() {
  $("messages").innerHTML = "";
}

function showEmptyHint(txt) {
  let hint = $("empty-hint");
  if (!hint) {
    hint = document.createElement("div");
    hint.id = "empty-hint";
    hint.className = "empty-state";
    $("messages").appendChild(hint);
  }
  hint.textContent = txt;
}

function hideEmptyHint() {
  const hint = $("empty-hint");
  if (hint) hint.remove();
}

function scrollToBottom() {
  const el = $("messages");
  el.scrollTop = el.scrollHeight;
}

// ── Input state ───────────────────────────────────────────────────────────────
function updateInputState() {
  const canSend = !!S.selectedAgent;
  $("msg-input").disabled = !canSend;
  $("send-btn").disabled = !canSend;
}

function setInputBusy(busy) {
  const btn = $("send-btn");
  const inp = $("msg-input");
  if (busy) {
    btn.textContent = "cancel";
    btn.classList.add("busy");
    inp.disabled = true;
    btn.onclick = () => { cancelInflight(); setInputBusy(false); };
  } else {
    btn.textContent = "send";
    btn.classList.remove("busy");
    inp.disabled = false;
    btn.onclick = sendMessage;
    scrollToBottom();
  }
}

function autoResizeInput() {
  const inp = $("msg-input");
  inp.style.height = "auto";
  inp.style.height = Math.min(inp.scrollHeight, 120) + "px";
}

// ── Persona ───────────────────────────────────────────────────────────────────
async function openPersona() {
  if (!S.selectedAgent) {
    $("persona-body").textContent = "No agent selected.";
    $("persona-modal-title").textContent = "persona";
    $("persona-overlay").classList.add("open");
    return;
  }
  $("persona-body").textContent = "loading…";
  $("persona-modal-title").textContent = `persona · ${S.selectedAgent}`;
  $("persona-overlay").classList.add("open");
  try {
    const data = await apiFetch(`/api/persona/${encodeURIComponent(S.selectedAgent)}`);
    $("persona-body").textContent = data.persona || "(empty)";
  } catch (e) {
    $("persona-body").textContent = `error: ${e.message}`;
  }
}

function closePersona() {
  $("persona-overlay").classList.remove("open");
}

// ── Init ─────────────────────────────────────────────────────────────────────
function init() {
  // Health poll
  pollHealth();
  setInterval(pollHealth, 30000);

  // Load agents
  loadAgents();

  // New session button
  $("new-session-btn").addEventListener("click", createSession);

  // Send on button click
  $("send-btn").addEventListener("click", sendMessage);

  // Send on Enter (Shift+Enter for newline)
  $("msg-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  $("msg-input").addEventListener("input", autoResizeInput);

  // Persona
  $("persona-btn").addEventListener("click", openPersona);
  $("persona-close").addEventListener("click", closePersona);
  $("persona-overlay").addEventListener("click", (e) => {
    if (e.target === $("persona-overlay")) closePersona();
  });

  // Keyboard: Escape closes persona
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closePersona();
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
