<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SOVERYN Voice</title>
    <style>
        body {
            background: #0a0a0a;
            color: #d4d4d4;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .orbs { display: flex; gap: 40px; }
        a.orb {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }
        .orb-disc {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #5d3a8e;
            box-shadow: 0 0 40px #8e6ec4;
            margin-bottom: 12px;
        }
        .orb-name {
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 14px;
        }
        .empty {
            opacity: 0.6;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="orbs">
        {% for agent in agents %}
        <a class="orb" href="/voice/{{ agent }}">
            <div class="orb-disc orb-{{ agent }}"></div>
            <div class="orb-name">{{ agent }}</div>
        </a>
        {% else %}
        <div class="empty">No voice agents configured.</div>
        {% endfor %}
    </div>
</body>
</html>
