<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SOVERYN Voice</title>
    <link rel="stylesheet" href="/static/voice/orb.css">
    <style>
        body { gap: 60px; }
        .orbs { display: flex; gap: 80px; align-items: center; }
        a.agent-link {
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; color: var(--text-soft);
        }
        .agent-link .preview-orb {
            width: 120px; height: 120px; border-radius: 50%;
            background: radial-gradient(circle, var(--orb-secondary), var(--orb-primary));
            box-shadow: 0 0 40px var(--orb-glow);
            margin-bottom: 20px;
            transition: transform 200ms;
        }
        .agent-link:hover .preview-orb { transform: scale(1.05); }
        .agent-name {
            text-transform: uppercase; letter-spacing: 0.3em; font-size: 12px;
        }
        .empty {
            opacity: 0.6;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="orbs">
        {% for agent in agents %}
        <a class="agent-link orb-{{ agent }}" href="/voice/{{ agent }}">
            <div class="preview-orb"></div>
            <div class="agent-name">{{ agent }}</div>
        </a>
        {% else %}
        <div class="empty">No voice agents configured.</div>
        {% endfor %}
    </div>
</body>
</html>
