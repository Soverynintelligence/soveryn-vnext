<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lounge — SOVERYN</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body.lab { margin:0; background:#0a0a0a; color:#e8e6e1; font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; }
  .plate { display:flex; align-items:center; gap:18px; padding:10px 18px; background:#111; border-bottom:1px solid rgba(255,255,255,0.08); }
  .plate .id { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
  .plate .id b { display:block; font-size:0.95em; }
  .plate .id i { display:block; font-style:normal; opacity:0.55; font-size:0.8em; }
  .plate nav { display:flex; gap:14px; flex-wrap:wrap; }
  .plate nav a { color:rgba(232,230,225,0.72); text-decoration:none; font-size:0.86em; letter-spacing:0.04em; text-transform:uppercase; padding:4px 2px; }
  .plate nav a.active { color:#fff; border-bottom:2px solid #d4a24e; }
  .plate nav a:hover { color:#fff; }
  .lounge-shell { max-width:820px; margin:0 auto; padding:20px 16px 60px; }
  .lounge-head { display:flex; align-items:baseline; gap:12px; margin:14px 0 4px; }
  .lounge-head h1 { font-size:1.3em; margin:0; }
  .lounge-head .rule { opacity:0.55; font-size:0.9em; }
  .lounge-card { background:#141414; border:1px solid rgba(255,255,255,0.09); border-radius:10px; margin-top:14px; }
  .lounge-wall { max-height:56vh; overflow-y:auto; }
  .lounge-entry { padding:10px 16px; border-bottom:1px solid rgba(255,255,255,0.06); }
  .lounge-entry .who { font-weight:600; }
  .lounge-entry .who[data-who="jon"] { color:#d4a24e; }
  .lounge-entry .who[data-who="aetheria"] { color:#8fb8de; }
  .lounge-entry .who[data-who="eve"] { color:#a8d5b0; }
  .lounge-entry .who[data-who="kernel"] { color:#cfa9de; }
  .lounge-entry .at { opacity:0.45; font-size:0.78em; margin-left:8px; }
  .lounge-entry .text { white-space:pre-wrap; margin-top:2px; }
  .lounge-entry.arrived .text { opacity:0.55; font-style:italic; }
  .lounge-say { display:flex; gap:10px; padding:12px 16px; border-top:1px solid rgba(255,255,255,0.09); }
  .lounge-say input { flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.14); color:inherit; border-radius:8px; padding:10px 12px; font:inherit; }
  .lounge-say button { border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.08); color:inherit; border-radius:8px; padding:10px 18px; cursor:pointer; font:inherit; }
  .lounge-say button:hover { background:rgba(255,255,255,0.14); }
  .lounge-empty { padding:22px 16px; opacity:0.55; }
</style>
</head>
<body class="lab sd" data-lounge>

<div class="plate">
  <a class="id" href="/command-center">
    <img src="/static/lab-seal.png" alt="" width="44" height="44">
    <span><b>SOVERYN</b><i>The Lounge</i></span>
  </a>
  <nav>
    <a href="/command-center">Command</a>
    <a href="/fleet">Fleet</a>
    <a href="/citizens">Citizens</a>
    <a href="/messages">Messages</a>
    <a href="/documents">Docs</a>
    <a href="/charters">Charters</a>
    <a href="/lounge" class="active">Lounge</a>
  </nav>
</div>

<div class="lounge-shell">
  <div class="lounge-head">
    <h1>The Lounge</h1>
    <span class="rule">no agenda · nobody closes anything · first round on Jon</span>
  </div>
  <div class="lounge-card">
    <div class="lounge-wall" data-lounge-wall aria-live="polite">
      <div class="lounge-empty">opening the lounge…</div>
    </div>
    <div class="lounge-say">
      <input data-lounge-say placeholder="Say something on the wall…" autocomplete="off">
      <button data-lounge-send>Say it</button>
    </div>
  </div>
</div>

<script>
(function(){
  var wallEl = document.querySelector('[data-lounge-wall]');
  var sayEl = document.querySelector('[data-lounge-say]');
  var sendBtn = document.querySelector('[data-lounge-send]');
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function paintWall(d){
    if(!d.open){ wallEl.innerHTML = '<div class="lounge-empty">lounge closed — no pointer on disk</div>'; return; }
    if(!d.entries.length){ wallEl.innerHTML = '<div class="lounge-empty">quiet in here. say something.</div>'; return; }
    wallEl.innerHTML = d.entries.map(function(e){
      var t = (e.at||'').replace('T',' ').slice(5,16);
      return '<div class="lounge-entry'+(e.kind==='arrived'?' arrived':'')+'">'
        + '<span class="who" data-who="'+esc(e.who)+'">'+esc(e.who)+'</span>'
        + '<span class="at">'+esc(t)+'</span>'
        + '<div class="text">'+esc(e.text)+'</div></div>';
    }).join('');
    wallEl.scrollTop = wallEl.scrollHeight;
  }
  function loadWall(){
    fetch('/api/lounge').then(function(r){ return r.json(); }).then(paintWall)
      .catch(function(){ wallEl.innerHTML = '<div class="lounge-empty">lounge unavailable</div>'; });
  }
  function say(){
    if(!sayEl.value.trim()) return;
    fetch('/api/lounge/say', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({from:'jon', text: sayEl.value.trim()})
    }).then(function(r){ return r.json(); }).then(function(){ sayEl.value=''; loadWall(); });
  }
  if(sendBtn) sendBtn.addEventListener('click', say);
  if(sayEl) sayEl.addEventListener('keydown', function(ev){ if(ev.key==='Enter') say(); });
  loadWall();
  setInterval(loadWall, 15000);
})();
</script>
</body>
</html>
