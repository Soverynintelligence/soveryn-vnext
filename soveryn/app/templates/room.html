<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Room · SOVERYN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500&display=swap">
<style>
  :root {
    --bg: #000; --panel: #0c0b0a; --line: rgba(255,255,255,0.08);
    --ink: #f5f2ea; --ink-2: rgba(245,242,234,0.7); --ink-3: rgba(245,242,234,0.45);
    --gold: #c6a664; --mint: #6fb98a;
    --bubble-them: #1c1a17; --bubble-me: #2a2418;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  header.room-bar {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  header a.back { color: var(--gold); text-decoration: none; font-size: 17px; flex-shrink: 0; }
  header a.dm-link { display: none; }
  .faces {
    display: flex; align-items: center; flex-shrink: 0;
  }
  .faces .av {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #0c0b0a;
    border: 2px solid #000; margin-left: -8px;
    background: linear-gradient(145deg, var(--gold), #8a7038);
  }
  .faces .av:first-child { margin-left: 0; }
  .faces .av[data-who="you"] {
    background: linear-gradient(145deg, #888, #555); color: var(--ink);
  }
  .faces .av[data-agent="vett"] { background: linear-gradient(145deg, #7ec8e3, #3a7a9a); }
  .faces .av[data-agent="eve"] { background: linear-gradient(145deg, #e0b0ff, #7a4a9a); }
  .faces .av[data-agent="scotty"] { background: linear-gradient(145deg, #e8a87c, #a65d3b); }
  .faces .av[data-agent="kernel"] { background: linear-gradient(145deg, #9ee0b8, #3d7a55); }
  .faces .av[data-state="working"] {
    box-shadow: 0 0 0 2px var(--mint);
    animation: peer-work 1.4s ease-in-out infinite;
  }
  .faces .av[data-state="gate"] { box-shadow: 0 0 0 2px var(--gold); }
  .faces .av[data-state="replied"] { box-shadow: 0 0 0 2px rgba(198,166,100,0.65); }
  @keyframes peer-work {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }
  .who-block { flex: 1; min-width: 0; }
  .who-block .title {
    font-weight: 600; font-size: 16px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .who-block .sub { font-size: 12px; color: var(--ink-3); }
  .thread {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 18px;
    word-break: break-word; font-size: 16px; line-height: 1.4;
  }
  .bubble.user {
    align-self: flex-end; background: var(--bubble-me); white-space: pre-wrap;
    border: 1px solid rgba(198,166,100,0.25); border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 4px;
  }
  .bubble.system {
    align-self: center; max-width: 92%; font-size: 13px; color: var(--ink-2);
    background: rgba(111,185,138,0.08); border-radius: 12px; padding: 8px 12px;
    white-space: pre-wrap;
  }
  .bubble .who {
    font-size: 11px; letter-spacing: 0.04em; color: var(--gold); margin-bottom: 4px; font-weight: 600;
  }
  .bubble.system .who { color: var(--mint); }
  .bubble .md-body > *:first-child { margin-top: 0; }
  .bubble .md-body > *:last-child { margin-bottom: 0; }
  .bubble .md-body p { margin: 0.45em 0; }
  .bubble .md-body h1, .bubble .md-body h2, .bubble .md-body h3, .bubble .md-body h4 {
    font-size: 1.05em; font-weight: 700; margin: 0.65em 0 0.3em;
  }
  .bubble .md-body ul, .bubble .md-body ol { margin: 0.4em 0; padding-left: 1.25em; }
  .bubble .md-body li { margin: 0.15em 0; }
  .bubble .md-body code {
    font-family: var(--mono);
    font-size: 0.88em; background: rgba(255,255,255,0.06);
    padding: 0.1em 0.35em; border-radius: 4px;
  }
  .bubble .md-body pre {
    margin: 0.5em 0; padding: 10px 12px; overflow-x: auto;
    background: rgba(0,0,0,0.35); border-radius: 10px; font-size: 0.86em;
  }
  .bubble .md-body pre code { background: none; padding: 0; }
  .bubble .md-body a { color: var(--gold); }
  .composer {
    position: sticky; bottom: 0; z-index: 4;
    padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px;
    background: rgba(0,0,0,0.95);
  }
  .ask-row {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    justify-content: flex-start;
  }
  .ask-row button {
    font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent;
    color: var(--ink-3); cursor: pointer; min-height: 32px;
  }
  .ask-row button:active { color: var(--ink); border-color: rgba(111,185,138,0.35); }
  .composer-row { display: flex; gap: 8px; align-items: center; }
  .composer-row input, .composer-row textarea {
    flex: 1; font: inherit; font-size: 16px; padding: 10px 14px; border-radius: 20px;
    border: 1px solid var(--line); background: #141210; color: var(--ink);
  }
  .composer-row textarea {
    border-radius: 16px; resize: none; min-height: 72px; max-height: 140px;
  }
  .composer-row .send {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--gold); color: #0c0b0a; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .status { font-size: 12px; color: var(--ink-3); min-height: 1.2em; }
  .sheet {
    display: none; flex-direction: column; gap: 8px;
    padding: 8px 0 0; border-top: 1px solid var(--line);
  }
  .sheet.open { display: flex; }
  .composer.sheet-open .ask-row,
  .composer.sheet-open [data-main-compose] { display: none !important; }
  .sheet .sheet-label {
    font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em;
  }
  .sheet .peer-picks { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet .peer-picks button {
    font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: #141210; color: var(--ink); cursor: pointer;
  }
  .sheet .peer-picks button:active,
  .sheet .peer-picks button.selected {
    border-color: var(--mint); color: var(--mint);
  }
  .sheet .sheet-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .sheet .sheet-actions button {
    font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: #0c0b0a; color: var(--ink); cursor: pointer;
  }
  .sheet .sheet-actions button.primary {
    background: var(--gold); color: #0c0b0a; border-color: var(--gold); font-weight: 600;
  }
  .approval-card {
    align-self: flex-start;
    max-width: 88%;
    margin: 4px 0 8px;
    padding: 10px 12px;
    background: #141210;
    border: 1px solid var(--gold);
    border-radius: 14px;
    font-size: 14px;
  }
  .approval-card .ac-head {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 6px; font-weight: 600;
  }
  .approval-card .ac-tool { font-size: 13px; margin-bottom: 4px; }
  .approval-card .ac-args {
    font-size: 12px; color: var(--ink-3); white-space: pre-wrap; word-break: break-word;
    margin: 0 0 10px;
  }
  .approval-card .ac-actions { display: flex; gap: 8px; }
  .approval-card .ac-actions button {
    font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); cursor: pointer; background: #0c0b0a; color: var(--ink);
  }
  .approval-card .ac-actions button.ac-allow { border-color: var(--mint); color: var(--mint); }
  .approval-card .ac-actions button.ac-deny { border-color: #e07070; color: #e07070; }
  .approval-card .ac-actions button:disabled { opacity: 0.45; }
  .approval-card.ac-done { border-color: var(--line); opacity: 0.85; }
  .approval-card .ac-notice { margin-top: 8px; font-size: 12px; color: var(--ink-3); }
</style>
</head>
<body>
  <header class="room-bar">
    <a class="back" href="/messages" aria-label="Back">‹</a>
    <a class="dm-link" href="/messages/aetheria" data-dm-link>Aetheria</a>
    <div class="faces" data-presence aria-label="In this group">
      <!-- filled by JS: only people currently in the group -->
    </div>
    <div class="who-block">
      <div class="title" data-group-title>Group</div>
      <div class="sub" data-group-sub></div>
    </div>
  </header>

  <div class="thread" data-testid="thread" role="log" aria-live="polite"></div>

  <div class="composer">
    <div class="ask-row">
      <button type="button" data-add-peer title="Add someone to this group">+ add</button>
      <button type="button" data-ask-peer title="Ask a peer in this group">ask…</button>
    </div>
    <div class="sheet" data-add-sheet>
      <div class="sheet-label">Add to this group</div>
      <div class="peer-picks" data-add-picks></div>
      <div class="sheet-actions">
        <button type="button" data-add-cancel>Cancel</button>
      </div>
    </div>
    <div class="sheet" data-ask-sheet>
      <div class="sheet-label">Ask someone in this group</div>
      <div class="peer-picks" data-ask-picks></div>
      <div class="composer-row">
        <textarea data-ask-brief placeholder="What should they check or do?" rows="3" aria-label="Brief"></textarea>
      </div>
      <div class="sheet-actions">
        <button type="button" data-ask-cancel>Cancel</button>
        <button type="button" class="primary" data-ask-send>Ask</button>
      </div>
    </div>
    <div class="composer-row" data-main-compose>
      <input type="text" data-composer placeholder="iMessage" aria-label="Message">
      <button type="button" class="send" data-send>↑</button>
    </div>
    <div class="status" data-status></div>
  </div>

<script>
(function () {
  const ALL_PEERS = ["vett", "eve", "scotty", "kernel"];
  const params = new URLSearchParams(location.search);
  const state = {
    peer: (params.get("peer") || "vett").toLowerCase(),
    peers: [],
    sessionId: params.get("session") || null,
    dmSessionId: params.get("from") || null,
    stream: true,
    shownApprovalIds: new Set(),
    gatePollTimer: null,
    askPeerPick: null,
  };

  const $ = (s) => document.querySelector(s);
  const thread = () => $("[data-testid=thread]");
  const status = () => $("[data-status]");

  function setStatus(t) { status().textContent = t || ""; }

  function esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function renderMarkdown(md) {
    let s = String(md || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    s = s.replace(/```[\s\S]*?```/g, (m) => {
      const inner = m.slice(3, -3).replace(/^\w*\n/, "");
      return "<pre><code>" + inner + "</code></pre>";
    });
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/^###\s+(.*)$/gm, "<h3>$1</h3>");
    s = s.replace(/^##\s+(.*)$/gm, "<h2>$1</h2>");
    s = s.replace(/^#\s+(.*)$/gm, "<h1>$1</h1>");
    s = s.replace(/^&gt;\s+(.*)$/gm, "<blockquote>$1</blockquote>");
    s = s.replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*(.+?)\*/g, "<em>$1</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/((?:^[-*]\s+.+\n?)+)/gm, (m) => {
      const items = m.trim().split("\n").map((l) =>
        "<li>" + l.replace(/^[-*]\s+/, "") + "</li>").join("");
      return "<ul>" + items + "</ul>";
    });
    s = s.replace(/((?:^\d+\.\s+.+\n?)+)/gm, (m) => {
      const items = m.trim().split("\n").map((l) =>
        "<li>" + l.replace(/^\d+\.\s+/, "") + "</li>").join("");
      return "<ol>" + items + "</ol>";
    });
    s = s.replace(/\n{2,}/g, "</p><p>");
    s = "<p>" + s + "</p>";
    s = s.replace(/<p>\s*<\/p>/g, "");
    s = s.replace(/<p>(<(?:h[1-6]|ul|ol|pre|blockquote)[\s\S]*?<\/(?:h[1-6]|ul|ol|pre|blockquote)>)<\/p>/g, "$1");
    return s;
  }

  function appendBubble(role, content, who) {
    const b = document.createElement("div");
    b.className = "bubble " + role;
    if (who) {
      const w = document.createElement("div");
      w.className = "who";
      w.textContent = who;
      b.appendChild(w);
    }
    const body = document.createElement("div");
    if (role === "assistant") {
      body.className = "md-body";
      body.innerHTML = renderMarkdown(content);
    } else {
      body.textContent = content;
    }
    b.appendChild(body);
    thread().appendChild(b);
    thread().scrollTop = thread().scrollHeight;
  }

  function closeSheets() {
    const add = $("[data-add-sheet]");
    const ask = $("[data-ask-sheet]");
    const composer = document.querySelector(".composer");
    if (add) add.classList.remove("open");
    if (ask) ask.classList.remove("open");
    if (composer) composer.classList.remove("sheet-open");
    state.askPeerPick = null;
  }

  function bindKeyboardInset() {
    const vv = window.visualViewport;
    const composer = document.querySelector(".composer");
    if (!vv || !composer) return;
    const sync = () => {
      const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      composer.style.paddingBottom = "max(8px, calc(env(safe-area-inset-bottom) + " + inset + "px))";
      thread().style.paddingBottom = inset ? (inset + 8) + "px" : "";
    };
    vv.addEventListener("resize", sync);
    vv.addEventListener("scroll", sync);
    sync();
  }

  function memberLabel(pid) {
    if (pid === "you") return "You";
    return pid.charAt(0).toUpperCase() + pid.slice(1);
  }

  function renderPeerChips(peers, peerStates) {
    const row = $("[data-presence]");
    if (!row) return;
    const list = (peers && peers.length) ? peers : [state.peer];
    state.peers = list.slice();
    state.peer = list[0] || state.peer;
    // Only people in this group — You, Aetheria, then current peers.
    const members = ["you", "aetheria"].concat(list);
    row.innerHTML = "";
    members.forEach((pid) => {
      const st = (pid !== "you" && pid !== "aetheria" && peerStates && peerStates[pid]) || "";
      const av = document.createElement("span");
      av.className = "av";
      av.dataset.who = pid === "you" || pid === "aetheria" ? pid : "peer";
      if (pid !== "you" && pid !== "aetheria") {
        av.dataset.peer = pid;
        av.dataset.agent = pid;
      }
      if (st) av.dataset.state = st;
      av.title = memberLabel(pid) + (st === "working" ? " · working" : st === "gate" ? " · needs Gate" : "");
      av.textContent = memberLabel(pid).charAt(0);
      row.appendChild(av);
    });
    const names = members.map(memberLabel).join(", ");
    const titleEl = $("[data-group-title]");
    const subEl = $("[data-group-sub]");
    if (titleEl) titleEl.textContent = names;
    if (subEl) {
      const working = list.filter((p) => peerStates && peerStates[p] === "working");
      subEl.textContent = working.length
        ? (members.length + " people · " + working.map(memberLabel).join(", ") + " working")
        : (members.length + " people");
    }
  }

  function setPeerChipState(st, peerId) {
    const pid = peerId || state.peer;
    const av = document.querySelector('[data-presence] [data-peer="' + pid + '"]');
    if (!av) {
      renderPeerChips(state.peers.length ? state.peers : [pid], pid ? {[pid]: st} : null);
      return;
    }
    if (st) av.dataset.state = st;
    else delete av.dataset.state;
    av.title = memberLabel(pid) + (st === "working" ? " · working" : st === "gate" ? " · needs Gate" : "");
    // Refresh subtitle
    const states = {};
    document.querySelectorAll("[data-presence] [data-peer]").forEach((el) => {
      if (el.dataset.state) states[el.dataset.peer] = el.dataset.state;
    });
    renderPeerChips(state.peers, states);
  }

  function fmtApprovalArgs(args) {
    try {
      let parsed = args;
      if (typeof args === "string") {
        try { parsed = JSON.parse(args); } catch (_) { return String(args).slice(0, 280); }
      }
      const s = JSON.stringify(parsed);
      return s.length > 280 ? s.slice(0, 277) + "…" : s;
    } catch (_) { return String(args || ""); }
  }

  function renderApprovalCard(payload) {
    const id = payload && (payload.approval_id || payload.id);
    if (!id || state.shownApprovalIds.has(id)) return;
    state.shownApprovalIds.add(id);
    const citizen = (payload.citizen || state.peer || "?").toLowerCase();

    const card = document.createElement("div");
    card.className = "approval-card";
    card.innerHTML =
      '<div class="ac-head">Needs your yes — Approval Gate</div>' +
      '<div class="ac-tool"></div><div class="ac-args"></div>' +
      '<div class="ac-actions">' +
      '<button type="button" class="ac-allow">Allow</button>' +
      '<button type="button" class="ac-deny">Deny</button></div>' +
      '<div class="ac-notice" style="display:none"></div>';
    card.querySelector(".ac-tool").textContent =
      citizen.charAt(0).toUpperCase() + citizen.slice(1) + " · " + (payload.tool || "?");
    card.querySelector(".ac-args").textContent = fmtApprovalArgs(payload.args);
    const allowBtn = card.querySelector(".ac-allow");
    const denyBtn = card.querySelector(".ac-deny");
    const notice = card.querySelector(".ac-notice");
    const decide = async (approve) => {
      allowBtn.disabled = true;
      denyBtn.disabled = true;
      try {
        const r = await fetch(
          "/api/citizens/" + encodeURIComponent(citizen) + "/approvals/" + encodeURIComponent(id) + "/decision",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ approve: approve, decided_by: "jon" }),
          }
        );
        const body = await r.json().catch(() => ({}));
        if (r.ok) {
          card.classList.add("ac-done");
          notice.textContent = approve ? "Allowed — continuing…" : "Denied.";
          notice.style.display = "";
          setStatus(approve ? "Allowed — " + citizen + " continuing…" : "Denied");
          setPeerChipState(approve ? "working" : "");
        } else {
          notice.textContent = (body.error && body.error.message) || ("Failed (" + r.status + ")");
          notice.style.display = "";
          allowBtn.disabled = false;
          denyBtn.disabled = false;
        }
      } catch (e) {
        notice.textContent = e.message || "Network error";
        notice.style.display = "";
        allowBtn.disabled = false;
        denyBtn.disabled = false;
      }
    };
    allowBtn.addEventListener("click", () => decide(true));
    denyBtn.addEventListener("click", () => decide(false));
    thread().appendChild(card);
    thread().scrollTop = thread().scrollHeight;
    setPeerChipState("gate");
    setStatus(citizen.charAt(0).toUpperCase() + citizen.slice(1) + " needs Gate — Allow below");
  }

  async function pollApprovals() {
    try {
      const r = await fetch("/api/approvals/pending");
      if (!r.ok) return;
      const data = await r.json();
      const inRoom = new Set(state.peers.length ? state.peers : [state.peer]);
      for (const a of (data.approvals || [])) {
        const c = (a.citizen || "").toLowerCase();
        if (inRoom.has(c) || c === "aetheria") {
          if (inRoom.has(c)) setPeerChipState("gate", c);
          renderApprovalCard({
            approval_id: a.id,
            citizen: a.citizen,
            tool: a.tool,
            args: a.args,
          });
        }
      }
    } catch (_) {}
  }

  function startGatePoll() {
    if (state.gatePollTimer) return;
    pollApprovals();
    state.gatePollTimer = setInterval(pollApprovals, 1500);
  }

  function renderHistory(turns) {
    thread().innerHTML = "";
    const peerStates = {};
    (turns || []).forEach((t) => {
      if (t.role === "user") appendBubble("user", t.content, "You");
      else if (t.role === "system") {
        const fromPeer = /^\[From ([^\]]+)\]\n?/.exec(t.content || "");
        if (fromPeer) {
          const name = fromPeer[1];
          appendBubble(
            "assistant",
            (t.content || "").replace(/^\[From [^\]]+\]\n?/, ""),
            name
          );
          peerStates[name.toLowerCase()] = "replied";
          return;
        }
        if (/^Added [A-Za-z]+ to the group/.test(t.content || "")) {
          appendBubble("system", t.content, "Room");
          return;
        }
        const commissioned = /Commissioned ([A-Za-z]+)|Looped in ([A-Za-z]+)/i.exec(t.content || "");
        if (commissioned) {
          const name = (commissioned[1] || commissioned[2] || "").toLowerCase();
          if (name && peerStates[name] !== "replied") peerStates[name] = "working";
        }
        // Hide old instructional welcome chrome from earlier room v0.
        if (/^Room · You \+/.test(t.content || "")) return;
        const m = /⟦room:messaged:([a-z]+)⟧/.exec(t.content || "");
        const who = m ? ("Messaged " + m[1]) : "Room";
        const body = (t.content || "").replace(/⟦room:messaged:[a-z]+⟧\s*/, "");
        if (!body.trim()) return;
        appendBubble("system", body, who);
      } else if (t.role === "assistant") {
        const toPeer = /^\[To ([^\]]+)\]/.exec(t.content || "");
        if (toPeer) {
          appendBubble("assistant", (t.content || "").replace(/^\[To [^\]]+\]\n?/, ""), "Aetheria → " + toPeer[1]);
          const pid = toPeer[1].toLowerCase();
          if (peerStates[pid] !== "replied") peerStates[pid] = "working";
        } else appendBubble("assistant", t.content, "Aetheria");
      }
    });
    renderPeerChips(state.peers.length ? state.peers : [state.peer], peerStates);
  }

  async function openRoom() {
    setStatus("Opening room…");
    const body = { peer: state.peer };
    if (state.dmSessionId) body.dm_session_id = state.dmSessionId;
    if (state.sessionId) body.session_id = state.sessionId;
    const r = await fetch("/api/rooms/open", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok) {
      setStatus((d.error && d.error.message) || "Could not open room");
      return;
    }
    state.sessionId = d.room.session_id;
    state.peers = d.room.peers || [d.room.peer];
    state.peer = state.peers[0] || d.room.peer;
    renderPeerChips(state.peers);
    const u = new URL(location.href);
    u.searchParams.set("session", state.sessionId);
    u.searchParams.set("peer", state.peer);
    if (state.dmSessionId) u.searchParams.set("from", state.dmSessionId);
    history.replaceState({}, "", u);
    if (state.dmSessionId) {
      $("[data-dm-link]").href = "/messages/aetheria?session=" + encodeURIComponent(state.dmSessionId);
    }
    await loadHistory();
    setStatus("");
  }

  async function addPeerToRoom(peer) {
    if (!state.sessionId || !peer) return;
    setStatus("Adding " + peer + "…");
    closeSheets();
    const r = await fetch("/api/rooms/" + encodeURIComponent(state.sessionId) + "/add_peer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ peer }),
    });
    const d = await r.json();
    if (!r.ok) {
      setStatus((d.error && d.error.message) || "Could not add peer");
      return;
    }
    state.peers = d.peers || (d.room && d.room.peers) || state.peers.concat([peer]);
    renderPeerChips(state.peers);
    await loadHistory();
    setStatus("Added " + peer.charAt(0).toUpperCase() + peer.slice(1));
  }

  function openAddSheet() {
    if (!state.sessionId) return;
    const available = ALL_PEERS.filter((p) => !(state.peers || []).includes(p));
    if (!available.length) {
      setStatus("Everyone's already in this group");
      return;
    }
    const ask = $("[data-ask-sheet]");
    const add = $("[data-add-sheet]");
    const composer = document.querySelector(".composer");
    const picks = $("[data-add-picks]");
    if (ask) ask.classList.remove("open");
    picks.innerHTML = "";
    available.forEach((peer) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = peer.charAt(0).toUpperCase() + peer.slice(1);
      btn.addEventListener("click", () => addPeerToRoom(peer));
      picks.appendChild(btn);
    });
    add.classList.add("open");
    if (composer) composer.classList.add("sheet-open");
  }

  async function loadHistory() {
    if (!state.sessionId) return;
    const r = await fetch("/sessions/" + encodeURIComponent(state.sessionId) + "/history");
    if (!r.ok) return;
    const d = await r.json();
    const turns = d.turns || [];
    lastTurnCount = turns.length;
    renderHistory(turns);
  }

  async function sendMessage() {
    const input = $("[data-composer]");
    const msg = (input.value || "").trim();
    if (!msg || !state.sessionId) return;
    input.value = "";
    appendBubble("user", msg, "You");
    setStatus("Aetheria…");
    const respBubbleWho = "Aetheria";
    const placeholder = document.createElement("div");
    placeholder.className = "bubble assistant";
    placeholder.innerHTML = '<div class="who">' + respBubbleWho + '</div><div data-stream-body>…</div>';
    thread().appendChild(placeholder);
    const bodyEl = placeholder.querySelector("[data-stream-body]");
    try {
      const r = await fetch("/chat_stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          agent: "aetheria",
          session_id: state.sessionId,
          message: msg,
        }),
      });
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      let text = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const part of parts) {
          const line = part.split("\n").find((l) => l.startsWith("data: "));
          if (!line) continue;
          const payload = JSON.parse(line.slice(6));
          if (payload.type === "token" && payload.delta) {
            text += payload.delta;
            bodyEl.textContent = text;
            thread().scrollTop = thread().scrollHeight;
          } else if (payload.type === "error") {
            bodyEl.textContent = "error · " + (payload.message || payload.code);
          }
        }
      }
      if (!text) bodyEl.textContent = "(no reply)";
      else {
        bodyEl.className = "md-body";
        bodyEl.innerHTML = renderMarkdown(text);
      }
    } catch (e) {
      bodyEl.textContent = "error · " + e.message;
    }
    setStatus("");
  }

  function openAskSheet() {
    if (!state.sessionId) return;
    const peers = state.peers.length ? state.peers : [state.peer];
    const add = $("[data-add-sheet]");
    const ask = $("[data-ask-sheet]");
    const composer = document.querySelector(".composer");
    const picks = $("[data-ask-picks]");
    const brief = $("[data-ask-brief]");
    if (add) add.classList.remove("open");
    state.askPeerPick = peers[0];
    picks.innerHTML = "";
    peers.forEach((peer) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = peer.charAt(0).toUpperCase() + peer.slice(1);
      if (peer === state.askPeerPick) btn.classList.add("selected");
      btn.addEventListener("click", () => {
        state.askPeerPick = peer;
        picks.querySelectorAll("button").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
      });
      picks.appendChild(btn);
    });
    if (brief) brief.value = "";
    ask.classList.add("open");
    if (composer) composer.classList.add("sheet-open");
    if (brief) brief.focus();
  }

  async function submitAskPeer() {
    if (!state.sessionId) return;
    const peers = state.peers.length ? state.peers : [state.peer];
    const peer = state.askPeerPick || peers[0];
    if (!peers.includes(peer)) {
      setStatus("Pick someone in this group");
      return;
    }
    const brief = (($("[data-ask-brief]") || {}).value || "").trim();
    if (!brief) {
      setStatus("Say what they should check or do");
      return;
    }
    const name = peer.charAt(0).toUpperCase() + peer.slice(1);
    closeSheets();
    setStatus("Commissioning " + name + "…");
    const r = await fetch("/api/rooms/" + encodeURIComponent(state.sessionId) + "/ask_peer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ brief, peer }),
    });
    const d = await r.json();
    if (!r.ok) {
      setStatus((d.error && d.error.message) || "Ask peer failed");
      return;
    }
    await loadHistory();
    setStatus("Messaged " + name + " · waiting on reply…");
    startPoll();
  }

  let pollTimer = null;
  let lastTurnCount = 0;
  function startPoll() {
    if (pollTimer) return;
    pollTimer = setInterval(async () => {
      if (!state.sessionId) return;
      try {
        const r = await fetch("/sessions/" + encodeURIComponent(state.sessionId) + "/history");
        if (!r.ok) return;
        const d = await r.json();
        const turns = d.turns || [];
        if (turns.length !== lastTurnCount) {
          lastTurnCount = turns.length;
          renderHistory(turns);
          const hasReply = turns.some((t) => /^\[From /i.test(t.content || ""));
          if (hasReply) setStatus("New reply in group");
          else setStatus("Waiting on the group…");
        }
      } catch (_) {}
    }, 3000);
  }

  $("[data-send]").addEventListener("click", sendMessage);
  $("[data-composer]").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); sendMessage(); }
  });
  $("[data-ask-peer]").addEventListener("click", openAskSheet);
  $("[data-add-peer]").addEventListener("click", openAddSheet);
  $("[data-ask-send]").addEventListener("click", submitAskPeer);
  $("[data-ask-cancel]").addEventListener("click", closeSheets);
  $("[data-add-cancel]").addEventListener("click", closeSheets);

  bindKeyboardInset();
  openRoom().then(() => {
    startPoll();
    startGatePoll();
  });
})();
</script>
</body>
</html>
