<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room · SOVERYN</title>
<style>
  :root {
    --bg: #0c0b0a; --panel: #161411; --line: rgba(232,227,213,0.12);
    --ink: #e8e3d5; --ink-2: rgba(232,227,213,0.7); --ink-3: rgba(232,227,213,0.45);
    --gold: #c6a664; --mint: #6fb98a; --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; }
  header.room-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header a { color: var(--ink-2); text-decoration: none; font-size: 13px; }
  header a:hover { color: var(--gold); }
  .title { font-weight: 600; letter-spacing: 0.02em; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .chip {
    font-size: 12px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(198,166,100,0.06);
  }
  .chip[data-who="peer"] { border-color: rgba(111,185,138,0.35); color: var(--mint); }
  .chip[data-who="you"] { opacity: 0.85; }
  .thread {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    max-width: 720px; width: 100%; margin: 0 auto;
  }
  .bubble {
    max-width: 85%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.45;
  }
  .bubble.user { align-self: flex-end; border-color: rgba(198,166,100,0.35); }
  .bubble.assistant { align-self: flex-start; }
  .bubble.system { align-self: stretch; font-size: 13px; color: var(--ink-2); background: rgba(111,185,138,0.06); border-color: rgba(111,185,138,0.25); }
  .bubble .who { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  .bubble.system .who { color: var(--mint); }
  .composer {
    max-width: 720px; width: 100%; margin: 0 auto 16px; padding: 0 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .ask-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .ask-row button, .composer-row button, .composer-row select {
    font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  .ask-row button.primary, .composer-row .send {
    background: rgba(198,166,100,0.15); border-color: rgba(198,166,100,0.4); color: var(--gold);
  }
  .composer-row { display: flex; gap: 8px; }
  .composer-row input {
    flex: 1; font: inherit; padding: 10px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: #0f0e0c; color: var(--ink);
  }
  .status { font-size: 12px; color: var(--ink-3); min-height: 1.2em; }
</style>
</head>
<body>
  <header class="room-bar">
    <a href="/">Command</a>
    <a href="/chat?agent=aetheria" data-dm-link>Aetheria DM</a>
    <span class="title">Room</span>
    <div class="chips" data-presence>
      <span class="chip" data-who="you">You</span>
      <span class="chip" data-who="cos">Aetheria</span>
      <span class="chip" data-who="peer" data-peer-chip>Vett</span>
    </div>
  </header>

  <div class="thread" data-testid="thread" role="log" aria-live="polite"></div>

  <div class="composer">
    <div class="ask-row">
      <select data-peer-select aria-label="Peer">
        <option value="vett">Vett</option>
        <option value="eve">Eve</option>
        <option value="kernel">Kernel</option>
        <option value="scotty">Scotty</option>
      </select>
      <button type="button" class="primary" data-ask-peer>Ask peer to check</button>
      <a href="#" data-open-fresh style="align-self:center;font-size:12px;color:var(--ink-3);">New room</a>
    </div>
    <div class="composer-row">
      <input type="text" data-composer placeholder="Message Aetheria in this room…" aria-label="Message">
      <button type="button" class="send" data-send>↑</button>
    </div>
    <div class="status" data-status></div>
  </div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const state = {
    peer: (params.get("peer") || "vett").toLowerCase(),
    sessionId: params.get("session") || null,
    dmSessionId: params.get("from") || null,
    stream: true,
  };

  const $ = (s) => document.querySelector(s);
  const thread = () => $("[data-testid=thread]");
  const status = () => $("[data-status]");

  function setStatus(t) { status().textContent = t || ""; }

  function esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function appendBubble(role, content, who) {
    const b = document.createElement("div");
    b.className = "bubble " + role;
    if (who) {
      const w = document.createElement("div");
      w.className = "who";
      w.textContent = who;
      b.appendChild(w);
    }
    const body = document.createElement("div");
    body.textContent = content;
    b.appendChild(body);
    thread().appendChild(b);
    thread().scrollTop = thread().scrollHeight;
  }

  function renderHistory(turns) {
    thread().innerHTML = "";
    (turns || []).forEach((t) => {
      if (t.role === "user") appendBubble("user", t.content, "You");
      else if (t.role === "system") {
        const m = /⟦room:messaged:([a-z]+)⟧/.exec(t.content || "");
        const who = m ? ("Messaged " + m[1]) : "Room";
        appendBubble("system", (t.content || "").replace(/⟦room:messaged:[a-z]+⟧\s*/, ""), who);
      } else if (t.role === "assistant") appendBubble("assistant", t.content, "Aetheria");
    });
  }

  async function openRoom() {
    setStatus("Opening room…");
    const body = { peer: state.peer };
    if (state.dmSessionId) body.dm_session_id = state.dmSessionId;
    if (state.sessionId) body.session_id = state.sessionId;
    const r = await fetch("/api/rooms/open", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok) {
      setStatus((d.error && d.error.message) || "Could not open room");
      return;
    }
    state.sessionId = d.room.session_id;
    state.peer = d.room.peer;
    $("[data-peer-chip]").textContent = state.peer.charAt(0).toUpperCase() + state.peer.slice(1);
    $("[data-peer-select]").value = state.peer;
    const u = new URL(location.href);
    u.searchParams.set("session", state.sessionId);
    u.searchParams.set("peer", state.peer);
    if (state.dmSessionId) u.searchParams.set("from", state.dmSessionId);
    history.replaceState({}, "", u);
    if (state.dmSessionId) {
      $("[data-dm-link]").href = "/chat?agent=aetheria&session=" + encodeURIComponent(state.dmSessionId);
    }
    await loadHistory();
    setStatus("Room ready · peer " + state.peer);
  }

  async function loadHistory() {
    if (!state.sessionId) return;
    const r = await fetch("/sessions/" + encodeURIComponent(state.sessionId) + "/history");
    if (!r.ok) return;
    const d = await r.json();
    renderHistory(d.turns || []);
  }

  async function sendMessage() {
    const input = $("[data-composer]");
    const msg = (input.value || "").trim();
    if (!msg || !state.sessionId) return;
    input.value = "";
    appendBubble("user", msg, "You");
    setStatus("Aetheria…");
    const respBubbleWho = "Aetheria";
    const placeholder = document.createElement("div");
    placeholder.className = "bubble assistant";
    placeholder.innerHTML = '<div class="who">' + respBubbleWho + '</div><div data-stream-body>…</div>';
    thread().appendChild(placeholder);
    const bodyEl = placeholder.querySelector("[data-stream-body]");
    try {
      const r = await fetch("/chat_stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          agent: "aetheria",
          session_id: state.sessionId,
          message: msg,
        }),
      });
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      let text = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const part of parts) {
          const line = part.split("\n").find((l) => l.startsWith("data: "));
          if (!line) continue;
          const payload = JSON.parse(line.slice(6));
          if (payload.type === "token" && payload.delta) {
            text += payload.delta;
            bodyEl.textContent = text;
            thread().scrollTop = thread().scrollHeight;
          } else if (payload.type === "error") {
            bodyEl.textContent = "error · " + (payload.message || payload.code);
          }
        }
      }
      if (!text) bodyEl.textContent = "(no reply)";
    } catch (e) {
      bodyEl.textContent = "error · " + e.message;
    }
    setStatus("");
  }

  async function askPeer() {
    if (!state.sessionId) return;
    const brief = prompt("What should " + state.peer + " check or do?");
    if (!brief) return;
    setStatus("Commissioning " + state.peer + "…");
    const r = await fetch("/api/rooms/" + encodeURIComponent(state.sessionId) + "/ask_peer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ brief }),
    });
    const d = await r.json();
    if (!r.ok) {
      setStatus((d.error && d.error.message) || "Ask peer failed");
      return;
    }
    await loadHistory();
    setStatus("Messaged " + state.peer + " · commission " + ((d.event && d.event.commission_id) || ""));
  }

  $("[data-peer-select]").addEventListener("change", async (ev) => {
    state.peer = ev.target.value;
    state.sessionId = null;
    await openRoom();
  });
  $("[data-open-fresh]").addEventListener("click", async (ev) => {
    ev.preventDefault();
    state.sessionId = null;
    await openRoom();
  });
  $("[data-send]").addEventListener("click", sendMessage);
  $("[data-composer]").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); sendMessage(); }
  });
  $("[data-ask-peer]").addEventListener("click", askPeer);

  openRoom();
})();
</script>
</body>
</html>
