<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room · SOVERYN</title>
<style>
  :root {
    --bg: #000; --panel: #0c0b0a; --line: rgba(255,255,255,0.08);
    --ink: #f5f2ea; --ink-2: rgba(245,242,234,0.7); --ink-3: rgba(245,242,234,0.45);
    --gold: #c6a664; --mint: #6fb98a;
    --bubble-them: #1c1a17; --bubble-me: #2a2418;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  }
  header.room-bar {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  header a { color: var(--gold); text-decoration: none; font-size: 15px; }
  .title { font-weight: 600; font-size: 17px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .chip {
    font-size: 12px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: rgba(198,166,100,0.08);
  }
  .chip[data-who="peer"] { border-color: rgba(111,185,138,0.35); color: var(--mint); }
  .chip[data-who="peer"][data-state="working"] {
    animation: peer-work 1.4s ease-in-out infinite;
    border-color: rgba(111,185,138,0.7);
  }
  .chip[data-who="peer"][data-state="replied"] {
    border-color: rgba(198,166,100,0.65); color: var(--gold);
  }
  @keyframes peer-work {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.65; }
  }
  .chip[data-who="you"] { opacity: 0.85; }
  .thread {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 18px;
    white-space: pre-wrap; word-break: break-word; font-size: 16px; line-height: 1.35;
  }
  .bubble.user {
    align-self: flex-end; background: var(--bubble-me);
    border: 1px solid rgba(198,166,100,0.25); border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 4px;
  }
  .bubble.system {
    align-self: center; max-width: 92%; font-size: 13px; color: var(--ink-2);
    background: rgba(111,185,138,0.08); border-radius: 12px; padding: 8px 12px;
  }
  .bubble .who {
    font-size: 11px; letter-spacing: 0.04em; color: var(--gold); margin-bottom: 4px; font-weight: 600;
  }
  .bubble.system .who { color: var(--mint); }
  .composer {
    padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px;
  }
  .ask-row {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    justify-content: flex-start;
  }
  .ask-row button {
    font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: transparent;
    color: var(--ink-3); cursor: pointer;
  }
  .ask-row button:active { color: var(--ink); border-color: rgba(111,185,138,0.35); }
  .composer-row { display: flex; gap: 8px; align-items: center; }
  .composer-row input {
    flex: 1; font: inherit; font-size: 16px; padding: 10px 14px; border-radius: 20px;
    border: 1px solid var(--line); background: #141210; color: var(--ink);
  }
  .composer-row .send {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--gold); color: #0c0b0a; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .status { font-size: 12px; color: var(--ink-3); min-height: 1.2em; }
</style>
</head>
<body>
  <header class="room-bar">
    <a href="/messages">‹ Messages</a>
    <a href="/messages/aetheria" data-dm-link>Aetheria</a>
    <span class="title">Group</span>
    <div class="chips" data-presence>
      <span class="chip" data-who="you">You</span>
      <span class="chip" data-who="cos">Aetheria</span>
      <span class="chip" data-who="peer" data-peer-chip>Vett</span>
    </div>
  </header>

  <div class="thread" data-testid="thread" role="log" aria-live="polite"></div>

  <div class="composer">
    <div class="composer-row">
      <input type="text" data-composer placeholder="iMessage" aria-label="Message">
      <button type="button" class="send" data-send>↑</button>
    </div>
    <div class="ask-row">
      <button type="button" data-ask-peer title="Loop the peer in again">+ peer</button>
    </div>
    <div class="status" data-status></div>
  </div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const state = {
    peer: (params.get("peer") || "vett").toLowerCase(),
    sessionId: params.get("session") || null,
    dmSessionId: params.get("from") || null,
    stream: true,
  };

  const $ = (s) => document.querySelector(s);
  const thread = () => $("[data-testid=thread]");
  const status = () => $("[data-status]");

  function setStatus(t) { status().textContent = t || ""; }

  function esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function appendBubble(role, content, who) {
    const b = document.createElement("div");
    b.className = "bubble " + role;
    if (who) {
      const w = document.createElement("div");
      w.className = "who";
      w.textContent = who;
      b.appendChild(w);
    }
    const body = document.createElement("div");
    body.textContent = content;
    b.appendChild(body);
    thread().appendChild(b);
    thread().scrollTop = thread().scrollHeight;
  }

  function setPeerChipState(st) {
    const chip = $("[data-peer-chip]");
    if (!chip) return;
    chip.dataset.state = st || "";
    const base = state.peer.charAt(0).toUpperCase() + state.peer.slice(1);
    chip.textContent = st === "working" ? base + " · working" : st === "replied" ? base + " · replied" : base;
  }

  function renderHistory(turns) {
    thread().innerHTML = "";
    let peerState = "";
    (turns || []).forEach((t) => {
      if (t.role === "user") appendBubble("user", t.content, "You");
      else if (t.role === "system") {
        const fromPeer = /^\[From ([^\]]+)\]\n?/.exec(t.content || "");
        if (fromPeer) {
          appendBubble(
            "assistant",
            (t.content || "").replace(/^\[From [^\]]+\]\n?/, ""),
            fromPeer[1]
          );
          peerState = "replied";
          return;
        }
        if (/waiting on reply|Looped in|Commissioned/i.test(t.content || "")) {
          if (peerState !== "replied") peerState = "working";
        }
        // Hide old instructional welcome chrome from earlier room v0.
        if (/^Room · You \+/.test(t.content || "")) return;
        const m = /⟦room:messaged:([a-z]+)⟧/.exec(t.content || "");
        const who = m ? ("Messaged " + m[1]) : "Room";
        const body = (t.content || "").replace(/⟦room:messaged:[a-z]+⟧\s*/, "");
        if (!body.trim()) return;
        appendBubble("system", body, who);
      } else if (t.role === "assistant") {
        const toPeer = /^\[To ([^\]]+)\]/.exec(t.content || "");
        if (toPeer) {
          appendBubble("assistant", (t.content || "").replace(/^\[To [^\]]+\]\n?/, ""), "Aetheria → " + toPeer[1]);
          if (peerState !== "replied") peerState = "working";
        } else appendBubble("assistant", t.content, "Aetheria");
      }
    });
    setPeerChipState(peerState);
  }

  async function openRoom() {
    setStatus("Opening room…");
    const body = { peer: state.peer };
    if (state.dmSessionId) body.dm_session_id = state.dmSessionId;
    if (state.sessionId) body.session_id = state.sessionId;
    const r = await fetch("/api/rooms/open", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok) {
      setStatus((d.error && d.error.message) || "Could not open room");
      return;
    }
    state.sessionId = d.room.session_id;
    state.peer = d.room.peer;
    $("[data-peer-chip]").textContent = state.peer.charAt(0).toUpperCase() + state.peer.slice(1);
    const askBtn = $("[data-ask-peer]");
    if (askBtn) {
      const name = state.peer.charAt(0).toUpperCase() + state.peer.slice(1);
      askBtn.textContent = "+ " + name;
      askBtn.title = "Loop " + name + " in again";
    }
    const u = new URL(location.href);
    u.searchParams.set("session", state.sessionId);
    u.searchParams.set("peer", state.peer);
    if (state.dmSessionId) u.searchParams.set("from", state.dmSessionId);
    history.replaceState({}, "", u);
    if (state.dmSessionId) {
      $("[data-dm-link]").href = "/messages/aetheria?session=" + encodeURIComponent(state.dmSessionId);
    }
    await loadHistory();
    setStatus("");
  }

  async function loadHistory() {
    if (!state.sessionId) return;
    const r = await fetch("/sessions/" + encodeURIComponent(state.sessionId) + "/history");
    if (!r.ok) return;
    const d = await r.json();
    const turns = d.turns || [];
    lastTurnCount = turns.length;
    renderHistory(turns);
  }

  async function sendMessage() {
    const input = $("[data-composer]");
    const msg = (input.value || "").trim();
    if (!msg || !state.sessionId) return;
    input.value = "";
    appendBubble("user", msg, "You");
    setStatus("Aetheria…");
    const respBubbleWho = "Aetheria";
    const placeholder = document.createElement("div");
    placeholder.className = "bubble assistant";
    placeholder.innerHTML = '<div class="who">' + respBubbleWho + '</div><div data-stream-body>…</div>';
    thread().appendChild(placeholder);
    const bodyEl = placeholder.querySelector("[data-stream-body]");
    try {
      const r = await fetch("/chat_stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          agent: "aetheria",
          session_id: state.sessionId,
          message: msg,
        }),
      });
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      let text = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const part of parts) {
          const line = part.split("\n").find((l) => l.startsWith("data: "));
          if (!line) continue;
          const payload = JSON.parse(line.slice(6));
          if (payload.type === "token" && payload.delta) {
            text += payload.delta;
            bodyEl.textContent = text;
            thread().scrollTop = thread().scrollHeight;
          } else if (payload.type === "error") {
            bodyEl.textContent = "error · " + (payload.message || payload.code);
          }
        }
      }
      if (!text) bodyEl.textContent = "(no reply)";
    } catch (e) {
      bodyEl.textContent = "error · " + e.message;
    }
    setStatus("");
  }

  async function askPeer() {
    if (!state.sessionId) return;
    const brief = prompt("What should " + state.peer + " check or do?");
    if (!brief) return;
    setStatus("Commissioning " + state.peer + "…");
    const r = await fetch("/api/rooms/" + encodeURIComponent(state.sessionId) + "/ask_peer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ brief }),
    });
    const d = await r.json();
    if (!r.ok) {
      setStatus((d.error && d.error.message) || "Ask peer failed");
      return;
    }
    await loadHistory();
    setStatus("Messaged " + state.peer + " · waiting on reply…");
    startPoll();
  }

  let pollTimer = null;
  let lastTurnCount = 0;
  function startPoll() {
    if (pollTimer) return;
    pollTimer = setInterval(async () => {
      if (!state.sessionId) return;
      try {
        const r = await fetch("/sessions/" + encodeURIComponent(state.sessionId) + "/history");
        if (!r.ok) return;
        const d = await r.json();
        const turns = d.turns || [];
        if (turns.length !== lastTurnCount) {
          lastTurnCount = turns.length;
          renderHistory(turns);
          const hasReply = turns.some((t) => /^\[From /i.test(t.content || ""));
          if (hasReply) setStatus(state.peer.charAt(0).toUpperCase() + state.peer.slice(1) + " replied");
          else setStatus("Waiting on " + state.peer + "…");
        }
      } catch (_) {}
    }, 3000);
  }

  $("[data-send]").addEventListener("click", sendMessage);
  $("[data-composer]").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); sendMessage(); }
  });
  $("[data-ask-peer]").addEventListener("click", askPeer);

  openRoom().then(() => {
    startPoll();
  });
})();
</script>
</body>
</html>
