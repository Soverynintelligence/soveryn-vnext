<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOVERYN · Chat</title>
<style>
  :root {
    --canvas:#000000;
    --earth:#4e2d11;
    --leaf:#455142;
    --slate:#2a4459;
    --node:#75cbe8;
    --bronze:#986d42;
    --gold:#af9a6d;
    --text:#ecf3f4;
    --glass-bg:rgba(20,24,32,0.62);
    --glass-border:rgba(255,255,255,0.06);
    --glass-blur:blur(22px) saturate(140%);
    --r-lg:22px;
    --r-md:14px;
    --r-sm:10px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--canvas); color:var(--text); font-family:var(--font); font-size:14px; }
  body { display:grid; grid-template-columns:280px 1fr 0; grid-template-rows:100vh; height:100vh; overflow:hidden; }
  button { font-family:var(--font); color:var(--text); background:transparent; border:none; cursor:pointer; }

  /* Sidebar */
  aside {
    background:var(--glass-bg);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    border-right:1px solid var(--glass-border);
    display:flex; flex-direction:column;
    padding:16px;
    gap:12px;
  }
  .brand { display:flex; justify-content:space-between; align-items:center; padding:4px 6px 12px; }
  .brand .wordmark { font-weight:600; letter-spacing:0.18em; color:var(--gold); font-size:13px; }
  .brand .home { color:rgba(236,243,244,0.55); font-size:11px; text-decoration:none; }
  .brand .home:hover { color:var(--text); }

  .new-chat {
    background:linear-gradient(180deg,rgba(117,203,232,0.18),rgba(117,203,232,0.08));
    border:1px solid rgba(117,203,232,0.35);
    color:var(--text);
    padding:10px 14px; border-radius:var(--r-md);
    font-size:13px; font-weight:500;
    text-align:left;
  }
  .new-chat:hover { border-color:rgba(117,203,232,0.6); }

  .agent-pills { display:flex; gap:6px; }
  .agent-pill {
    flex:1; padding:8px 10px; border-radius:var(--r-sm);
    background:rgba(255,255,255,0.03);
    border:1px solid var(--glass-border);
    font-size:11px; font-weight:500;
    text-align:center;
    color:rgba(236,243,244,0.7);
  }
  .agent-pill[aria-pressed="true"] {
    background:rgba(175,154,109,0.14);
    border-color:rgba(175,154,109,0.4);
    color:var(--text);
  }
  .agent-pill[data-agent="aetheria"][aria-pressed="true"] { border-color:rgba(175,154,109,0.5); }
  .agent-pill[data-agent="vett"][aria-pressed="true"] { border-color:rgba(117,203,232,0.45); }
  .agent-pill[data-agent="scotty"][aria-pressed="true"] { border-color:rgba(69,81,66,0.6); }

  .search input {
    width:100%; padding:8px 12px; border-radius:var(--r-sm);
    background:rgba(255,255,255,0.03);
    border:1px solid var(--glass-border);
    color:var(--text); font-size:12px; outline:none;
  }
  .search input:focus { border-color:rgba(117,203,232,0.45); }

  .history { flex:1; overflow-y:auto; padding-right:4px; }
  .history h4 { font-size:10px; color:rgba(236,243,244,0.45); text-transform:uppercase; letter-spacing:0.12em; margin:14px 0 6px; padding:0 4px; }
  .history a {
    display:flex; align-items:center; gap:8px;
    padding:7px 8px; border-radius:8px;
    color:rgba(236,243,244,0.82); text-decoration:none;
    font-size:12px;
    border-left:2px solid transparent;
  }
  .history a:hover { background:rgba(255,255,255,0.04); }
  .history a.active { background:rgba(175,154,109,0.08); border-left-color:var(--gold); color:var(--text); }
  .history .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }

  .profile {
    border-top:1px solid var(--glass-border);
    padding:10px 6px 4px;
    display:flex; align-items:center; gap:10px;
    font-size:12px;
  }
  .profile .avatar { width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,var(--earth),var(--bronze)); }
  .profile .who { flex:1; }
  .profile .who div:first-child { color:var(--text); }
  .profile .who div:last-child { color:rgba(236,243,244,0.45); font-size:10px; }
  .profile .cog { color:rgba(236,243,244,0.55); }
  .profile .cog:hover { color:var(--text); }

  main { display:flex; flex-direction:column; }

  /* Header */
  .chat-header {
    display:flex; align-items:center; gap:14px;
    padding:14px 24px;
    border-bottom:1px solid var(--glass-border);
    background:var(--glass-bg);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
  }
  .chat-header .disc { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--bronze)); flex-shrink:0; }
  .chat-header .meta { flex:1; }
  .chat-header .meta .title { font-size:14px; font-weight:500; }
  .chat-header .meta .sub { font-size:11px; color:rgba(236,243,244,0.5); margin-top:2px; }
  .chat-header .actions { display:flex; gap:6px; }
  .chat-header .actions button { color:rgba(236,243,244,0.55); padding:6px 8px; border-radius:8px; font-size:14px; }
  .chat-header .actions button:hover { background:rgba(255,255,255,0.04); color:var(--text); }

  /* Thread */
  .thread {
    flex:1; overflow-y:auto;
    padding:24px 32px 140px;
    display:flex; flex-direction:column; gap:18px;
  }
  .bubble {
    max-width:78%;
    padding:12px 18px;
    border-radius:var(--r-md);
    font-size:14px; line-height:1.55;
    white-space:pre-wrap; word-wrap:break-word;
  }
  .bubble.user {
    align-self:flex-end;
    background:rgba(117,203,232,0.14);
    border:1px solid rgba(117,203,232,0.22);
    border-bottom-right-radius:4px;
  }
  .bubble.assistant {
    align-self:flex-start;
    background:var(--glass-bg);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-border);
    border-bottom-left-radius:4px;
  }
  .bubble .thinking-placeholder {
    color:rgba(236,243,244,0.45);
    font-style:italic;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:0.35 } 50% { opacity:0.85 } }
  .bubble .cursor {
    display:inline-block; width:6px; height:14px;
    background:var(--node); vertical-align:middle; margin-left:2px;
    animation:blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity:0 } }

  /* Composer */
  .composer {
    position:absolute; left:16px; right:16px; bottom:24px;
    display:flex; align-items:center; gap:10px;
    padding:10px 14px;
    background:var(--glass-bg);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-border);
    border-radius:30px;
  }
  .composer input {
    flex:1; padding:8px 10px;
    background:transparent; border:none; outline:none;
    color:var(--text); font-size:14px;
  }
  .composer .stream-toggle {
    font-size:11px; color:rgba(236,243,244,0.55);
    padding:6px 10px; border-radius:14px;
    background:rgba(255,255,255,0.04);
  }
  .composer .send {
    width:32px; height:32px; border-radius:50%;
    background:var(--node); color:#000;
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
  }
  .composer .send:disabled { opacity:0.4; cursor:default; }
  main { position:relative; min-height:0; }
  main > .thread { min-height:0; }
</style>
</head>
<body>
  <aside data-testid="sidebar">
    <div class="brand">
      <div class="wordmark">SOVERYN</div>
      <a href="/" class="home" data-testid="mission-control-link">⌂ mission control</a>
    </div>

    <button class="new-chat" data-testid="new-chat">+ New conversation</button>

    <div class="agent-pills" role="tablist" aria-label="Select agent">
      <button class="agent-pill" data-agent="aetheria" role="tab" aria-pressed="true">aetheria</button>
      <button class="agent-pill" data-agent="vett"     role="tab" aria-pressed="false">vett</button>
      <button class="agent-pill" data-agent="scotty"   role="tab" aria-pressed="false">scotty</button>
    </div>

    <div class="search"><input type="search" placeholder="Search chats" data-testid="search"></div>

    <div class="history" data-testid="history">
      <h4>Today</h4>
      <a href="#" class="active"><span class="dot" style="background:var(--gold)"></span>Session loading…</a>
    </div>

    <div class="profile">
      <div class="avatar"></div>
      <div class="who">
        <div>Jon</div>
        <div>localhost · vNext</div>
      </div>
      <button class="cog" aria-label="Settings">⚙</button>
    </div>
  </aside>

  <main data-testid="main">
    <header class="chat-header" data-testid="chat-header">
      <div class="disc" data-agent-disc></div>
      <div class="meta">
        <div class="title" data-agent-name>aetheria</div>
        <div class="sub" data-session-meta>new session</div>
      </div>
      <div class="actions">
        <button title="Persona inspector" aria-label="Persona">ⓘ</button>
        <button title="Export" aria-label="Export">⤓</button>
        <button title="More" aria-label="More">⋯</button>
      </div>
    </header>

    <div class="thread" data-testid="thread"></div>

    <form class="composer" data-testid="composer" onsubmit="return false">
      <input type="text" placeholder="Message…" data-testid="composer-input" autofocus>
      <button type="button" class="stream-toggle" data-testid="stream-toggle">stream ▾</button>
      <button type="submit" class="send" data-testid="send" aria-label="Send">↑</button>
    </form>
  </main>
<script>
(() => {
  const ACTIVE_AGENTS = ["aetheria","vett","scotty"];
  const AGENT_COLORS = { aetheria:"var(--gold)", vett:"var(--node)", scotty:"var(--leaf)" };

  // ─── State ─────────────────────────────────────────────────────────────────
  const state = {
    agent: null,
    sessionId: null,
    sessions: [],
    stream: localStorage.getItem("soveryn.stream") !== "false",
    abort: null,
  };

  // ─── History grouping ─────────────────────────────────────────────────────
  const HISTORY_BUCKETS = ["Today", "Yesterday", "Previous 7 days", "Previous 30 days", "Older"];

  function bucketFor(updatedAt) {
    const now = new Date();
    const then = new Date(updatedAt);
    const days = Math.floor((now - then) / (1000 * 60 * 60 * 24));
    if (days < 1) return "Today";
    if (days < 2) return "Yesterday";
    if (days < 7) return "Previous 7 days";
    if (days < 30) return "Previous 30 days";
    return "Older";
  }

  async function loadSessions() {
    const r = await fetch(`/sessions?agent=${state.agent}&limit=100`);
    if (!r.ok) return;
    const data = await r.json();
    state.sessions = data.sessions || [];
    renderHistory();
  }

  function renderHistory() {
    const grouped = {};
    for (const b of HISTORY_BUCKETS) grouped[b] = [];
    const q = (document.querySelector('[data-testid="search"]').value || "").toLowerCase();
    for (const s of state.sessions) {
      if (q && !(s.title || "").toLowerCase().includes(q)) continue;
      grouped[bucketFor(s.updated_at)].push(s);
    }
    const host = elHistory();
    host.innerHTML = "";
    for (const bucket of HISTORY_BUCKETS) {
      const items = grouped[bucket];
      if (!items.length) continue;
      const h = document.createElement("h4");
      h.textContent = bucket;
      host.appendChild(h);
      for (const s of items) {
        const a = document.createElement("a");
        a.href = `/chat/${s.session_id}`;
        if (s.session_id === state.sessionId) a.className = "active";
        a.innerHTML = `<span class="dot" style="background:${AGENT_COLORS[s.agent] || "var(--gold)"}"></span>${s.title || "(untitled)"}`;
        host.appendChild(a);
      }
    }
  }

  // ─── URL parsing ───────────────────────────────────────────────────────────
  function parseUrl() {
    const path = window.location.pathname;
    const m = path.match(/^\/chat\/([^/]+)$/);
    if (m) return { sessionId: m[1], agent: null };
    const sp = new URLSearchParams(window.location.search);
    return { sessionId: null, agent: sp.get("agent") };
  }

  function pickInitialAgent(urlAgent) {
    if (urlAgent && ACTIVE_AGENTS.includes(urlAgent.toLowerCase())) {
      return urlAgent.toLowerCase();
    }
    const stored = localStorage.getItem("soveryn.agent");
    if (stored && ACTIVE_AGENTS.includes(stored)) return stored;
    return "aetheria";
  }

  // ─── DOM helpers ───────────────────────────────────────────────────────────
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));
  const elThread = () => $('[data-testid="thread"]');
  const elInput  = () => $('[data-testid="composer-input"]');
  const elSend   = () => $('[data-testid="send"]');
  const elStreamToggle = () => $('[data-testid="stream-toggle"]');
  const elHistory = () => $('[data-testid="history"]');
  const elAgentName = () => $('[data-agent-name]');
  const elAgentDisc = () => $('[data-agent-disc]');
  const elSessionMeta = () => $('[data-session-meta]');

  function setAgent(name) {
    state.agent = name;
    localStorage.setItem("soveryn.agent", name);
    $$('.agent-pill').forEach(p => p.setAttribute("aria-pressed", String(p.dataset.agent === name)));
    elAgentName().textContent = name;
    elAgentDisc().style.background = `linear-gradient(135deg, ${AGENT_COLORS[name] || "var(--gold)"}, var(--bronze))`;
    loadSessions();
  }

  function appendBubble(role, content, opts = {}) {
    const div = document.createElement("div");
    div.className = `bubble ${role}`;
    if (opts.placeholder) {
      const span = document.createElement("span");
      span.className = "thinking-placeholder";
      span.textContent = "thinking…";
      div.appendChild(span);
    } else {
      div.textContent = content;
    }
    elThread().appendChild(div);
    elThread().scrollTop = elThread().scrollHeight;
    return div;
  }

  // ─── Session minting ───────────────────────────────────────────────────────
  // Backend requires session_id on every /chat and /chat_stream POST. We mint
  // lazily before the first send (or after new-chat / agent switch).
  async function ensureSession() {
    if (state.sessionId) return state.sessionId;
    const r = await fetch("/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ agent: state.agent }),
    });
    if (!r.ok) throw new Error(`failed to mint session: ${r.status}`);
    const data = await r.json();
    state.sessionId = data.session_id;
    window.history.replaceState({}, "", `/chat/${data.session_id}`);
    return state.sessionId;
  }

  // ─── Streaming (POST + ReadableStream) ─────────────────────────────────────
  async function sendStreaming(message) {
    appendBubble("user", message);
    const respBubble = appendBubble("assistant", "", { placeholder: true });
    let cleared = false;
    let finalContent = "";

    try {
      await ensureSession();
    } catch (e) {
      respBubble.textContent = `error · ${e.message}`;
      return;
    }

    state.abort = new AbortController();
    try {
      const r = await fetch("/chat_stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ agent: state.agent, session_id: state.sessionId, message }),
        signal: state.abort.signal,
      });
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        // SSE parse: chunks split by \n\n, each line starts "data: "
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const part of parts) {
          const line = part.split("\n").find(l => l.startsWith("data: "));
          if (!line) continue;
          const payload = JSON.parse(line.slice(6));
          if (payload.type === "token" && payload.delta) {
            if (!cleared) { respBubble.textContent = ""; cleared = true; }
            respBubble.textContent += payload.delta;
            finalContent += payload.delta;
            elThread().scrollTop = elThread().scrollHeight;
          } else if (payload.type === "done") {
            // Fallback: if deltas were dropped, render the canonical accumulated content.
            if (!cleared && payload.content) {
              respBubble.textContent = payload.content;
              cleared = true;
            }
          } else if (payload.type === "error") {
            respBubble.textContent = `error · ${payload.code}: ${payload.message}`;
            return;
          }
        }
      }
    } catch (e) {
      if (e.name === "AbortError") {
        if (!cleared) respBubble.textContent = "(stopped)";
      } else {
        respBubble.textContent = `error · ${e.message}`;
      }
    } finally {
      state.abort = null;
    }
  }

  // ─── Sync send ─────────────────────────────────────────────────────────────
  async function sendSync(message) {
    appendBubble("user", message);
    const respBubble = appendBubble("assistant", "", { placeholder: true });
    try {
      await ensureSession();
      const r = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ agent: state.agent, session_id: state.sessionId, message }),
      });
      const data = await r.json();
      if (data.error) {
        respBubble.textContent = `error · ${data.error.code}: ${data.error.message}`;
      } else {
        respBubble.textContent = data.content || "";
      }
    } catch (e) {
      respBubble.textContent = `error · ${e.message}`;
    }
  }

  async function loadHistory(sessionId) {
    try {
      const r = await fetch(`/sessions/${sessionId}/history`);
      if (!r.ok) return;
      const data = await r.json();
      elThread().innerHTML = "";
      for (const t of data.turns || []) {
        if (t.role === "user" || t.role === "assistant") appendBubble(t.role, t.content);
      }
      elSessionMeta().textContent = `${(data.turns || []).length} messages`;
    } catch { /* noop */ }
  }

  // ─── Events ────────────────────────────────────────────────────────────────
  function bindEvents() {
    $$('.agent-pill').forEach(p => {
      p.addEventListener("click", () => {
        setAgent(p.dataset.agent);
        state.sessionId = null;
        elThread().innerHTML = "";
        elSessionMeta().textContent = "new session";
        window.history.replaceState({}, "", "/chat");
      });
    });

    elSend().addEventListener("click", onSubmit);
    elInput().addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); onSubmit(); }
    });
    elStreamToggle().addEventListener("click", () => {
      state.stream = !state.stream;
      localStorage.setItem("soveryn.stream", String(state.stream));
      elStreamToggle().textContent = state.stream ? "stream ▾" : "sync  ▾";
    });

    $('[data-testid="new-chat"]').addEventListener("click", () => {
      state.sessionId = null;
      elThread().innerHTML = "";
      elSessionMeta().textContent = "new session";
      window.history.replaceState({}, "", "/chat");
      elInput().focus();
    });

    document.querySelector('[data-testid="search"]').addEventListener("input", renderHistory);
  }

  async function onSubmit() {
    const msg = elInput().value.trim();
    if (!msg) return;
    elInput().value = "";
    if (state.stream) await sendStreaming(msg);
    else await sendSync(msg);
  }

  // ─── Boot ──────────────────────────────────────────────────────────────────
  function boot() {
    const { sessionId, agent } = parseUrl();
    setAgent(pickInitialAgent(agent));
    state.sessionId = sessionId;
    elStreamToggle().textContent = state.stream ? "stream ▾" : "sync  ▾";
    bindEvents();
    loadSessions();
    if (sessionId) loadHistory(sessionId);
  }
  document.addEventListener("DOMContentLoaded", boot);
})();
</script>
</body>
</html>
