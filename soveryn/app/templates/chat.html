<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOVERYN · Chat</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="/static/lab-favicon.png">
<link rel="stylesheet" href="/static/lab-console.css">
<link rel="stylesheet" href="/static/voice/presence.css?v=alive5">
<style>

  :root {
    /* Lab console face (matches Command Center + mobile MC).
       Pure black ground, gold instrument chrome. Agent discs keep identity
       sheens; UI chrome no longer reverts to copper/sage. */
    --ground: #000000;
    --panel: #0a0a09;
    --panel-2: #151412;
    --line: #26241f;
    --line-lit: #38352e;
    --ink: #e9e5dc;
    --ink-2: #9a9384;
    --ink-3: #655f55;
    --gold: #c6a664;
    --gold-dim: #7a6740;
    --ok: #6fb98a;
    --down: #b4685c;

    --sov-canvas: var(--ground);
    --sov-sage-bright: var(--ok);
    --sov-sage-deep: #3d6b4f;
    --sov-olive: var(--ink-2);
    --sov-bronze: var(--gold);
    --sov-maroon: var(--down);
    --sov-maroon-bright: #c47a6e;
    --sov-deep-blue: #404e59;
    --sov-electric-blue: #6b8290;
    --sov-sage: var(--ok);
    --sov-gray: var(--ink-2);
    --sov-amber: var(--gold);
    --text: var(--ink);
    --text-dim: var(--ink-2);

    /* Agent identity discs only (not page chrome) */
    --copper-sheen: linear-gradient(115deg, #7a6740 0%, #c6a664 40%, #e0c98a 49%, #c6a664 60%, #5a4a2e 100%);
    --sage-sheen: linear-gradient(115deg, #7a6740 0%, #c6a664 45%, #d4b577 55%, #7a6740 100%);
    --steel-sheen: linear-gradient(115deg, #404e59 0%, #5f7684 40%, #7d94a3 49%, #556a77 60%, #303b44 100%);
    --maroon-sheen: linear-gradient(115deg, #6b3323 0%, #a3543a 40%, #c26a4c 49%, #8f4831 60%, #54271b 100%);

    --canvas: var(--ground);
    --earth: var(--panel-2);
    --leaf: var(--gold);
    --slate: var(--panel-2);
    --node: var(--gold);
    --bronze: var(--gold);
    --copper: var(--gold);

    --glass-bg: var(--panel);
    --glass-border: var(--line);
    --glass-blur: none;
    --r-lg: 0;
    --r-md: 3px;
    --r-sm: 3px;
    --font: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --mono: var(--font);
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--ground); color:var(--ink); font-family:var(--font); font-size:14px; }

  /* No medallion wallpaper on the lab face — ruled gold grid comes from body.lab */
  body::before, body::after { display: none !important; content: none !important; }
  aside, main { position:relative; z-index:1; }
  /* 100vh fallback + 100dvh override for browsers that support dynamic viewport
     height. dvh shrinks with the mobile URL bar so the composer never falls
     below the visible area. */
  body {
    display:grid; grid-template-columns:280px 1fr 0;
    grid-template-rows:100vh; height:100vh;
    overflow:hidden;
    transition:grid-template-columns 0.18s ease;
  }
  @supports (height: 100dvh) {
    body { grid-template-rows:100dvh; height:100dvh; }
  }
  /* Collapsed sidebar: the column goes to 0 and the sidebar's overflow
     hides its contents during the slide. The toggle in the chat-header
     stays visible because it lives in <main>, not in <aside>. */
  body.sidebar-collapsed { grid-template-columns:0 1fr 0; }
  button { font-family:var(--font); color:var(--text); background:transparent; border:none; cursor:pointer; }

  /* Sidebar */
  aside {
    background:var(--glass-bg);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    border-right:1px solid var(--glass-border);
    display:flex; flex-direction:column;
    padding:16px;
    gap:12px;
    overflow:hidden;
    transition:padding 0.18s ease;
  }
  body.sidebar-collapsed aside { padding:0; border-right:none; }

  /* Sidebar toggle in the chat header. Chevron rotates 180° when
     collapsed so the same icon means "open the sidebar." */
  .sidebar-toggle {
    width:32px; height:32px; border-radius:var(--r-sm);
    color:rgba(236,243,244,0.55);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; line-height:1;
    flex-shrink:0;
    transition:background 0.12s ease, color 0.12s ease, transform 0.18s ease;
  }
  .sidebar-toggle:hover { background:rgba(255,255,255,0.025); color:var(--text); }
  body.sidebar-collapsed .sidebar-toggle { transform:rotate(180deg); }
  .brand { display:flex; justify-content:space-between; align-items:center; padding:4px 6px 12px; }
  .brand .wordmark {
    font-weight:600; letter-spacing:0.18em; font-size:13px;
    color: var(--gold);
  }
  .brand .home { color:var(--text-dim); font-size:11px; text-decoration:none; }
  .brand .home:hover { color:var(--text); }

  .new-chat,
  body.lab .new-chat.act.primary,
  body.lab [data-testid="new-chat"] {
    background: rgba(198, 166, 100, 0.14) !important;
    border: 1px solid var(--gold) !important;
    color: var(--gold) !important;
    padding: 10px 14px;
    border-radius: 3px !important;
    font-size: 0.68rem !important;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    font-family: var(--mono) !important;
    transition: background 0.14s ease, color 0.14s ease;
  }
  .new-chat:hover,
  body.lab .new-chat.act.primary:hover {
    background: rgba(198, 166, 100, 0.24) !important;
    color: var(--ink) !important;
    filter: none;
  }

  .agent-pills { display:flex; gap:6px; }
  .agent-pill {
    flex:1; padding:8px 10px; border-radius:var(--r-sm);
    background:rgba(255,255,255,0.015);
    border:1px solid var(--glass-border);
    font-size:11px; font-weight:500;
    text-align:center;
    color:rgba(236,243,244,0.7);
  }
  .agent-pill[aria-pressed="true"] {
    background:rgba(198,166,100,0.12);
    border-color:rgba(198,166,100,0.45);
    color:var(--gold);
  }
  .agent-pill[data-agent="aetheria"][aria-pressed="true"] { border-color:rgba(198,166,100,0.55); }
  .agent-pill[data-agent="vett"][aria-pressed="true"]     { border-color:rgba(107,130,144,0.55); color:#9eb4c2; }
  .agent-pill[data-agent="scotty"][aria-pressed="true"]   { border-color:rgba(196,122,110,0.55); color:#c47a6e; }

  .search input {
    width:100%; padding:8px 12px; border-radius:var(--r-sm);
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink); font-size:12px; outline:none;
    font-family: var(--mono);
  }
  .search input:focus { border-color:var(--gold-dim); }

  .history { flex:1; overflow-y:auto; padding-right:4px; }
  .history h4 { font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.12em; margin:14px 0 6px; padding:0 4px; }
  .history a {
    display:flex; align-items:center; gap:8px;
    padding:7px 8px; border-radius:8px;
    color:rgba(243,239,229,0.78); text-decoration:none;
    font-size:12px;
    border-left:2px solid transparent;
  }
  .history a:hover { background:rgba(255,255,255,0.02); }
  .history a:hover .del-session { opacity:0.55; }
  .history a.active { background:rgba(198,166,100,0.10); border-left-color:var(--gold); color:var(--ink); }
  .history .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .history .label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .history .del-session {
    flex-shrink:0; opacity:0; transition:opacity 0.12s ease;
    background:transparent; border:none; color:rgba(236,243,244,0.6);
    cursor:pointer; padding:2px 6px; font-size:14px; line-height:1;
    border-radius:4px;
  }
  .history .del-session:hover { opacity:1; color:#f5a3a3; background:rgba(245,163,163,0.08); }
  .bulk-actions {
    padding:8px 6px 4px;
    border-top:1px solid var(--glass-border);
  }
  .bulk-clear {
    width:100%;
    background:transparent;
    border:1px solid rgba(245,163,163,0.18);
    color:rgba(245,163,163,0.7);
    padding:8px 10px;
    border-radius:6px;
    font-size:11px;
    letter-spacing:0.04em;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .bulk-clear:hover {
    background:rgba(245,163,163,0.08);
    color:#f5a3a3;
    border-color:rgba(245,163,163,0.35);
  }

  .profile {
    border-top:1px solid var(--glass-border);
    padding:10px 6px 4px;
    display:flex; align-items:center; gap:10px;
    font-size:12px;
  }
  /* Jon's avatar — bronze leaning into amber, trunk-into-glow vector. */
  .profile .avatar { width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,var(--sov-bronze),var(--sov-amber)); }
  .profile .who { flex:1; }
  .profile .who div:first-child { color:var(--text); }
  .profile .who div:last-child { color:rgba(236,243,244,0.45); font-size:10px; }
  .profile .cog { color:rgba(236,243,244,0.55); }
  .profile .cog:hover { color:var(--text); }

  main { display:flex; flex-direction:column; }

  /* Header */
  .chat-header {
    display:flex; align-items:center; gap:14px;
    padding:14px 24px;
    border-bottom:1px solid var(--glass-border);
    background:var(--glass-bg);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
  }
  .chat-header .disc {
    width:32px; height:32px; border-radius:50%;
    background:var(--sage-sheen);
    flex-shrink:0;
    box-shadow:inset 0 0 0 1px rgba(198,166,100,0.35);
  }
  .chat-header .meta { flex:1; }
  .chat-header .meta .title { font-size:14px; font-weight:500; }
  .chat-header .meta .sub { font-size:11px; color:rgba(236,243,244,0.5); margin-top:2px; }
  .chat-header .actions {
    display:flex; gap:4px; align-items:center; flex-wrap:wrap; justify-content:flex-end;
  }
  .chat-header .actions button {
    color:rgba(236,243,244,0.55); padding:6px 10px; border-radius:8px;
    font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    font-family:var(--mono, ui-monospace, monospace);
    border:1px solid transparent; background:transparent; cursor:pointer;
  }
  .chat-header .actions button:hover { background:rgba(255,255,255,0.04); color:var(--text); border-color:rgba(255,255,255,0.06); }
  body.lab .chat-header .actions button {
    color: var(--ink-2, #9a9384); border-radius: 3px; font-size: 0.58rem;
  }
  body.lab .chat-header .actions button:hover {
    color: var(--gold, #c6a664); border-color: var(--line-lit, #38352e);
    background: var(--panel-2, #151412);
  }
  .chat-header .actions .call-btn {
    margin-left: 4px;
    border-color: rgba(198,166,100,0.35) !important;
    color: var(--sov-amber, #c6a664) !important;
  }
  .more-wrap { position: relative; }
  .more-menu {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 40;
    min-width: 180px; padding: 6px;
    background: #16181a; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    display: flex; flex-direction: column; gap: 2px;
  }
  body.lab .more-menu {
    background: var(--panel, #0a0a09); border-color: var(--line, #26241f); border-radius: 3px;
  }
  .more-menu[hidden] { display: none !important; }
  .more-menu button, .more-menu a {
    display: block; width: 100%; text-align: left;
    padding: 8px 10px; border: 0; background: transparent; cursor: pointer;
    color: var(--text, #e7e5dc); font-size: 12px; text-decoration: none;
    font-family: var(--mono, ui-monospace, monospace); border-radius: 4px;
  }
  .more-menu button:hover, .more-menu a:hover { background: rgba(255,255,255,0.06); }
  .more-menu button.danger:hover { color: #c47a6e; }

  /* Simple inspector / export panels */
  .chat-modal-backdrop {
    position: fixed; inset: 0; z-index: 80;
    background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .chat-modal-backdrop[hidden] { display: none !important; }
  .chat-modal {
    width: min(560px, 100%); max-height: min(80vh, 720px);
    overflow: auto; padding: 18px 20px 16px;
    background: #16181a; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; color: var(--text, #e7e5dc);
  }
  body.lab .chat-modal {
    background: var(--panel, #0a0a09); border-color: var(--line); border-radius: 3px;
    font-family: var(--mono);
  }
  .chat-modal h3 {
    margin: 0 0 10px; font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--sov-amber, #c6a664);
  }
  .chat-modal pre {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font-size: 12px; line-height: 1.5; color: rgba(231,229,220,0.85);
    max-height: 55vh; overflow: auto;
  }
  .chat-modal .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px;
  }
  .chat-modal .modal-actions button {
    padding: 7px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.12); background: transparent;
    color: var(--text); font-size: 12px;
  }

  /* Thread */
  .thread {
    flex:1; overflow-y:auto;
    padding:24px 32px 140px;
    display:flex; flex-direction:column; gap:18px;
  }
  .bubble {
    max-width:78%;
    padding:12px 18px;
    border-radius:var(--r-md);
    font-size:14px; line-height:1.55;
    white-space:pre-wrap; word-wrap:break-word;
  }
  .bubble.user {
    align-self:flex-end;
    background:rgba(198,166,100,0.10);
    border:1px solid rgba(198,166,100,0.35);
    border-bottom-right-radius:2px;
    font-family: var(--sans);
  }
  .bubble.assistant {
    align-self:flex-start;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-left:2px solid var(--gold-dim);
    border-bottom-left-radius:2px;
    color: var(--ink-2);
    font-family: var(--sans);
  }
  .tool-strip {
    align-self:flex-start;
    max-width:78%;
    font-family:var(--mono);
    font-size:11px; line-height:1.5;
    color:var(--ink-2);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:3px;
    padding:6px 10px;
    margin-bottom:-2px;
    white-space:pre-wrap; word-wrap:break-word;
  }
  .tool-strip .tool-name { color:var(--gold); }
  .tool-strip .tool-result {
    color:var(--ink-3);
    margin-top:3px;
    padding-top:3px;
    border-top:1px dashed var(--line);
  }
  .tool-strip .tool-result.pending { font-style:italic; opacity:0.65; }
  .tool-strip .tool-result.intent-mark { color:var(--ok); opacity:0.95; font-style:italic; }
  .bubble .thinking-placeholder {
    color:var(--ink-3);
    font-style:italic;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:0.35 } 50% { opacity:0.85 } }
  .bubble .cursor {
    display:inline-block; width:6px; height:14px;
    background:var(--gold); vertical-align:middle; margin-left:2px;
    animation:blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity:0 } }

  /* Composer — in-flow at the bottom of the main flex column, NOT absolute.
     The previous absolute positioning could land the input below the visible
     viewport when 100vh disagreed with actual screen height (mobile address
     bar, small windows). Flex-shrink:0 keeps it from collapsing if the thread
     wants to grow. */
  .composer {
    flex-shrink:0;
    margin:0 16px 16px;
    display:flex; flex-direction:column; align-items:stretch; gap:0;
    padding:10px 14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:3px;
  }
  .composer input {
    flex:1; padding:8px 10px;
    background:transparent; border:none; outline:none;
    color:var(--ink); font-size:14px;
    font-family: var(--mono);
  }
  .composer .stream-toggle {
    font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--gold); padding:6px 10px; border-radius:3px;
    border:1px solid var(--line-lit);
    background:transparent;
  }
  .composer .send {
    width:32px; height:32px; border-radius:3px;
    background:rgba(198,166,100,0.16); color:var(--gold);
    border:1px solid var(--gold-dim);
    display:flex; align-items:center; justify-content:center;
    font-weight:700;
  }
  .composer .send:disabled { opacity:0.4; cursor:default; }
  /* main is a flex column: header (natural height) + thread (flex 1, scrolls)
     + composer (natural height, flex-shrink:0). min-height:0 on main and the
     thread is the standard flex-overflow incantation so the thread can shrink
     below its content height (otherwise it would push the composer out). */
  main { display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  main > .thread { min-height:0; }

  /* Context-pressure banner — visible when prompt_tokens/context_window ≥ 0.85
     so Jon can see context filling up before forced trimming kicks in heavily.
     Hidden by default; .visible flips display on. Amber instead of red — this
     is a "heads up" not an error. Reads from the last chat response's
     context_usage payload (sync /chat JSON and SSE done both carry it). */
  .context-banner {
    display:none;
    padding:5px 12px;
    background:rgba(240,180,80,0.12);
    color:rgba(240,200,140,0.95);
    border-bottom:1px solid rgba(240,180,80,0.25);
    font-size:12px;
    text-align:center;
    flex-shrink:0;
  }
  .context-banner.visible { display:block; }

  button:focus-visible, a:focus-visible, input:focus-visible {
    outline:2px solid var(--node); outline-offset:2px; border-radius:6px;
  }

  /* Attachments preview row above the composer input. Hidden when empty. */
  /* .composer column flex moved into the base rule above (was a fragile
     downstream override). */
  .composer-row {
    display: flex; align-items: center; gap: 10px; width: 100%;
  }
  .composer-row > input[type="text"] { flex: 1; }
  .composer-attachments-row {
    display: flex; gap: 8px; padding: 8px 4px 6px;
    border-bottom: 1px solid rgba(140, 145, 100, 0.15);
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .composer-attachments-row[hidden] { display: none; }
  .composer-attachment-thumb {
    position: relative; width: 64px; height: 64px;
    border-radius: 6px; overflow: hidden;
    border: 1px solid rgba(140, 145, 100, 0.45);
    background: rgba(0, 0, 0, 0.3);
  }
  .composer-attachment-thumb img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .composer-attachment-thumb .remove-attachment {
    position: absolute; top: 3px; right: 3px;
    width: 18px; height: 18px; line-height: 14px;
    border: 0; background: rgba(0, 0, 0, 0.75); color: white;
    border-radius: 50%; cursor: pointer; font-size: 14px;
    padding: 0;
  }
  .composer-attach-btn {
    background: transparent; border: 0; color: var(--text);
    opacity: 0.55; padding: 4px 6px; font-size: 18px;
    cursor: pointer; line-height: 1;
  }
  .composer-attach-btn:hover { opacity: 1; }
  .composer-attach-btn[hidden] { display: none; }
  /* Sent-bubble inline image preview. */
  .bubble-images {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 6px;
  }
  .bubble-images img {
    max-width: 220px; max-height: 220px; border-radius: 6px;
    display: block; object-fit: cover;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .bubble-text { white-space: pre-wrap; }
  /* Aetheria-generated images: auto-rendered when she includes the
     /aetheria/img/<filename> URL in her response. See enhanceBubbleWithImages
     in the rendering loop below. */
  .assistant-image {
    display: block;
    margin: 8px 0;
    max-width: 100%;
    max-height: 480px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  /* ─── Voice call (in-page) ──────────────────────────────────────────────
     Call button sits in .chat-header .actions next to persona/export/more.
     Click → full-screen overlay with a pulsing per-agent orb + END CALL.
     Backend route is /voice/session/<session_id>/offer; the WebRTC peer
     binds to the existing chat session so transcribed turns land in the
     same conversation history. */
  .chat-header .actions .call-btn[hidden] { display: none; }
  .chat-header .actions .call-btn {
    font-size: 15px;
    line-height: 1;
  }
  /* Subtle per-agent hover tint — keeps the action row uniform at rest. */
  .chat-header .actions .call-btn[data-agent="aetheria"]:hover { color: var(--gold); background: rgba(198,166,100,0.10); }
  .chat-header .actions .call-btn[data-agent="vett"]:hover     { color: #9eb4c2; background: rgba(107,130,144,0.10); }
  .chat-header .actions .call-btn[data-agent="scotty"]:hover   { color: #c47a6e; background: rgba(196,122,110,0.10); }

  .voice-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.94);
    backdrop-filter: blur(16px) saturate(120%);
    -webkit-backdrop-filter: blur(16px) saturate(120%);
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    z-index: 100;
  }
  .voice-overlay.visible { display: flex; }

  /* Mount host for the living orb (presence.js). */
  .voice-orb {
    width: min(280px, 68vw);
    height: min(280px, 68vw);
    position: relative;
    background: transparent;
    border: none;
    box-shadow: none;
  }
  .voice-title {
    margin-top: 36px;
    font-family: var(--mono), "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--text);
    text-transform: uppercase;
    opacity: 0.85;
  }
  .voice-title[data-agent="aetheria"] { color: var(--gold); }
  .voice-title[data-agent="vett"]     { color: #9eb4c2; }
  .voice-title[data-agent="scotty"]   { color: #c47a6e; }
  .voice-status {
    margin-top: 10px;
    font-family: var(--mono), "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--ink-2);
    text-transform: uppercase;
    min-height: 1.2em;
  }
  .voice-error {
    position: absolute;
    bottom: calc(110px + env(safe-area-inset-bottom, 0px));
    color: #d49696;
    font-family: "SF Mono","Menlo",monospace;
    font-size: 11px;
    opacity: 0;
    transition: opacity 200ms;
  }
  .voice-error.visible { opacity: 1; }
  .voice-hangup {
    position: absolute;
    bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    background: transparent;
    border: 1px solid rgba(236, 243, 244, 0.4);
    color: var(--text);
    font-family: "SF Mono","Menlo",monospace;
    font-size: 12px;
    letter-spacing: 0.25em;
    padding: 14px 32px;
    border-radius: 32px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .voice-hangup[data-agent="aetheria"] { border-color: rgba(198,166,100,0.55); color: var(--gold); }
  .voice-hangup[data-agent="vett"]     { border-color: rgba(107,130,144,0.5);  color: #9eb4c2; }
  .voice-hangup[data-agent="scotty"]   { border-color: rgba(196,122,110,0.55); color: #c47a6e; }
  .voice-hangup:hover { background: rgba(255,255,255,0.02); }
  .voice-hangup:active { background: rgba(255,255,255,0.04); }
  /* Pre-mounted hidden <audio> for iOS Safari — playback must begin inside
     the user gesture that starts the call; a pre-mounted element with
     playsinline lets ontrack assign srcObject without re-triggering policy. */
  .voice-audio { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }

  /* ── Lab console reconstruct ─────────────────────────────────────────── */
  body.lab {
    background: var(--ground) !important;
    color: var(--ink) !important;
    font-family: var(--mono) !important;
    background-image:
      linear-gradient(rgba(198,166,100,.038) 1px, transparent 1px),
      linear-gradient(90deg, rgba(198,166,100,.038) 1px, transparent 1px) !important;
    background-size: 64px 64px, 64px 64px !important;
    background-attachment: fixed !important;
  }
  body.lab::before, body.lab::after { display:none !important; content:none !important; }

  aside[data-testid="sidebar"] {
    background: var(--panel) !important;
    border-right: 1px solid var(--line) !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    padding: 0 !important;
    gap: 0 !important;
  }
  .lab-chat-plate {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,.92);
  }
  .lab-chat-plate img { width: 40px; height: 40px; display: block; }
  .lab-chat-plate b {
    font-size: .72rem; letter-spacing: .22em; display: block; color: var(--ink); font-weight: 600;
  }
  .lab-chat-plate i {
    font-style: normal; font-size: .58rem; letter-spacing: .2em; color: var(--gold); display: block;
  }
  .lab-chat-nav {
    display: flex; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .lab-chat-nav a {
    flex: 1; text-align: center; padding: 10px 6px;
    font-size: .58rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-3); border-right: 1px solid var(--line);
  }
  .lab-chat-nav a:last-child { border-right: none; }
  .lab-chat-nav a:hover, .lab-chat-nav a.active {
    color: var(--gold); background: var(--panel-2);
  }
  .lab-chat-tools {
    padding: 12px 14px;

    display: flex; flex-direction: column; gap: 8px;
  }
  .lab-chat-tools .act { width: 100%; text-align: center; }
  .lab-chat-hist {
    flex: 1; overflow: auto; min-height: 0;
    border-top: 1px solid var(--line);
  }
  .lab-chat-hist-head {
    padding: 10px 14px; font-size: .58rem; letter-spacing: .18em;
    text-transform: uppercase; color: var(--ink-3);
    border-bottom: 1px solid var(--line); background: var(--panel);
  }

  /* hide old brand block once plate is present */
  aside[data-testid="sidebar"] > .brand { display: none !important; }

  main[data-testid="main"] {
    background: transparent !important;
    display: flex; flex-direction: column; min-width: 0;
  }
  [data-testid="chat-header"] {
    background: var(--panel) !important;
    border-bottom: 1px solid var(--line) !important;

    backdrop-filter: none !important;

  [data-testid="thread"] {

  /* messages as lab log */
  .msg.user, .message.user, [data-role="user"] {

    background: var(--panel-2) !important;

  .msg.assistant, .message.assistant, [data-role="assistant"] {

  [data-testid="composer"] {
    background: var(--panel) !important;

  [data-testid="composer-input"], textarea {

  [data-testid="send"], [data-testid="stream-toggle"] {
    border: 1px solid var(--line-lit) !important;

  .session-item, [data-session] {

    background-clip: unset !important;
    color: var(--ink) !important;
  }
  input, button, select, textarea { font-family: var(--mono) !important; }

</style>

<script src="/static/voice/presence.js?v=alive5"></script>
<script>
(() => {
  const ACTIVE_AGENTS = ["aetheria","vett","scotty"];
  // Full background-value per agent (applied directly on the agent disc).
  // Aetheria carries the brand olive — she's the central voice, so the
  // SOVERYN brand color belongs to her. Two-stop gradients give each disc
  // depth without complicating the identity.
  const AGENT_COLORS = {
    aetheria: "var(--sage-sheen)",                              /* primary voice → brushed SOVERYN gold */
    vett:     "var(--steel-sheen)",
    scotty:   "var(--maroon-sheen)",  /* engineering maroon (Star Trek red-shirt) */
  };
  // Single-color variant for tiny 6px dots where a gradient muddies.
  const AGENT_DOT_COLORS = {
    aetheria: "var(--sov-sage)",
    vett:     "var(--sov-deep-blue)",
    scotty:   "var(--sov-maroon)",
  };

  // ─── Attachments config ───────────────────────────────────────────────────
  const MAX_ATTACHMENT_BYTES = 16 * 1024 * 1024;
  const MAX_ATTACHMENT_COUNT = 4;
  const ALLOWED_IMAGE_MIMES = new Set([
    "image/jpeg", "image/png", "image/webp", "image/gif",
  ]);
  // Agents whose serving profile loads an mmproj image projector — gates the
  // composer 📎 attach button. Mirror of the backend source-of-truth set
  // (chat.html is a static file so it can't import the Python const); a
  // parity test fails if this drifts from the backend. (Named without the
  // v-word so the retired-agent hygiene test stays green.)
  const ATTACH_CAPABLE_AGENTS = new Set([
    "aetheria", "vett", "scotty",
  ]);

  // ─── State ─────────────────────────────────────────────────────────────────
  const state = {
    agent: null,
    sessionId: null,
    sessions: [],
    stream: localStorage.getItem("soveryn.stream") !== "false",
    abort: null,
    // pendingAttachments: array of { name, dataUrl } awaiting the next send.
    pendingAttachments: [],
  };

  const CONTEXT_BANNER_THRESHOLD = 0.85;

  function updateContextUsage(usage) {
    const el = document.querySelector('[data-testid="context-banner"]');
    if (!el) return;
    if (!usage || !usage.context_window || !usage.prompt_tokens) {
      el.classList.remove("visible");
      el.textContent = "";
      return;
    }
    const ratio = usage.prompt_tokens / usage.context_window;
    if (ratio < CONTEXT_BANNER_THRESHOLD) {
      el.classList.remove("visible");
      el.textContent = "";
      return;
    }
    const pct = Math.round(ratio * 100);
    const elided = usage.elided_turns || 0;
    const tail = elided > 0
      ? ` — ${elided} older turn${elided === 1 ? "" : "s"} elided`
      : "";
    el.textContent = `Context ${pct}% full${tail}`;
    el.classList.add("visible");
  }


  async function loadSessions() {
    const r = await fetch(`/sessions?agent=${state.agent}&limit=100`);
    if (!r.ok) return;
    const data = await r.json();
    state.sessions = data.sessions || [];
    renderHistory();
  }

  // Sidebar grouping by rail/type (OCD-friendly): human Conversations first +
  // always open; machine rails grouped + collapsible (collapsed by default so
  // the sidebar stays legible). Category derived from the session title prefix.
  const RAIL_GROUPS = ["Conversations", "Mobile", "Signal", "Heartbeat", "Webhook", "System"];
  const expandedRails = new Set();  // survives re-renders; Conversations is implicitly always open
  function railFor(title) {
    const t = (title || "").trim();
    if (!t.startsWith("[")) return "Conversations";
    if (t.startsWith("[m]")) return "Mobile";
    if (t.startsWith("[signal]")) return "Signal";
    if (t.startsWith("[heartbeat]")) return "Heartbeat";
    if (t.startsWith("[webhook]")) return "Webhook";
    return "System";  // [direct:…], [specialist…], eval/test sessions, anything else bracketed
  }

  function sessionLink(s) {
    const a = document.createElement("a");
    a.href = `/chat/${s.session_id}`;
    if (s.session_id === state.sessionId) a.className = "active";
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = AGENT_DOT_COLORS[s.agent] || "var(--sov-bronze)";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = s.title || "(untitled)";
    const del = document.createElement("button");
    del.className = "del-session";
    del.type = "button";
    del.title = "Delete this session";
    del.setAttribute("aria-label", `Delete session ${s.title || s.session_id}`);
    del.textContent = "×";
    del.addEventListener("click", async (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      if (!confirm(`Delete "${s.title || s.session_id.slice(0,8)}"? This cannot be undone.`)) return;
      const r = await fetch(`/sessions/${s.session_id}`, { method: "DELETE" });
      if (!r.ok) { alert(`delete failed: ${r.status}`); return; }
      if (s.session_id === state.sessionId) {
        state.sessionId = null;
        elThread().innerHTML = "";
        elSessionMeta().textContent = "new session";
        window.history.replaceState({}, "", `/chat?agent=${state.agent}`);
      }
      loadSessions();
    });
    a.appendChild(dot);
    a.appendChild(label);
    a.appendChild(del);
    return a;
  }

  function renderHistory() {
    const grouped = {};
    for (const g of RAIL_GROUPS) grouped[g] = [];
    const q = (document.querySelector('[data-testid="search"]').value || "").toLowerCase();
    for (const s of state.sessions) {
      if (q && !(s.title || "").toLowerCase().includes(q)) continue;
      grouped[railFor(s.title)].push(s);
    }
    const host = elHistory();
    host.innerHTML = "";
    const searching = !!q;  // when searching, expand all so matches aren't hidden in collapsed groups
    for (const group of RAIL_GROUPS) {
      const items = grouped[group];
      if (!items.length) continue;
      const isConversations = group === "Conversations";
      const open = isConversations || searching || expandedRails.has(group);
      const h = document.createElement("h4");
      h.textContent = isConversations ? group : `${open ? "▾" : "▸"} ${group} (${items.length})`;
      if (!isConversations) {
        h.style.cursor = "pointer";
        h.addEventListener("click", () => {
          if (expandedRails.has(group)) expandedRails.delete(group);
          else expandedRails.add(group);
          renderHistory();
        });
      }
      host.appendChild(h);
      if (open) for (const s of items) host.appendChild(sessionLink(s));
    }
  }

  // ─── URL parsing ───────────────────────────────────────────────────────────
  function parseUrl() {
    const path = window.location.pathname;
    const m = path.match(/^\/chat\/([^/]+)$/);
    if (m) return { sessionId: m[1], agent: null };
    const sp = new URLSearchParams(window.location.search);
    return { sessionId: null, agent: sp.get("agent") };
  }

  function pickInitialAgent(urlAgent) {
    if (urlAgent && ACTIVE_AGENTS.includes(urlAgent.toLowerCase())) {
      return urlAgent.toLowerCase();
    }
    const stored = localStorage.getItem("soveryn.agent");
    if (stored && ACTIVE_AGENTS.includes(stored)) return stored;
    return "aetheria";
  }

  // ─── DOM helpers ───────────────────────────────────────────────────────────
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => Array.from(document.querySelectorAll(sel));

  // Tool-strip helpers
  function escapeArgs(raw) {
    if (!raw) return "";
    let s = String(raw);
    if (s.length > 90) s = s.slice(0, 87) + "…";
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function cssEsc(s) {
    // CSS.escape isn't available everywhere; cheap fallback for our UUID/string ids.
    return String(s).replace(/[^a-zA-Z0-9_-]/g, c => "\\" + c);
  }
  function truncateResult(s) {
    if (!s) return "(no result)";
    return s.length > 240 ? s.slice(0, 237) + "…" : s;
  }
  const elThread = () => $('[data-testid="thread"]');
  const elInput  = () => $('[data-testid="composer-input"]');
  const elSend   = () => $('[data-testid="send"]');
  const elStreamToggle = () => $('[data-testid="stream-toggle"]');
  const elHistory = () => $('[data-testid="history"]');
  const elAgentName = () => $('[data-agent-name]');
  const elAgentDisc = () => $('[data-agent-disc]');
  const elSessionMeta = () => $('[data-session-meta]');
  const elAttachBtn  = () => $('[data-testid="composer-attach"]');
  const elFileInput  = () => $('[data-testid="composer-file-input"]');
  const elAttachRow  = () => $('[data-testid="composer-attachments"]');
  const elCallBtn        = () => $('[data-testid="call-btn"]');
  const elVoiceOverlay   = () => $('[data-testid="voice-overlay"]');
  const elVoiceOrb       = () => $('[data-testid="voice-orb"]');
  const elVoiceTitle     = () => $('[data-testid="voice-title"]');
  const elVoiceStatus    = () => $('[data-testid="voice-status"]');
  const elVoiceError     = () => $('[data-testid="voice-error"]');
  const elVoiceHangup    = () => $('[data-testid="voice-hangup"]');
  const elVoiceAudio     = () => $('[data-testid="voice-audio"]');

  // ─── Attachments helpers ──────────────────────────────────────────────────
  function renderAttachmentsRow() {
    const row = elAttachRow();
    if (!row) return;
    if (state.pendingAttachments.length === 0) {
      row.hidden = true;
      row.innerHTML = "";
      return;
    }
    row.hidden = false;
    row.innerHTML = "";
    state.pendingAttachments.forEach((att, idx) => {
      const thumb = document.createElement("div");
      thumb.className = "composer-attachment-thumb";
      const img = document.createElement("img");
      img.src = att.dataUrl;
      img.alt = att.name || "";
      thumb.appendChild(img);
      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "remove-attachment";
      removeBtn.textContent = "×";
      removeBtn.setAttribute("aria-label", `Remove ${att.name || "attachment"}`);
      removeBtn.addEventListener("click", () => {
        state.pendingAttachments.splice(idx, 1);
        renderAttachmentsRow();
      });
      thumb.appendChild(removeBtn);
      row.appendChild(thumb);
    });
  }

  function clearPendingAttachments() {
    state.pendingAttachments = [];
    renderAttachmentsRow();
  }

  function setAgent(name) {
    state.agent = name;
    localStorage.setItem("soveryn.agent", name);
    $$('.agent-pill').forEach(p => p.setAttribute("aria-pressed", String(p.dataset.agent === name)));
    elAgentName().textContent = name;
    // AGENT_COLORS values are full background strings (gradients). Apply
    // directly — no wrapping. The pre-2026-06-04 wrapping forced every agent
    // through a bronze-trailing gradient, which doesn't serve the spectrum
    // treatment Aetheria needs.
    elAgentDisc().style.background = AGENT_COLORS[name] || "var(--sov-bronze)";
    // Paperclip shows only for image-capable agents (those whose server
    // loads an mmproj) — others have no projector and the backend would 400
    // anyway. Hide the button to avoid the confusing UI.
    const attachBtn = elAttachBtn();
    if (attachBtn) attachBtn.hidden = !ATTACH_CAPABLE_AGENTS.has(name);
    // Switching to a non-image-capable agent? Drop any pending attachments.
    if (!ATTACH_CAPABLE_AGENTS.has(name)) clearPendingAttachments();
    // Mirror the agent onto the call button + voice overlay so per-agent
    // hover tints + orb gradient pick up immediately on switch (idempotent
    // updates; voice gating is handled separately by updateCallButton).
    const callBtn = elCallBtn();
    if (callBtn) callBtn.dataset.agent = name;
    const orb = elVoiceOrb();
    if (orb) orb.dataset.agent = name;
    if (voice.presence) voice.presence.setAgent(name);
    const vTitle = elVoiceTitle();
    if (vTitle) {
      vTitle.dataset.agent = name;
      vTitle.innerHTML = `${name} &mdash; LIVE`;
    }
    const vHang = elVoiceHangup();
    if (vHang) vHang.dataset.agent = name;
    updateCallButton();
    loadSessions();
  }

  // ─── Voice call gating ────────────────────────────────────────────────────
  // /voice/agents → which agents have voice configured. Cached for the
  // session — the local TTS/STT stack doesn't change between page loads.
  let _voiceAgentsCache = null;
  async function fetchVoiceAgents() {
    if (_voiceAgentsCache !== null) return _voiceAgentsCache;
    try {
      const r = await fetch("/voice/agents");
      if (!r.ok) { _voiceAgentsCache = []; return _voiceAgentsCache; }
      const data = await r.json();
      _voiceAgentsCache = data.agents || [];
    } catch (e) {
      _voiceAgentsCache = [];
    }
    return _voiceAgentsCache;
  }

  async function updateCallButton() {
    const btn = elCallBtn();
    if (!btn) return;
    const agents = await fetchVoiceAgents();
    btn.hidden = !agents.includes(state.agent);
  }

  function appendBubble(role, content, opts = {}) {
    const div = document.createElement("div");
    div.className = `bubble ${role}`;
    if (opts.images && opts.images.length) {
      const imgRow = document.createElement("div");
      imgRow.className = "bubble-images";
      for (const url of opts.images) {
        const img = document.createElement("img");
        img.src = url;
        imgRow.appendChild(img);
      }
      div.appendChild(imgRow);
    }
    if (opts.placeholder) {
      const span = document.createElement("span");
      span.className = "thinking-placeholder";
      span.textContent = "thinking…";
      div.appendChild(span);
    } else if (content || !(opts.images && opts.images.length)) {
      // Render the text node when there's text OR when there are no images
      // (otherwise an image-only user bubble would carry an empty .bubble-text).
      const txt = document.createElement("div");
      txt.className = "bubble-text";
      txt.textContent = content;
      div.appendChild(txt);
    }
    elThread().appendChild(div);
    elThread().scrollTop = elThread().scrollHeight;
    return div;
  }

  // Stream/sync handlers and error paths replace bubble text via this helper
  // so fresh-streamed assistant bubbles have the same DOM shape as bubbles
  // reloaded through loadHistory (both end in a .bubble-text child). Without
  // this, raw bubble.textContent writes wipe out the placeholder span AND
  // any nested children, leaving a text node directly inside .bubble —
  // visually identical today thanks to .bubble's pre-wrap, but a future
  // .bubble-text style would diverge between fresh and reloaded bubbles.
  function setBubbleText(bubble, text) {
    let txt = bubble.querySelector(":scope > .bubble-text");
    if (!txt) {
      // First write: clear the placeholder (or empty initial state) and
      // create a .bubble-text child. Preserve any .bubble-images sibling
      // that's already rendered above the placeholder.
      const placeholder = bubble.querySelector(":scope > .thinking-placeholder");
      if (placeholder) placeholder.remove();
      txt = document.createElement("div");
      txt.className = "bubble-text";
      bubble.appendChild(txt);
    }
    txt.textContent = text;
  }

  function appendBubbleText(bubble, delta) {
    let txt = bubble.querySelector(":scope > .bubble-text");
    if (!txt) {
      const placeholder = bubble.querySelector(":scope > .thinking-placeholder");
      if (placeholder) placeholder.remove();
      txt = document.createElement("div");
      txt.className = "bubble-text";
      bubble.appendChild(txt);
    }
    txt.textContent += delta;
  }

  // Aetheria-image auto-render. When she calls generate_image, the tool
  // result returns a URL like `/aetheria/img/aetheria_00001_.png`. She
  // includes that URL inline in her response. After the bubble is fully
  // populated (sync done, stream done, or history-load), this scans the
  // text for matching URLs and replaces each occurrence with an actual
  // <img> element rendered above the surrounding text. Safe: the URL
  // pattern matches only the /aetheria/img/ route with a
  // restricted-character filename.
  const _AETHERIA_IMG_RE = /\/aetheria\/img\/[A-Za-z0-9][A-Za-z0-9_\-]{0,127}\.(?:png|jpg|jpeg|webp|gif)/g;
  function enhanceBubbleWithImages(bubble) {
    if (!bubble) return;
    const txt = bubble.querySelector(":scope > .bubble-text");
    if (!txt) return;
    const text = txt.textContent || "";
    if (!_AETHERIA_IMG_RE.test(text)) return;
    _AETHERIA_IMG_RE.lastIndex = 0;
    // Split the text on image URLs. Each match becomes an <img>; surrounding
    // text segments stay as text nodes.
    txt.innerHTML = "";  // safe — content was textContent, no HTML preserved
    let lastIdx = 0;
    let m;
    while ((m = _AETHERIA_IMG_RE.exec(text)) !== null) {
      if (m.index > lastIdx) {
        txt.appendChild(document.createTextNode(text.slice(lastIdx, m.index)));
      }
      const img = document.createElement("img");
      img.src = m[0];
      img.className = "assistant-image";
      img.loading = "lazy";
      img.alt = "Aetheria-generated image";
      txt.appendChild(img);
      lastIdx = m.index + m[0].length;
    }
    if (lastIdx < text.length) {
      txt.appendChild(document.createTextNode(text.slice(lastIdx)));
    }
  }

  // ─── Session minting ───────────────────────────────────────────────────────
  // Backend requires session_id on every /chat and /chat_stream POST. We mint
  // lazily before the first send (or after new-chat / agent switch).
  async function ensureSession() {
    if (state.sessionId) return state.sessionId;
    const r = await fetch("/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ agent: state.agent }),
    });
    if (!r.ok) throw new Error(`failed to mint session: ${r.status}`);
    const data = await r.json();
    state.sessionId = data.session_id;
    window.history.replaceState({}, "", `/chat/${data.session_id}`);
    return state.sessionId;
  }

  // ─── Streaming (POST + ReadableStream) ─────────────────────────────────────
  async function sendStreaming(message) {
    const images = state.pendingAttachments.map(a => a.dataUrl);
    // User bubble shows the original text (may be empty when image-only).
    // The wire payload synthesizes "(image)" so the server's non-empty
    // message check passes — but Jon doesn't need to see that echoed back.
    const wireMessage = message || "(image)";
    appendBubble("user", message, { images });
    clearPendingAttachments();
    const respBubble = appendBubble("assistant", "", { placeholder: true });
    let cleared = false;
    let finalContent = "";

    try {
      await ensureSession();
    } catch (e) {
      setBubbleText(respBubble, `error · ${e.message}`);
      return;
    }

    state.abort = new AbortController();
    try {
      const body = { agent: state.agent, session_id: state.sessionId, message: wireMessage };
      if (images.length > 0) body.attachments = images;
      const r = await fetch("/chat_stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal: state.abort.signal,
      });
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });

        // SSE parse: chunks split by \n\n, each line starts "data: "
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const part of parts) {
          const line = part.split("\n").find(l => l.startsWith("data: "));
          if (!line) continue;
          const payload = JSON.parse(line.slice(6));
          if (payload.type === "token" && payload.delta) {
            if (!cleared) { setBubbleText(respBubble, ""); cleared = true; }
            appendBubbleText(respBubble, payload.delta);
            finalContent += payload.delta;
            elThread().scrollTop = elThread().scrollHeight;
          } else if (payload.type === "tool_call") {
            // Insert a tool-activity strip right before the assistant bubble.
            const strip = document.createElement("div");
            strip.className = "tool-strip";
            strip.dataset.callId = payload.call_id;
            const nameLine = document.createElement("div");
            nameLine.innerHTML = `→ <span class="tool-name">${payload.name}</span>(${escapeArgs(payload.args)})`;
            const resultLine = document.createElement("div");
            resultLine.className = "tool-result pending";
            resultLine.textContent = "running…";
            strip.appendChild(nameLine);
            strip.appendChild(resultLine);
            elThread().insertBefore(strip, respBubble);
            elThread().scrollTop = elThread().scrollHeight;
          } else if (payload.type === "tool_result") {
            // Update the matching strip's result line.
            const strip = elThread().querySelector(`.tool-strip[data-call-id="${cssEsc(payload.call_id)}"]`);
            if (strip) {
              const resultLine = strip.querySelector(".tool-result");
              resultLine.classList.remove("pending");
              // Live intent mark (mark_share): render the why/stance cleanly
              // instead of raw JSON. Guarded — any non-grammar result falls
              // straight through to the normal rendering.
              let intentRendered = false;
              try {
                const r = JSON.parse(payload.content);
                if (r && r.why && r.stance) {
                  resultLine.classList.add("intent-mark");
                  resultLine.textContent = `✶ ${r.stance} — ${r.why}`;
                  intentRendered = true;
                }
              } catch (e) { /* not a JSON grammar result → normal render */ }
              if (!intentRendered) resultLine.textContent = truncateResult(payload.content);
            }
            elThread().scrollTop = elThread().scrollHeight;
          } else if (payload.type === "done") {
            // Fallback: if deltas were dropped, render the canonical accumulated content.
            if (!cleared && payload.content) {
              setBubbleText(respBubble, payload.content);
              cleared = true;
            }
            updateContextUsage(payload.context_usage);
            // Aetheria-image auto-render: if she included an image URL,
            // turn it into an inline <img>. Safe to call always — no-op
            // when no matching URL is present.
            enhanceBubbleWithImages(respBubble);
          } else if (payload.type === "error") {
            setBubbleText(respBubble, `error · ${payload.code}: ${payload.message}`);
            return;
          }
        }
      }
    } catch (e) {
      if (e.name === "AbortError") {
        if (!cleared) setBubbleText(respBubble, "(stopped)");
      } else {
        setBubbleText(respBubble, `error · ${e.message}`);
      }
    } finally {
      state.abort = null;
    }
  }

  // ─── Sync send ─────────────────────────────────────────────────────────────
  async function sendSync(message) {
    const images = state.pendingAttachments.map(a => a.dataUrl);
    // User bubble shows original text (may be empty for image-only); wire
    // payload synthesizes "(image)" to satisfy the server's non-empty check.
    const wireMessage = message || "(image)";
    appendBubble("user", message, { images });
    clearPendingAttachments();
    const respBubble = appendBubble("assistant", "", { placeholder: true });
    try {
      await ensureSession();
      const body = { agent: state.agent, session_id: state.sessionId, message: wireMessage };
      if (images.length > 0) body.attachments = images;
      const r = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await r.json();
      if (data.error) {
        setBubbleText(respBubble, `error · ${data.error.code}: ${data.error.message}`);
      } else {
        setBubbleText(respBubble, data.content || "");
        updateContextUsage(data.context_usage);
        enhanceBubbleWithImages(respBubble);
      }
    } catch (e) {
      setBubbleText(respBubble, `error · ${e.message}`);
    }
  }

  async function loadHistory(sessionId) {
    try {
      const r = await fetch(`/sessions/${sessionId}/history`);
      if (!r.ok) return;
      const data = await r.json();
      elThread().innerHTML = "";
      // Clear the context banner — the new session's pressure state is
      // unknown until the next chat response arrives.
      updateContextUsage(null);
      for (const t of data.turns || []) {
        if (t.role === "user" || t.role === "assistant") {
          const b = appendBubble(t.role, t.content);
          if (t.role === "assistant") enhanceBubbleWithImages(b);
        }
      }
      elSessionMeta().textContent = `${(data.turns || []).length} messages`;
    } catch { /* noop */ }
  }

  // ─── Voice call lifecycle ─────────────────────────────────────────────────
  // One call at a time, bound to the current chat session. Backend route:
  //   POST /voice/session/<session_id>/offer  {sdp, type, agent}
  // The server binds the WebRTC peer to the SAME session_id the chat is
  // already using, so transcribed voice turns flow into the conversation
  // history rendered above. On hangup we reload that history so any new
  // turns appear without a full page reload.
  //
  // UX notes (2026-08-15):
  //   - Status labels are human ("Listening…") not raw machine tokens.
  //   - Amplitude is EMA-smoothed with enter/leave hysteresis so listen/hear
  //     doesn't thrash on breath noise or brief pauses.
  //   - Offer waits for ICE gather (capped) so the first hop is less laggy.
  const VOICE_STATE = {
    IDLE: "idle", CONNECTING: "connecting", LISTENING: "listening",
    HEARING: "hearing", THINKING: "thinking", SPEAKING: "speaking",
    INTERRUPTED: "interrupted",
  };
  const VOICE_LABEL = {
    idle: "Ready",
    connecting: "Connecting…",
    listening: "Listening…",
    hearing: "Hearing you…",
    thinking: "Thinking…",
    speaking: "Speaking…",
    interrupted: "You first…",
  };
  // Hysteresis: higher to enter "speaking", lower to leave (reduces thrash).
  const VOICE_ENTER = 0.055;
  const VOICE_LEAVE = 0.028;
  const VOICE_SILENCE_MS = 1400;       // hold HEARING through short pauses
  const VOICE_MIN_DWELL_MS = 280;      // min time in a state before flip
  const VOICE_THINK_FALLBACK_MS = 8000;
  const VOICE_EMA_ALPHA = 0.22;        // amplitude smoother
  const voice = {
    pc: null,
    micStream: null,
    audioCtx: null,
    outAnalyser: null,
    inAnalyser: null,
    state: VOICE_STATE.IDLE,
    raf: null,
    lastSpokenAt: 0,
    stateChangedAt: 0,
    outEma: 0,
    inEma: 0,
    userActive: false,
    botActive: false,
    presence: null,  // LivingPresence — living orb
    sessionAtStart: null,  // sessionId we called against, so post-hangup reload targets the right thread
  };

  function voiceEnsurePresence() {
    const orb = elVoiceOrb();
    if (!orb || typeof LivingPresence === "undefined") return null;
    // Reuse instance — destroy/remount was a big part of open lag + glitch.
    if (!voice.presence) {
      voice.presence = LivingPresence.mount(orb, { agent: state.agent || "aetheria" });
    } else {
      voice.presence.setAgent(state.agent || "aetheria");
      voice.presence.start();
    }
    return voice.presence;
  }

  function voicePausePresence() {
    // Keep DOM; just stop the rAF while overlay is closed.
    if (voice.presence) {
      try { voice.presence.stop(); } catch (e) { /* noop */ }
      voice.presence.setState("idle");
    }
  }

  function voiceSetState(s, force) {
    if (!force && s === voice.state) return;
    const now = performance.now();
    // Don't thrash between listening/hearing/thinking on every frame.
    if (!force && voice.state !== VOICE_STATE.IDLE && voice.state !== VOICE_STATE.CONNECTING) {
      const elapsed = now - voice.stateChangedAt;
      const sticky = (
        (voice.state === VOICE_STATE.SPEAKING && s === VOICE_STATE.LISTENING) ||
        (voice.state === VOICE_STATE.HEARING && s === VOICE_STATE.THINKING) ||
        (voice.state === VOICE_STATE.THINKING && s === VOICE_STATE.LISTENING) ||
        (voice.state === VOICE_STATE.LISTENING && s === VOICE_STATE.HEARING)
      );
      if (sticky && elapsed < VOICE_MIN_DWELL_MS) return;
    }
    voice.state = s;
    voice.stateChangedAt = now;
    const orb = elVoiceOrb();
    const st = elVoiceStatus();
    if (orb) orb.dataset.state = s;
    if (st) st.textContent = VOICE_LABEL[s] || s;
    if (voice.presence) voice.presence.setState(s);
  }

  function voiceShowError(msg) {
    const e = elVoiceError();
    if (!e) return;
    e.textContent = msg;
    e.classList.add("visible");
    setTimeout(() => e.classList.remove("visible"), 5000);
  }

  function voiceAmp(an) {
    const data = new Uint8Array(an.frequencyBinCount);
    an.getByteTimeDomainData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) {
      const v = (data[i] - 128) / 128;
      sum += v * v;
    }
    return Math.sqrt(sum / data.length);
  }

  function voiceGate(ema, wasActive) {
    // Schmitt trigger: enter high, leave low — stops edge chatter.
    if (wasActive) return ema > VOICE_LEAVE;
    return ema > VOICE_ENTER;
  }

  function voiceTick() {
    if (!voice.outAnalyser) return;
    const orb = elVoiceOrb();
    if (!orb) return;
    const outRaw = voiceAmp(voice.outAnalyser);
    const innRaw = voice.inAnalyser ? voiceAmp(voice.inAnalyser) : 0;
    voice.outEma = voice.outEma + VOICE_EMA_ALPHA * (outRaw - voice.outEma);
    voice.inEma  = voice.inEma  + VOICE_EMA_ALPHA * (innRaw - voice.inEma);
    const now = performance.now();
    const userSpeaking = voiceGate(voice.outEma, voice.userActive);
    const botSpeaking  = voiceGate(voice.inEma, voice.botActive);
    voice.userActive = userSpeaking;
    voice.botActive = botSpeaking;

    // Drive the living presence every frame — breath + face from amplitude.
    if (voice.presence) {
      voice.presence.setLevels({ out: voice.outEma, inn: voice.inEma });
    }

    if (botSpeaking && userSpeaking && voice.state === VOICE_STATE.SPEAKING) {
      voiceSetState(VOICE_STATE.INTERRUPTED, true);
      setTimeout(() => {
        if (voice.pc) voiceSetState(VOICE_STATE.HEARING, true);
      }, 220);
      voice.lastSpokenAt = now;
    } else if (botSpeaking) {
      voiceSetState(VOICE_STATE.SPEAKING);
    } else if (userSpeaking) {
      voiceSetState(VOICE_STATE.HEARING);
      voice.lastSpokenAt = now;
    } else {
      if (voice.state === VOICE_STATE.HEARING && now - voice.lastSpokenAt > VOICE_SILENCE_MS) {
        voiceSetState(VOICE_STATE.THINKING);
      } else if (voice.state === VOICE_STATE.SPEAKING) {
        voiceSetState(VOICE_STATE.LISTENING);
      } else if (voice.state === VOICE_STATE.THINKING && now - voice.lastSpokenAt > VOICE_THINK_FALLBACK_MS) {
        voiceSetState(VOICE_STATE.LISTENING);
      }
    }
    voice.raf = requestAnimationFrame(voiceTick);
  }

  function waitForIceGathering(pc, timeoutMs = 1500) {
    // Prefer a complete candidate set before signaling — early offers work
    // but often stall the first audio path. Cap wait so slow STUN never hangs.
    if (pc.iceGatheringState === "complete") return Promise.resolve();
    return new Promise((resolve) => {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        pc.removeEventListener("icegatheringstatechange", onChange);
        resolve();
      };
      const onChange = () => {
        if (pc.iceGatheringState === "complete") finish();
      };
      pc.addEventListener("icegatheringstatechange", onChange);
      setTimeout(finish, timeoutMs);
    });
  }

  function openVoiceOverlay() {
    const ov = elVoiceOverlay();
    if (!ov) return;
    ov.classList.add("visible");
    ov.setAttribute("aria-hidden", "false");
    // Mount living presence immediately so connecting feels inhabited.
    const p = voiceEnsurePresence();
    if (p) p.setState("connecting");
  }

  function closeVoiceOverlay() {
    const ov = elVoiceOverlay();
    if (!ov) return;
    ov.classList.remove("visible");
    ov.setAttribute("aria-hidden", "true");
    voicePausePresence();
    const orb = elVoiceOrb();
    if (orb) {
      orb.dataset.state = "idle";
      orb.style.transform = "";
    }
  }

  async function startVoiceCall() {
    // Need an active session_id — the backend route binds the call to it.
    // ensureSession() mints one if the user clicks Call before sending text.
    try {
      await ensureSession();
    } catch (e) {
      voiceShowError(`session error: ${e.message}`);
      return;
    }
    voice.sessionAtStart = state.sessionId;
    voice.outEma = 0;
    voice.inEma = 0;
    voice.userActive = false;
    voice.botActive = false;
    openVoiceOverlay();
    voiceSetState(VOICE_STATE.CONNECTING, true);
    const status = elVoiceStatus();
    if (status) status.textContent = "Microphone…";

    try {
      voice.micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          // Prefer voice-optimized constraints when supported.
          channelCount: 1,
        },
        video: false,
      });
    } catch (e) {
      voiceShowError("microphone access denied");
      await endVoiceCall({ reloadHistory: false });
      return;
    }

    if (status) status.textContent = "Connecting…";

    // AudioContext + mic playback init must happen INSIDE the user gesture
    // path (the click handler that called us). iOS Safari otherwise leaves
    // the context in `suspended` state and ontrack-assigned playback fails.
    voice.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (voice.audioCtx.state === "suspended") {
      try { await voice.audioCtx.resume(); } catch (e) { /* best effort */ }
    }
    const outSrc = voice.audioCtx.createMediaStreamSource(voice.micStream);
    voice.outAnalyser = voice.audioCtx.createAnalyser();
    voice.outAnalyser.fftSize = 512;
    voice.outAnalyser.smoothingTimeConstant = 0.65;
    outSrc.connect(voice.outAnalyser);

    voice.pc = new RTCPeerConnection({
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
    });

    // SmallWebRTCTransport requires both audio AND video transceivers, even
    // for voice-only sessions. Same pattern as messenger + voice_client.js.
    const audioTransceiver = voice.pc.addTransceiver("audio", { direction: "sendrecv" });
    const micTrack = voice.micStream.getAudioTracks()[0];
    if (micTrack) await audioTransceiver.sender.replaceTrack(micTrack);
    voice.pc.addTransceiver("video", { direction: "sendrecv" });

    voice.pc.ontrack = (ev) => {
      if (ev.track.kind !== "audio") return;
      const stream = new MediaStream([ev.track]);
      // Pre-mounted hidden <audio> with playsinline + autoplay; iOS Safari
      // needs the element to exist in the DOM at gesture time, not be
      // constructed after the SDP exchange.
      const audioEl = elVoiceAudio();
      if (audioEl) {
        audioEl.srcObject = stream;
        audioEl.play().catch(() => {});
      }
      if (voice.audioCtx) {
        voice.inAnalyser = voice.audioCtx.createAnalyser();
        voice.inAnalyser.fftSize = 512;
        voice.inAnalyser.smoothingTimeConstant = 0.65;
        voice.audioCtx.createMediaStreamSource(stream).connect(voice.inAnalyser);
      }
    };

    try {
      const offer = await voice.pc.createOffer();
      await voice.pc.setLocalDescription(offer);
      if (status) status.textContent = "Negotiating…";
      // Wait for ICE candidates (capped) so the SDP isn't half-empty — reduces
      // first-packet lag once the remote answers.
      await waitForIceGathering(voice.pc, 600);
      const local = voice.pc.localDescription || offer;
      const resp = await fetch(`/voice/session/${voice.sessionAtStart}/offer`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sdp: local.sdp, type: local.type, agent: state.agent }),
      });
      if (!resp.ok) {
        const txt = await resp.text();
        throw new Error(`signaling failed (${resp.status}): ${txt}`);
      }
      const answer = await resp.json();
      await voice.pc.setRemoteDescription({ type: answer.type, sdp: answer.sdp });
      voiceSetState(VOICE_STATE.LISTENING, true);
      voiceTick();
    } catch (e) {
      console.error("voice start failed:", e);
      voiceShowError(e.message || "voice connection failed");
      await endVoiceCall({ reloadHistory: false });
    }
  }

  async function endVoiceCall(opts = {}) {
    const { reloadHistory = true } = opts;
    if (voice.raf) { cancelAnimationFrame(voice.raf); voice.raf = null; }
    if (voice.pc) { try { voice.pc.close(); } catch (e) {} voice.pc = null; }
    if (voice.micStream) {
      for (const t of voice.micStream.getTracks()) t.stop();
      voice.micStream = null;
    }
    const audioEl = elVoiceAudio();
    if (audioEl) { try { audioEl.srcObject = null; } catch (e) {} }
    if (voice.audioCtx) { try { await voice.audioCtx.close(); } catch (e) {} voice.audioCtx = null; }
    voice.outAnalyser = null;
    voice.inAnalyser = null;
    voice.outEma = 0;
    voice.inEma = 0;
    voice.userActive = false;
    voice.botActive = false;
    voice.state = VOICE_STATE.IDLE;
    closeVoiceOverlay();
    // Re-fetch the conversation so the voice turns the backend persisted
    // (user transcripts + assistant utterances) appear in the thread without
    // a page reload. Only reload if we're still on the same session that was
    // active when the call started — otherwise we'd clobber a chat the user
    // navigated to mid-call.
    if (reloadHistory && voice.sessionAtStart && voice.sessionAtStart === state.sessionId) {
      try { await loadHistory(state.sessionId); } catch (e) { /* best-effort */ }
    }
    voice.sessionAtStart = null;
  }

  // ─── Events ────────────────────────────────────────────────────────────────
  function bindEvents() {
    $$('.agent-pill').forEach(p => {
      p.addEventListener("click", () => {
        setAgent(p.dataset.agent);
        state.sessionId = null;
        elThread().innerHTML = "";
        elSessionMeta().textContent = "new session";
        window.history.replaceState({}, "", "/chat");
        resumeLatestThread();  // walk into this agent's ongoing room (if any)
      });
    });

    elSend().addEventListener("click", onSubmit);
    elInput().addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); onSubmit(); }
    });
    elStreamToggle().addEventListener("click", () => {
      state.stream = !state.stream;
      localStorage.setItem("soveryn.stream", String(state.stream));
      elStreamToggle().textContent = state.stream ? "stream ▾" : "sync  ▾";
    });

    // Paperclip → hidden file input. Read each picked file as a data URL and
    // queue it in state.pendingAttachments; the next send rides the queue.
    const attachBtn = elAttachBtn();
    const fileInput = elFileInput();
    if (attachBtn && fileInput) {
      attachBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", async (evt) => {
        const files = Array.from(evt.target.files || []);
        for (const file of files) {
          if (state.pendingAttachments.length >= MAX_ATTACHMENT_COUNT) {
            alert(`Max ${MAX_ATTACHMENT_COUNT} attachments per message`);
            break;
          }
          if (!ALLOWED_IMAGE_MIMES.has(file.type)) {
            alert(`Not a supported image type: ${file.name} (${file.type || "unknown"})`);
            continue;
          }
          if (file.size > MAX_ATTACHMENT_BYTES) {
            alert(`${file.name} exceeds 16MB`);
            continue;
          }
          try {
            const dataUrl = await new Promise((resolve, reject) => {
              const r = new FileReader();
              r.onload = () => resolve(r.result);
              r.onerror = () => reject(new Error("read failed"));
              r.readAsDataURL(file);
            });
            state.pendingAttachments.push({ name: file.name, dataUrl });
          } catch (e) {
            alert(`Failed to read ${file.name}: ${e.message}`);
          }
        }
        renderAttachmentsRow();
        fileInput.value = "";  // reset so re-selecting same file works
      });
    }

    // Voice call: click on the header button → open overlay + start call.
    // Both the click and audio.play() must happen on the same gesture path
    // for iOS Safari to permit playback later (see startVoiceCall comments).
    const callBtn = elCallBtn();
    if (callBtn) {
      callBtn.addEventListener("click", () => { startVoiceCall(); });
    }
    const hangupBtn = elVoiceHangup();
    if (hangupBtn) {
      hangupBtn.addEventListener("click", () => { endVoiceCall(); });
    }
    // Escape hangs up if a call is active. Cmd/Ctrl+W can't reliably be
    // intercepted from a tab (browser policy), so Escape is the primary
    // keyboard exit; ⌘B still toggles the sidebar via the other listener.
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && voice.pc) {
        e.preventDefault();
        endVoiceCall();
      }
    });

    $('[data-testid="new-chat"]').addEventListener("click", () => {
      state.sessionId = null;
      elThread().innerHTML = "";
      elSessionMeta().textContent = "new session";
      window.history.replaceState({}, "", "/chat");
      elInput().focus();
    });

    // ── Header actions: Persona / Export / More (were decorative until now) ──
    function openChatModal(title, body) {
      const backdrop = document.querySelector('[data-testid="chat-modal"]');
      if (!backdrop) return;
      backdrop.querySelector("[data-modal-title]").textContent = title;
      backdrop.querySelector("[data-modal-body]").textContent = body;
      backdrop.hidden = false;
    }
    function closeChatModal() {
      const backdrop = document.querySelector('[data-testid="chat-modal"]');
      if (backdrop) backdrop.hidden = true;
    }
    const modal = document.querySelector('[data-testid="chat-modal"]');
    if (modal) {
      modal.querySelector("[data-modal-close]")?.addEventListener("click", closeChatModal);
      modal.addEventListener("click", (e) => { if (e.target === modal) closeChatModal(); });
      modal.querySelector("[data-modal-copy]")?.addEventListener("click", async () => {
        const text = modal.querySelector("[data-modal-body]")?.textContent || "";
        try { await navigator.clipboard.writeText(text); } catch (_) {}
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal && !modal.hidden) {
          e.preventDefault();
          closeChatModal();
        }
      });
    }

    document.querySelector('[data-testid="persona-btn"]')?.addEventListener("click", async () => {
      try {
        const r = await fetch(`/api/persona/${encodeURIComponent(state.agent)}`);
        if (!r.ok) {
          openChatModal("Persona", `Could not load persona for ${state.agent} (HTTP ${r.status}).`);
          return;
        }
        const data = await r.json();
        openChatModal(
          `Persona · ${data.agent || state.agent}`,
          (data.persona || "").trim() || "(empty persona)"
        );
      } catch (e) {
        openChatModal("Persona", String(e && e.message || e));
      }
    });

    document.querySelector('[data-testid="export-btn"]')?.addEventListener("click", async () => {
      if (!state.sessionId) {
        openChatModal("Export", "No session yet — send a message first, then export.");
        return;
      }
      try {
        const r = await fetch(`/sessions/${state.sessionId}/history`);
        if (!r.ok) {
          openChatModal("Export", `Could not load history (HTTP ${r.status}).`);
          return;
        }
        const data = await r.json();
        const turns = data.turns || data.history || data.messages || [];
        const lines = [
          `# SOVERYN chat · ${state.agent}`,
          `session: ${state.sessionId}`,
          `exported: ${new Date().toISOString()}`,
          "",
        ];
        for (const t of turns) {
          const role = (t.role || t.speaker || "?").toUpperCase();
          const content = t.content || t.text || "";
          if (!content) continue;
          lines.push(`## ${role}`, content, "");
        }
        const md = lines.join("\n");
        const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `soveryn-${state.agent}-${state.sessionId.slice(0, 8)}.md`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      } catch (e) {
        openChatModal("Export", String(e && e.message || e));
      }
    });

    const moreBtn = document.querySelector('[data-testid="more-btn"]');
    const moreMenu = document.querySelector('[data-testid="more-menu"]');
    function closeMoreMenu() {
      if (moreMenu) moreMenu.hidden = true;
      if (moreBtn) moreBtn.setAttribute("aria-expanded", "false");
    }
    if (moreBtn && moreMenu) {
      moreBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const open = moreMenu.hidden;
        moreMenu.hidden = !open;
        moreBtn.setAttribute("aria-expanded", open ? "true" : "false");
      });
      document.addEventListener("click", (e) => {
        if (!moreMenu.hidden && !moreMenu.contains(e.target) && e.target !== moreBtn) {
          closeMoreMenu();
        }
      });
      moreMenu.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-more]");
        if (!btn) return;
        const action = btn.getAttribute("data-more");
        closeMoreMenu();
        if (action === "copy-id") {
          if (!state.sessionId) {
            openChatModal("Session", "No session id yet — send a message first.");
            return;
          }
          try {
            await navigator.clipboard.writeText(state.sessionId);
            openChatModal("Session", `Copied:\n${state.sessionId}`);
          } catch (_) {
            openChatModal("Session", state.sessionId);
          }
        } else if (action === "delete") {
          if (!state.sessionId) {
            openChatModal("Delete", "Nothing to delete — this is already a new session.");
            return;
          }
          if (!confirm("Delete this session permanently?")) return;
          try {
            const r = await fetch(`/sessions/${state.sessionId}`, { method: "DELETE" });
            if (!r.ok) {
              openChatModal("Delete", `Delete failed (HTTP ${r.status}).`);
              return;
            }
            state.sessionId = null;
            elThread().innerHTML = "";
            elSessionMeta().textContent = "new session";
            window.history.replaceState({}, "", "/chat");
            loadSessions();
          } catch (err) {
            openChatModal("Delete", String(err && err.message || err));
          }
        }
      });
    }

    document.querySelector('[data-testid="search"]').addEventListener("input", renderHistory);

    document.querySelector('[data-testid="bulk-clear"]').addEventListener("click", async () => {
      // Count sessions that would be deleted (everything for the current agent
      // EXCEPT the one currently open, so we don't nuke the chat the user is in).
      const total = state.sessions.length;
      const keepOpen = state.sessionId && state.sessions.some(s => s.session_id === state.sessionId);
      const toDelete = keepOpen ? total - 1 : total;
      if (toDelete === 0) {
        alert("No other sessions to clear.");
        return;
      }
      const msg = keepOpen
        ? `Delete ${toDelete} ${state.agent} session${toDelete === 1 ? "" : "s"}? (Your current open session will be kept.) This cannot be undone.`
        : `Delete ALL ${toDelete} ${state.agent} sessions? This cannot be undone.`;
      if (!confirm(msg)) return;
      const targets = state.sessions.filter(s => s.session_id !== state.sessionId);
      let failed = 0;
      for (const s of targets) {
        const r = await fetch(`/sessions/${s.session_id}`, { method: "DELETE" });
        if (!r.ok) failed++;
      }
      if (failed > 0) alert(`${failed} delete${failed === 1 ? "" : "s"} failed; the rest were cleared.`);
      loadSessions();
    });
  }

  async function onSubmit() {
    const msg = elInput().value.trim();
    const hasAttachments = state.pendingAttachments.length > 0;
    if (!msg && !hasAttachments) return;
    elInput().value = "";
    // sendStreaming / sendSync handle the empty-msg + attachments case
    // internally (wire payload gets "(image)" synthesized; display shows
    // just the image with no echoed text).
    if (state.stream) await sendStreaming(msg);
    else await sendSync(msg);
  }

  // ─── Sidebar collapse ──────────────────────────────────────────────────────
  function applySidebarState(collapsed) {
    document.body.classList.toggle("sidebar-collapsed", collapsed);
    localStorage.setItem("soveryn.sidebar.collapsed", String(collapsed));
  }
  function toggleSidebar() {
    applySidebarState(!document.body.classList.contains("sidebar-collapsed"));
  }
  function initSidebar() {
    applySidebarState(localStorage.getItem("soveryn.sidebar.collapsed") === "true");
    const btn = document.querySelector('[data-testid="sidebar-toggle"]');
    if (btn) btn.addEventListener("click", toggleSidebar);
    // ⌘B / Ctrl-B power-user shortcut. Matches VS Code, ChatGPT.
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") {
        e.preventDefault();
        toggleSidebar();
      }
    });
  }

  // ─── Resume latest per-agent thread ─────────────────────────────────────────
  // Default landing: open the most-recent HUMAN thread for the current agent
  // instead of cold-starting a blank session — so she keeps the continuous
  // thread ("holding the thread"), per-rail / per-agent. Rail + automated
  // sessions (titles starting with "[" — [signal] [m] [heartbeat] [direct:…]
  // [specialist…] [webhook] …) are skipped so we never land in another rail's
  // session. PURELY NON-DESTRUCTIVE: only chooses which existing session to
  // open; never creates or deletes. Falls back to lazy-mint (sessionId stays
  // null) if the agent has no prior human thread.
  async function resumeLatestThread() {
    try {
      const r = await fetch(`/sessions?agent=${state.agent}&limit=100`);
      if (!r.ok) return;
      const data = await r.json();
      const latest = (data.sessions || []).find(
        s => !(s.title || "").trim().startsWith("[")
      );
      if (!latest) return;
      state.sessionId = latest.session_id;
      window.history.replaceState({}, "", `/chat/${latest.session_id}`);
      elSessionMeta().textContent = latest.title || latest.session_id.slice(0, 8);
      await loadHistory(latest.session_id);
    } catch (e) { /* best-effort; lazy-mint remains the fallback */ }
  }

  // ─── Boot ──────────────────────────────────────────────────────────────────
  function boot() {
    initSidebar();
    const { sessionId, agent } = parseUrl();
    setAgent(pickInitialAgent(agent));
    state.sessionId = sessionId;
    elStreamToggle().textContent = state.stream ? "stream ▾" : "sync  ▾";
    bindEvents();
    loadSessions();
    if (sessionId) loadHistory(sessionId);
    else resumeLatestThread();
  }
  document.addEventListener("DOMContentLoaded", boot);
})();
</script>
</body>
</html>
