<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat · SOVERYN</title>
<style>
  :root {
    --bg: #000; --panel: #0c0b0a; --line: rgba(255,255,255,0.08);
    --ink: #f5f2ea; --mute: rgba(245,242,234,0.45); --gold: #c6a664; --mint: #6fb98a;
    --bubble-them: #1c1a17; --bubble-me: #2a2418;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
  }
  header.top {
    position: sticky; top: 0; z-index: 3;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .back {
    color: var(--gold); text-decoration: none; font-size: 17px;
    padding: 6px 4px; flex-shrink: 0;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #0c0b0a;
    background: linear-gradient(145deg, var(--gold), #8a7038);
  }
  .avatar[data-agent="vett"] { background: linear-gradient(145deg, #7ec8e3, #3a7a9a); }
  .avatar[data-agent="scotty"] { background: linear-gradient(145deg, #e8a87c, #a65d3b); }
  .avatar[data-agent="eve"] { background: linear-gradient(145deg, #e0b0ff, #7a4a9a); }
  .avatar[data-agent="kernel"] { background: linear-gradient(145deg, #9ee0b8, #3d7a55); }
  .who { flex: 1; min-width: 0; }
  .who .name { font-weight: 600; font-size: 17px; }
  .who .sub { font-size: 12px; color: var(--mute); }
  .top-actions a {
    color: var(--mute); text-decoration: none; font-size: 13px; padding: 6px;
  }

  .collab-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  .collab-chips[hidden] { display: none !important; }
  .collab-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 12px 8px 8px; border-radius: 999px;
    border: 1px solid rgba(111,185,138,0.35);
    background: rgba(111,185,138,0.1);
    color: var(--ink); font-size: 13px; text-decoration: none;
  }
  .collab-av {
    width: 28px; height: 28px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(111,185,138,0.4); color: #0c0b0a; font-weight: 700; font-size: 12px;
  }

  .thread {
    flex: 1; overflow-y: auto; padding: 12px 12px 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 18px;
    font-size: 16px; line-height: 1.35; white-space: pre-wrap; word-break: break-word;
  }
  .bubble.them {
    align-self: flex-start;
    background: var(--bubble-them); border-bottom-left-radius: 4px;
  }
  .bubble.me {
    align-self: flex-end;
    background: var(--bubble-me); border: 1px solid rgba(198,166,100,0.25);
    border-bottom-right-radius: 4px;
  }
  .bubble.sys {
    align-self: center; max-width: 90%;
    background: transparent; color: var(--mute); font-size: 13px;
    text-align: center; padding: 6px 10px;
  }
  /* In-thread peer: just the bot shape — tap opens group chat (Grok Bots style) */
  a.messaged-peer {
    align-self: flex-start;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    text-decoration: none; color: var(--ink);
    padding: 4px 6px; border-radius: 16px;
    max-width: 88px; border: 1px solid transparent;
  }
  a.messaged-peer:active { opacity: 0.85; }
  a.messaged-peer:focus-visible {
    outline: none; border-color: rgba(111,185,138,0.5);
  }
  a.messaged-peer .mp-av {
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px; color: #0c0b0a;
    background: linear-gradient(145deg, #7ec8e3, #3a7a9a);
    box-shadow: 0 0 0 2px rgba(111,185,138,0.35);
  }
  a.messaged-peer .mp-av[data-agent="vett"] { background: linear-gradient(145deg, #7ec8e3, #3a7a9a); }
  a.messaged-peer .mp-av[data-agent="eve"] { background: linear-gradient(145deg, #e0b0ff, #7a4a9a); }
  a.messaged-peer .mp-av[data-agent="scotty"] { background: linear-gradient(145deg, #e8a87c, #a65d3b); }
  a.messaged-peer .mp-av[data-agent="kernel"] { background: linear-gradient(145deg, #9ee0b8, #3d7a55); }
  a.messaged-peer .mp-name {
    font-size: 11px; font-weight: 600; color: var(--mute);
    text-align: center; line-height: 1.2;
  }
  .day {
    align-self: center; font-size: 12px; color: var(--mute); padding: 8px 0 4px;
  }

  .composer {
    display: flex; gap: 8px; align-items: flex-end;
    padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: rgba(0,0,0,0.95);
  }
  .composer input {
    flex: 1; font: inherit; font-size: 16px; padding: 10px 14px;
    border-radius: 20px; border: 1px solid var(--line);
    background: #141210; color: var(--ink); outline: none;
  }
  .composer button {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--gold); color: #0c0b0a; font-size: 18px; font-weight: 700;
    cursor: pointer; flex-shrink: 0;
  }
  .composer button:disabled { opacity: 0.4; }
</style>
</head>
<body>
  <header class="top">
    <a class="back" href="/messages" aria-label="Back">‹</a>
    <div class="avatar" data-agent-av>A</div>
    <div class="who">
      <div class="name" data-agent-name>Aetheria</div>
      <div class="sub" data-agent-sub>tap Messaged chips to open group chats</div>
    </div>
    <div class="top-actions">
      <a href="/chat" data-full-chat title="Full chat">Full</a>
    </div>
  </header>

  <div class="collab-chips" data-collab-chips hidden></div>
  <div class="thread" data-thread role="log" aria-live="polite"></div>

  <form class="composer" data-composer onsubmit="return false">
    <input type="text" data-input placeholder="iMessage" aria-label="Message" autocomplete="off">
    <button type="button" data-send aria-label="Send">↑</button>
  </form>

<script>
(function () {
  const CONTACTS = {
    aetheria: { name: "Aetheria", letter: "A", sub: "Runs the house" },
    vett: { name: "Vett", letter: "V", sub: "Checks the work" },
    scotty: { name: "Scotty", letter: "S", sub: "Gets it done" },
    eve: { name: "Eve", letter: "E", sub: "Shows up online" },
    kernel: { name: "Kernel", letter: "K", sub: "Builds with you" },
  };

  const params = new URLSearchParams(location.search);
  const pathAgent = (location.pathname.split("/").pop() || "").toLowerCase();
  const agent = (params.get("agent") || pathAgent || "aetheria").toLowerCase();
  const contact = CONTACTS[agent] || { name: agent, letter: "?", sub: "" };

  const state = { agent, sessionId: params.get("session") || null, sending: false };

  const $ = (s) => document.querySelector(s);
  const thread = () => $("[data-thread]");
  const chips = () => $("[data-collab-chips]");

  document.title = contact.name + " · Messages";
  $("[data-agent-av]").dataset.agent = agent;
  $("[data-agent-av]").textContent = contact.letter;
  $("[data-agent-name]").textContent = contact.name;
  $("[data-agent-sub]").textContent = contact.sub;
  $("[data-full-chat]").href = "/chat?agent=" + encodeURIComponent(agent);

  function esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function appendBubble(kind, text) {
    const b = document.createElement("div");
    b.className = "bubble " + kind;
    b.textContent = text;
    thread().appendChild(b);
    thread().scrollTop = thread().scrollHeight;
    return b;
  }

  function roomHref(peer, roomSessionId) {
    return "/room?peer=" + encodeURIComponent(peer)
      + (roomSessionId ? "&session=" + encodeURIComponent(roomSessionId) : "")
      + (state.sessionId ? "&from=" + encodeURIComponent(state.sessionId) : "");
  }

  function appendMessagedPeer(peer, roomSessionId) {
    const name = peer.charAt(0).toUpperCase() + peer.slice(1);
    const a = document.createElement("a");
    a.className = "messaged-peer";
    a.href = roomHref(peer, roomSessionId);
    a.title = "Open group chat with " + name;
    a.setAttribute("aria-label", "Open group chat with " + name);
    a.innerHTML =
      '<span class="mp-av" data-agent="' + esc(peer) + '">' + esc(name.charAt(0)) + '</span>' +
      '<span class="mp-name">' + esc(name) + '</span>';
    thread().appendChild(a);
    thread().scrollTop = thread().scrollHeight;
    return a;
  }

  function renderTurns(turns, collabIndex) {
    thread().innerHTML = "";
    const byPeer = {};
    (collabIndex || []).forEach((ev) => {
      if (ev.peer && ev.room_session_id) byPeer[ev.peer] = ev.room_session_id;
    });
    (turns || []).forEach((t) => {
      if (t.role === "user") appendBubble("me", t.content);
      else if (t.role === "assistant") appendBubble("them", t.content);
      else if (t.role === "system") {
        const m = /⟦room:messaged:([a-z]+)⟧/.exec(t.content || "");
        if (m) {
          appendMessagedPeer(m[1], byPeer[m[1]] || null);
        } else {
          appendBubble("sys", (t.content || "").replace(/⟦room:messaged:[a-z]+⟧\s*/, ""));
        }
      }
    });
  }

  function renderChips(events) {
    // Keep a slim strip of latest unique peers as shortcuts (optional)
    const row = chips();
    const list = Array.isArray(events) ? events : [];
    if (!list.length || agent !== "aetheria") {
      row.hidden = true;
      row.innerHTML = "";
      return;
    }
    const seen = new Set();
    const html = [];
    for (const ev of list) {
      const peer = (ev.peer || "").toLowerCase();
      if (!peer || seen.has(peer)) continue;
      seen.add(peer);
      const name = peer.charAt(0).toUpperCase() + peer.slice(1);
      html.push(
        '<a class="collab-chip" href="' + roomHref(peer, ev.room_session_id) + '">' +
          '<span class="collab-av">' + esc(name.charAt(0)) + '</span>' +
          '<span>' + esc(name) + '</span></a>'
      );
    }
    row.hidden = !html.length;
    row.innerHTML = html.join("");
  }

  async function refreshChips() {
    if (!state.sessionId || agent !== "aetheria") {
      renderChips([]);
      return;
    }
    try {
      const r = await fetch("/api/rooms/collabs?dm_session_id=" + encodeURIComponent(state.sessionId));
      if (!r.ok) return;
      const d = await r.json();
      renderChips(d.collabs || []);
    } catch (_) {}
  }

  async function ensureSession() {
    if (state.sessionId) return state.sessionId;
    const r = await fetch("/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ agent: state.agent }),
    });
    const d = await r.json();
    state.sessionId = d.session_id;
    const u = new URL(location.href);
    u.searchParams.set("session", state.sessionId);
    history.replaceState({}, "", u);
    return state.sessionId;
  }

  async function collabs() {
    if (!state.sessionId || agent !== "aetheria") return [];
    try {
      const r = await fetch("/api/rooms/collabs?dm_session_id=" + encodeURIComponent(state.sessionId));
      if (!r.ok) return [];
      const d = await r.json();
      return d.collabs || [];
    } catch (_) { return []; }
  }

  async function loadLatestOrHistory() {
    if (state.sessionId) {
      const r = await fetch("/sessions/" + encodeURIComponent(state.sessionId) + "/history");
      if (r.ok) {
        const d = await r.json();
        const c = await collabs();
        renderTurns(d.turns || [], c);
        renderChips(c);
        return;
      }
    }
    const r = await fetch("/sessions?agent=" + encodeURIComponent(agent) + "&limit=1");
    if (r.ok) {
      const d = await r.json();
      const s = (d.sessions && d.sessions[0]) || null;
      if (s && s.session_id) {
        state.sessionId = s.session_id;
        const u = new URL(location.href);
        u.searchParams.set("session", state.sessionId);
        history.replaceState({}, "", u);
        const h = await fetch("/sessions/" + encodeURIComponent(state.sessionId) + "/history");
        if (h.ok) {
          const hd = await h.json();
          const c = await collabs();
          renderTurns(hd.turns || [], c);
          renderChips(c);
        }
        return;
      }
    }
    thread().innerHTML = "";
    appendBubble("sys", "Say hello to start the thread.");
  }

  async function send() {
    const input = $("[data-input]");
    const msg = (input.value || "").trim();
    if (!msg || state.sending) return;
    state.sending = true;
    $("[data-send]").disabled = true;
    input.value = "";
    appendBubble("me", msg);
    const them = appendBubble("them", "…");
    try {
      await ensureSession();
      const r = await fetch("/chat_stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          agent: state.agent,
          session_id: state.sessionId,
          message: msg,
        }),
      });
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "", text = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const part of parts) {
          const line = part.split("\n").find((l) => l.startsWith("data: "));
          if (!line) continue;
          const payload = JSON.parse(line.slice(6));
          if (payload.type === "token" && payload.delta) {
            text += payload.delta;
            them.textContent = text;
            thread().scrollTop = thread().scrollHeight;
          } else if (payload.type === "error") {
            them.textContent = "error · " + (payload.message || payload.code);
          }
        }
      }
      if (!text) them.textContent = "(no reply)";
      // Reload to pick up in-thread Messaged {peer} avatars
      const h = await fetch("/sessions/" + encodeURIComponent(state.sessionId) + "/history");
      if (h.ok) {
        const hd = await h.json();
        const c = await collabs();
        renderTurns(hd.turns || [], c);
        renderChips(c);
      }
    } catch (e) {
      them.textContent = "error · " + e.message;
    }
    state.sending = false;
    $("[data-send]").disabled = false;
    input.focus();
  }

  $("[data-send]").addEventListener("click", send);
  $("[data-input]").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); send(); }
  });

  loadLatestOrHistory();
  $("[data-input]").focus();
})();
</script>
</body>
</html>
