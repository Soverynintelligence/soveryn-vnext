<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages · SOVERYN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500&display=swap">
<style>
  :root {
    --bg: #000; --panel: #0c0b0a; --line: rgba(255,255,255,0.08);
    --ink: #f5f2ea; --mute: rgba(245,242,234,0.45); --gold: #c6a664; --mint: #6fb98a;
    --bubble-them: #1c1a17; --bubble-me: #2a2418;
    /* Same face as Desk / Staff (lab-console) — one house */
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  header.top {
    position: sticky; top: 0; z-index: 3;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .back {
    color: var(--gold); text-decoration: none; font-size: 17px;
    padding: 6px 4px; flex-shrink: 0;
  }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #0c0b0a;
    background: linear-gradient(145deg, var(--gold), #8a7038);
  }
  .avatar[data-agent="vett"] { background: linear-gradient(145deg, #7ec8e3, #3a7a9a); }
  .avatar[data-agent="scotty"] { background: linear-gradient(145deg, #e8a87c, #a65d3b); }
  .avatar[data-agent="eve"] { background: linear-gradient(145deg, #e0b0ff, #7a4a9a); }
  .avatar[data-agent="kernel"] { background: linear-gradient(145deg, #9ee0b8, #3d7a55); }
  .avatar[data-agent="t_critic"] { background: linear-gradient(145deg, #d4a574, #6b4a2e); }
  .avatar[data-agent="t_scout"] { background: linear-gradient(145deg, #8eb8d4, #3a5a70); }
  .who { flex: 1; min-width: 0; }
  .who .name { font-weight: 600; font-size: 17px; }
  .who .sub { font-size: 12px; color: var(--mute); }
  .top-actions a {
    color: var(--mute); text-decoration: none; font-size: 13px; padding: 6px;
  }

  .collab-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  .collab-chips[hidden] { display: none !important; }
  .collab-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 12px 8px 8px; border-radius: 999px;
    border: 1px solid rgba(111,185,138,0.35);
    background: rgba(111,185,138,0.1);
    color: var(--ink); font-size: 13px; text-decoration: none;
  }
  .collab-av {
    width: 28px; height: 28px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(111,185,138,0.4); color: #0c0b0a; font-weight: 700; font-size: 12px;
  }

  .thread {
    flex: 1; overflow-y: auto; padding: 12px 12px 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 18px;
    font-size: 16px; line-height: 1.4; word-break: break-word;
  }
  .bubble.them {
    align-self: flex-start;
    background: var(--bubble-them); border-bottom-left-radius: 4px;
  }
  .bubble.me {
    align-self: flex-end; white-space: pre-wrap;
    background: var(--bubble-me); border: 1px solid rgba(198,166,100,0.25);
    border-bottom-right-radius: 4px;
  }
  .bubble.sys {
    align-self: center; max-width: 90%;
    background: transparent; color: var(--mute); font-size: 13px;
    text-align: center; padding: 6px 10px; white-space: pre-wrap;
  }
  .bubble.them .md-body > *:first-child { margin-top: 0; }
  .bubble.them .md-body > *:last-child { margin-bottom: 0; }
  .bubble.them .md-body p { margin: 0.45em 0; }
  .bubble.them .md-body h1,
  .bubble.them .md-body h2,
  .bubble.them .md-body h3,
  .bubble.them .md-body h4 {
    font-size: 1.05em; font-weight: 700; margin: 0.65em 0 0.3em; letter-spacing: -0.01em;
  }
  .bubble.them .md-body ul, .bubble.them .md-body ol {
    margin: 0.4em 0; padding-left: 1.25em;
  }
  .bubble.them .md-body li { margin: 0.15em 0; }
  .bubble.them .md-body code {
    font-family: var(--mono);
    font-size: 0.88em; background: rgba(255,255,255,0.06);
    padding: 0.1em 0.35em; border-radius: 4px;
  }
  .bubble.them .md-body pre {
    margin: 0.5em 0; padding: 10px 12px; overflow-x: auto;
    background: rgba(0,0,0,0.35); border-radius: 10px; font-size: 0.86em;
  }
  .bubble.them .md-body pre code { background: none; padding: 0; }
  .bubble.them .md-body a { color: var(--gold); }
  .bubble.them .md-body blockquote {
    margin: 0.45em 0; padding-left: 10px; border-left: 2px solid rgba(198,166,100,0.4);
    color: var(--mute);
  }
  /* In-thread peer: bot shape — tap opens group (working pulse = functional signal) */
  a.messaged-peer {
    align-self: flex-start;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    text-decoration: none; color: var(--ink);
    padding: 4px 6px; border-radius: 16px;
    max-width: 96px; border: 1px solid transparent;
  }
  a.messaged-peer:active { opacity: 0.85; }
  a.messaged-peer:focus-visible {
    outline: none; border-color: rgba(111,185,138,0.5);
  }
  a.messaged-peer .mp-av {
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px; color: #0c0b0a;
    background: linear-gradient(145deg, #7ec8e3, #3a7a9a);
    box-shadow: 0 0 0 2px rgba(111,185,138,0.35);
  }
  a.messaged-peer .mp-av[data-agent="vett"] { background: linear-gradient(145deg, #7ec8e3, #3a7a9a); }
  a.messaged-peer .mp-av[data-agent="eve"] { background: linear-gradient(145deg, #e0b0ff, #7a4a9a); }
  a.messaged-peer .mp-av[data-agent="scotty"] { background: linear-gradient(145deg, #e8a87c, #a65d3b); }
  a.messaged-peer .mp-av[data-agent="kernel"] { background: linear-gradient(145deg, #9ee0b8, #3d7a55); }
  a.messaged-peer[data-state="working"] .mp-av {
    animation: mp-work 1.4s ease-in-out infinite;
    box-shadow: 0 0 0 3px rgba(111,185,138,0.55);
  }
  a.messaged-peer[data-state="replied"] .mp-av {
    box-shadow: 0 0 0 2px rgba(198,166,100,0.65);
  }
  @keyframes mp-work {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  a.messaged-peer .mp-name {
    font-size: 11px; font-weight: 600; color: var(--mute);
    text-align: center; line-height: 1.2;
  }
  a.messaged-peer .mp-status {
    font-size: 10px; color: var(--mint, #6fb98a); text-align: center; line-height: 1.2;
  }
  a.messaged-peer[data-state="replied"] .mp-status { color: var(--gold); }
  a.messaged-peer[data-state="gate"] .mp-av {
    box-shadow: 0 0 0 3px rgba(198,166,100,0.8);
    animation: mp-work 1.1s ease-in-out infinite;
  }
  a.messaged-peer[data-state="gate"] .mp-status { color: var(--gold); }
  .day {
    align-self: center; font-size: 12px; color: var(--mute); padding: 8px 0 4px;
  }

  /* Approval Gate — needs your yes (was invisible on messenger; caused silent hangs) */
  .approval-card {
    align-self: flex-start;
    max-width: 88%;
    margin: 4px 0 8px;
    padding: 10px 12px;
    background: #141210;
    border: 1px solid var(--gold);
    border-radius: 14px;
    font-size: 14px;
  }
  .approval-card .ac-head {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 6px; font-weight: 600;
  }
  .approval-card .ac-tool { font-size: 13px; color: var(--ink); margin-bottom: 4px; }
  .approval-card .ac-args {
    font-size: 12px; color: var(--mute); white-space: pre-wrap; word-break: break-word;
    margin: 0 0 10px;
  }
  .approval-card .ac-actions { display: flex; gap: 8px; }
  .approval-card .ac-actions button {
    font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); cursor: pointer; background: #0c0b0a; color: var(--ink);
  }
  .approval-card .ac-actions button.ac-allow {
    border-color: var(--mint); color: var(--mint);
  }
  .approval-card .ac-actions button.ac-deny {
    border-color: #e07070; color: #e07070;
  }
  .approval-card .ac-actions button:disabled { opacity: 0.45; }
  .approval-card.ac-done { border-color: var(--line); opacity: 0.85; }
  .approval-card .ac-notice { margin-top: 8px; font-size: 12px; color: var(--mute); }

  /* Marketing draft card — compose_post result visible in-thread (Grok-bot feel) */
  .draft-card {
    align-self: flex-start;
    max-width: 88%;
    margin: 4px 0 8px;
    padding: 10px 12px;
    background: #12141a;
    border: 1px solid var(--line);
    border-radius: 14px;
    font-size: 14px;
  }
  .draft-card .dc-head {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--mint, #6fb98a); margin-bottom: 6px; font-weight: 600;
  }
  .draft-card .dc-caption {
    white-space: pre-wrap; word-break: break-word; color: var(--ink);
    margin: 0 0 8px; line-height: 1.35;
  }
  .draft-card .dc-meta { font-size: 12px; color: var(--mute); }

  .composer {
    position: sticky; bottom: 0; z-index: 4;
    display: flex; gap: 8px; align-items: flex-end;
    padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: rgba(0,0,0,0.95);
  }
  .composer input {
    flex: 1; font: inherit; font-size: 16px; padding: 10px 14px;
    border-radius: 20px; border: 1px solid var(--line);
    background: #141210; color: var(--ink); outline: none;
  }
  .composer button {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--gold); color: #0c0b0a; font-size: 18px; font-weight: 700;
    cursor: pointer; flex-shrink: 0;
  }
  .composer button:disabled { opacity: 0.4; }
</style>
</head>
<body>
  <header class="top">
    <a class="back" href="/messages" aria-label="Back">‹</a>
    <div class="avatar" data-agent-av>A</div>
    <div class="who">
      <div class="name" data-agent-name>Aetheria</div>
      <div class="sub" data-agent-sub></div>
    </div>
    <div class="top-actions"></div>
  </header>

  <div class="collab-chips" data-collab-chips hidden></div>
  <div class="thread" data-thread role="log" aria-live="polite"></div>

  <form class="composer" data-composer onsubmit="return false">
    <input type="text" data-input placeholder="Message" aria-label="Message" autocomplete="off">
    <button type="button" data-send aria-label="Send">↑</button>
  </form>

<script>
(function () {
  const CONTACTS = {
    aetheria: { name: "Aetheria", letter: "A", sub: "Runs the house" },
    vett: { name: "Vett", letter: "V", sub: "Checks the work" },
    scotty: { name: "Scotty", letter: "S", sub: "Gets it done" },
    eve: { name: "Eve", letter: "E", sub: "Shows up online" },
    kernel: { name: "Kernel", letter: "K", sub: "Builds with you" },
    t_critic: { name: "Critic", letter: "C", sub: "Overnight review · inbox" },
    t_scout: { name: "Scout", letter: "Sc", sub: "Overnight scan · inbox" },
  };
  // Teammates overnight inboxes — read-only (no chat_stream agent).
  const INBOX_ONLY = { t_critic: true, t_scout: true };

  const params = new URLSearchParams(location.search);
  const pathAgent = (location.pathname.split("/").pop() || "").toLowerCase();
  const agent = (params.get("agent") || pathAgent || "aetheria").toLowerCase();
  const contact = CONTACTS[agent] || { name: agent, letter: "?", sub: "" };
  const inboxOnly = !!INBOX_ONLY[agent];

  const state = {
    agent, sessionId: params.get("session") || null, sending: false,
    turnCount: 0, waitingPeers: false, pollTimer: null,
    gatePollTimer: null, peerGate: {}, bootDone: false,
    gateFailStreak: 0,
  };

  const $ = (s) => document.querySelector(s);
  const thread = () => $("[data-thread]");
  const chips = () => $("[data-collab-chips]");

  document.title = contact.name + " · Messages";
  $("[data-agent-av]").dataset.agent = agent;
  $("[data-agent-av]").textContent = contact.letter;
  $("[data-agent-name]").textContent = contact.name;
  $("[data-agent-sub]").textContent = contact.sub;

  if (inboxOnly) {
    const form = $("[data-composer]");
    if (form) {
      form.innerHTML =
        '<div style="flex:1;font-size:13px;color:var(--mute);padding:8px 4px;line-height:1.4">' +
        "Overnight inbox — findings land here.<br>" +
        '<a href="#" data-act-aetheria style="color:var(--gold)">Ask Aetheria to act →</a>' +
        "</div>";
      const link = form.querySelector("[data-act-aetheria]");
      if (link) {
        link.addEventListener("click", (ev) => {
          ev.preventDefault();
          const raw = (thread()?.innerText || "").trim().slice(0, 900);
          const who = agent === "t_scout" ? "scout" : "critic";
          const q = encodeURIComponent(
            "Act on the latest " + who + " overnight brief. " +
            "Use read_overnight_brief(who=" + who + "), then house_post_send " +
            "commissions (kernel=code, vett=verify, scotty=repair, eve=marketing). " +
            "Thread excerpt for context:\n\n" +
            (raw || "(no brief text visible — trust read_overnight_brief)")
          );
          location.href = "/messages/aetheria?q=" + q;
        });
      }
    }
  }

  // Prefill from CC dispatch (?q=...) — Messages is the front door.
  const prefill = (params.get("q") || "").trim();
  if (!inboxOnly && prefill && $("[data-input]")) {
    $("[data-input]").value = prefill;
    $("[data-input]").focus();
  }

  function esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // Lightweight markdown for assistant bubbles (Grok-bots readable on phone).
  function renderMarkdown(md) {
    let s = String(md || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    s = s.replace(/```[\s\S]*?```/g, (m) => {
      const inner = m.slice(3, -3).replace(/^\w*\n/, "");
      return "<pre><code>" + inner + "</code></pre>";
    });
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/^###\s+(.*)$/gm, "<h3>$1</h3>");
    s = s.replace(/^##\s+(.*)$/gm, "<h2>$1</h2>");
    s = s.replace(/^#\s+(.*)$/gm, "<h1>$1</h1>");
    s = s.replace(/^&gt;\s+(.*)$/gm, "<blockquote>$1</blockquote>");
    s = s.replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>");
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*(.+?)\*/g, "<em>$1</em>");
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/((?:^[-*]\s+.+\n?)+)/gm, (m) => {
      const items = m.trim().split("\n").map((l) =>
        "<li>" + l.replace(/^[-*]\s+/, "") + "</li>").join("");
      return "<ul>" + items + "</ul>";
    });
    s = s.replace(/((?:^\d+\.\s+.+\n?)+)/gm, (m) => {
      const items = m.trim().split("\n").map((l) =>
        "<li>" + l.replace(/^\d+\.\s+/, "") + "</li>").join("");
      return "<ol>" + items + "</ol>";
    });
    s = s.replace(/\n{2,}/g, "</p><p>");
    s = "<p>" + s + "</p>";
    s = s.replace(/<p>\s*<\/p>/g, "");
    s = s.replace(/<p>(<(?:h[1-6]|ul|ol|pre|blockquote)[\s\S]*?<\/(?:h[1-6]|ul|ol|pre|blockquote)>)<\/p>/g, "$1");
    return s;
  }

  function appendBubble(kind, text) {
    const b = document.createElement("div");
    b.className = "bubble " + kind;
    if (kind === "them") {
      const body = document.createElement("div");
      body.className = "md-body";
      body.innerHTML = renderMarkdown(text);
      b.appendChild(body);
    } else {
      b.textContent = text;
    }
    thread().appendChild(b);
    thread().scrollTop = thread().scrollHeight;
    return b;
  }

  function setBubbleText(el, text, asMarkdown) {
    if (!el) return;
    if (asMarkdown) {
      let body = el.querySelector(".md-body");
      if (!body) {
        el.textContent = "";
        body = document.createElement("div");
        body.className = "md-body";
        el.appendChild(body);
      }
      body.innerHTML = renderMarkdown(text);
    } else {
      el.textContent = text;
    }
  }

  // Keep composer above the iOS keyboard when visualViewport shrinks.
  function bindKeyboardInset() {
    const vv = window.visualViewport;
    const composer = document.querySelector(".composer");
    if (!vv || !composer) return;
    const sync = () => {
      const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      composer.style.paddingBottom = "max(8px, calc(env(safe-area-inset-bottom) + " + inset + "px))";
      thread().style.paddingBottom = inset ? (inset + 8) + "px" : "";
    };
    vv.addEventListener("resize", sync);
    vv.addEventListener("scroll", sync);
    sync();
  }

  function roomHref(peer, roomSessionId) {
    return "/room?peer=" + encodeURIComponent(peer)
      + (roomSessionId ? "&session=" + encodeURIComponent(roomSessionId) : "")
      + (state.sessionId ? "&from=" + encodeURIComponent(state.sessionId) : "");
  }

  function appendMessagedPeer(peer, roomSessionId, peerState) {
    const name = peer.charAt(0).toUpperCase() + peer.slice(1);
    let st = peerState || "messaged";
    if (state.peerGate[peer] && st !== "replied") st = "gate";
    const status =
      st === "gate" ? "needs Gate" :
      st === "working" ? "working…" :
      st === "replied" ? "replied · tap" : "in group";
    const a = document.createElement("a");
    a.className = "messaged-peer";
    a.dataset.state = st;
    a.dataset.peer = peer;
    a.href = roomHref(peer, roomSessionId);
    a.title = st === "gate"
      ? name + " is waiting on Approval Gate — Allow below"
      : "Open group chat with " + name;
    a.setAttribute("aria-label", "Open group chat with " + name + " (" + status + ")");
    a.innerHTML =
      '<span class="mp-av" data-agent="' + esc(peer) + '">' + esc(name.charAt(0)) + '</span>' +
      '<span class="mp-name">' + esc(name) + '</span>' +
      '<span class="mp-status">' + esc(status) + '</span>';
    thread().appendChild(a);
    thread().scrollTop = thread().scrollHeight;
    return a;
  }

  function fmtApprovalArgs(args, toolName) {
    try {
      let parsed = args;
      if (typeof args === "string") {
        try { parsed = JSON.parse(args); } catch (_) { return String(args).slice(0, 280); }
      }
      // compose_post: show caption + platform for phone Allow (not raw JSON)
      if ((toolName === "compose_post" || parsed.content) && parsed && typeof parsed === "object") {
        const plat = (parsed.platform || "post").toString().toUpperCase();
        const cap = (parsed.content || "").toString().trim();
        const img = parsed.image_path
          ? "\nImage: " + String(parsed.image_path).split("/").pop()
          : "";
        const body = (cap.length > 500 ? cap.slice(0, 497) + "…" : cap) + img;
        return plat + " draft — Allow sends to Signal\n\n" + body;
      }
      const s = JSON.stringify(parsed);
      return s.length > 280 ? s.slice(0, 277) + "…" : s;
    } catch (_) {
      return String(args || "");
    }
  }

  function renderApprovalCard(payload) {
    const id = payload && (payload.approval_id || payload.id);
    if (!id) return;
    // Dedupe by DOM, not a permanent Set — renderTurns() wipes the thread and
    // must be allowed to recreate pending Gate cards (Allow vanishing hang).
    const existing = thread().querySelector(
      '.approval-card[data-approval-id="' + CSS.escape(String(id)) + '"]'
    );
    if (existing) return;
    const citizen = (payload.citizen || state.agent || "?").toLowerCase();
    if (citizen && citizen !== "aetheria") state.peerGate[citizen] = true;

    const card = document.createElement("div");
    card.className = "approval-card";
    card.dataset.approvalId = id;

    const head = document.createElement("div");
    head.className = "ac-head";
    head.textContent = payload.tool === "compose_post"
      ? "Allow to send draft to Signal"
      : "Needs your yes — Approval Gate";
    card.appendChild(head);

    const tool = document.createElement("div");
    tool.className = "ac-tool";
    const who = (CONTACTS[citizen] || { name: citizen }).name;
    tool.textContent = who + " · " + (payload.tool || "?");
    card.appendChild(tool);

    const argsEl = document.createElement("div");
    argsEl.className = "ac-args";
    argsEl.textContent = fmtApprovalArgs(payload.args, payload.tool);
    card.appendChild(argsEl);

    const actions = document.createElement("div");
    actions.className = "ac-actions";
    const allowBtn = document.createElement("button");
    allowBtn.type = "button";
    allowBtn.className = "ac-allow";
    allowBtn.textContent = "Allow";
    const denyBtn = document.createElement("button");
    denyBtn.type = "button";
    denyBtn.className = "ac-deny";
    denyBtn.textContent = "Deny";
    actions.appendChild(allowBtn);
    actions.appendChild(denyBtn);
    card.appendChild(actions);

    const notice = document.createElement("div");
    notice.className = "ac-notice";
    notice.style.display = "none";
    card.appendChild(notice);

    const decide = async (approve) => {
      allowBtn.disabled = true;
      denyBtn.disabled = true;
      try {
        const r = await fetch(
          "/api/citizens/" + encodeURIComponent(citizen) + "/approvals/" + encodeURIComponent(id) + "/decision",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ approve: approve, decided_by: "jon" }),
          }
        );
        const body = await r.json().catch(() => ({}));
        if (r.ok) {
          card.classList.add("ac-done");
          notice.textContent = approve ? "Allowed — continuing…" : "Denied.";
          notice.style.display = "";
          if (approve) delete state.peerGate[citizen];
          $("[data-agent-sub]").textContent = approve
            ? who + " unblocked — working…"
            : who + " denied · Gate";
        } else {
          notice.textContent = (body.error && body.error.message) || ("Failed (" + r.status + ")");
          notice.style.display = "";
          allowBtn.disabled = false;
          denyBtn.disabled = false;
        }
      } catch (e) {
        notice.textContent = e.message || "Network error";
        notice.style.display = "";
        allowBtn.disabled = false;
        denyBtn.disabled = false;
      }
    };
    allowBtn.addEventListener("click", () => decide(true));
    denyBtn.addEventListener("click", () => decide(false));

    thread().appendChild(card);
    thread().scrollTop = thread().scrollHeight;
    $("[data-agent-sub]").textContent = who + " needs Gate — Allow below";
  }

  async function pollApprovals() {
    try {
      const r = await fetch("/api/approvals/pending");
      if (!r.ok) {
        state.gateFailStreak = (state.gateFailStreak || 0) + 1;
        if (state.gateFailStreak >= 3) {
          $("[data-agent-sub]").textContent = "Gate unreachable — retrying…";
        }
        return;
      }
      state.gateFailStreak = 0;
      const data = await r.json();
      const items = (data && data.approvals) || [];
      const gatePeers = {};
      for (const a of items) {
        const c = (a.citizen || "").toLowerCase();
        if (c && c !== "aetheria") gatePeers[c] = true;
        renderApprovalCard({
          approval_id: a.id,
          citizen: a.citizen,
          tool: a.tool,
          args: a.args,
        });
      }
      state.peerGate = gatePeers;
      document.querySelectorAll("a.messaged-peer[data-peer]").forEach((el) => {
        const peer = el.dataset.peer;
        if (!peer) return;
        if (gatePeers[peer] && el.dataset.state !== "replied") {
          el.dataset.state = "gate";
          const st = el.querySelector(".mp-status");
          if (st) st.textContent = "needs Gate";
          el.title = (CONTACTS[peer] || { name: peer }).name + " is waiting on Approval Gate — Allow below";
        }
      });
      // Back off when nothing pending and no peer Gate — keep phone quiet.
      if (!items.length && !Object.keys(gatePeers).length && !state.waitingPeers) {
        stopGatePoll();
      }
    } catch (_) {
      state.gateFailStreak = (state.gateFailStreak || 0) + 1;
      if (state.gateFailStreak >= 3) {
        $("[data-agent-sub]").textContent = "Gate unreachable — retrying…";
      }
    }
  }

  function startGatePoll() {
    if (state.gatePollTimer) return;
    pollApprovals();
    state.gatePollTimer = setInterval(pollApprovals, 1500);
  }

  function stopGatePoll() {
    if (state.gatePollTimer) {
      clearInterval(state.gatePollTimer);
      state.gatePollTimer = null;
    }
  }

  function renderTurns(turns, collabIndex) {
    thread().innerHTML = "";
    const active = (collabIndex || []).filter(isActiveCollab);
    const activePeers = new Set(active.map((ev) => (ev.peer || "").toLowerCase()));
    const byPeer = {};
    active.forEach((ev) => {
      if (ev.peer && ev.room_session_id) byPeer[ev.peer] = ev.room_session_id;
    });
    // Latest state per peer from system markers (replied wins over working)
    const peerState = {};
    (turns || []).forEach((t) => {
      if (t.role !== "system") return;
      const m = /⟦room:messaged:([a-z]+)⟧/.exec(t.content || "");
      if (m) peerState[m[1]] = /working/i.test(t.content || "") ? "working" : (peerState[m[1]] || "messaged");
      const r = /⟦room:replied:([a-z]+)⟧/.exec(t.content || "");
      if (r) peerState[r[1]] = "replied";
    });
    const shown = new Set();
    let waiting = false;
    (turns || []).forEach((t) => {
      if (t.role === "user") appendBubble("me", t.content);
      else if (t.role === "assistant") appendBubble("them", t.content);
      else if (t.role === "system") {
        const m = /⟦room:messaged:([a-z]+)⟧/.exec(t.content || "");
        const r = /⟦room:replied:([a-z]+)⟧/.exec(t.content || "");
        const peer = (m && m[1]) || (r && r[1]);
        if (peer) {
          // Only show peer icon while collab is active — keep 1:1 otherwise.
          if (!shown.has(peer) && activePeers.has(peer)) {
            shown.add(peer);
            appendMessagedPeer(peer, byPeer[peer] || null, peerState[peer]);
            if (peerState[peer] === "working") waiting = true;
          }
        } else {
          const body = (t.content || "").replace(/⟦room:messaged:[a-z]+⟧\s*/, "").replace(/⟦room:replied:[a-z]+⟧\s*/, "");
          if (body.trim()) appendBubble("sys", body);
        }
      }
    });
    state.turnCount = (turns || []).length;
    state.waitingPeers = waiting;
    if (Object.keys(state.peerGate || {}).length) {
      const g = Object.keys(state.peerGate)[0];
      $("[data-agent-sub]").textContent = (CONTACTS[g] || { name: g }).name + " needs Gate — Allow below";
      startPoll();
      startGatePoll();
    } else if (waiting) {
      $("[data-agent-sub]").textContent = "peer working — tap their shape for the group";
      startPoll();
      startGatePoll();
    } else if (Object.values(peerState).includes("replied")) {
      $("[data-agent-sub]").textContent = "peer replied — tap shape to read in group";
      stopPoll();
    } else {
      $("[data-agent-sub]").textContent = contact.sub;
      stopPoll();
    }
    // History rebuild wiped Gate cards — re-pull pending so Allow returns.
    if (agent === "aetheria" || agent === "eve" || Object.keys(state.peerGate || {}).length) {
      pollApprovals();
    }
  }

  function startPoll() {
    if (state.pollTimer || agent !== "aetheria") return;
    state.pollTimer = setInterval(async () => {
      if (!state.sessionId || state.sending) return;
      try {
        const h = await fetch("/sessions/" + encodeURIComponent(state.sessionId) + "/history");
        if (!h.ok) return;
        const hd = await h.json();
        const turns = hd.turns || [];
        if (turns.length !== state.turnCount) {
          const c = await collabs();
          renderTurns(turns, c);
          renderChips(c);
        }
      } catch (_) {}
    }, 3000);
  }

  function stopPoll() {
    if (state.pollTimer) {
      clearInterval(state.pollTimer);
      state.pollTimer = null;
    }
  }

  function renderChips(events) {
    const row = chips();
    const list = (Array.isArray(events) ? events : []).filter(isActiveCollab);
    if (!list.length || agent !== "aetheria") {
      row.hidden = true;
      row.innerHTML = "";
      return;
    }
    const seen = new Set();
    const html = [];
    for (const ev of list) {
      const peer = (ev.peer || "").toLowerCase();
      if (!peer || seen.has(peer)) continue;
      seen.add(peer);
      const name = peer.charAt(0).toUpperCase() + peer.slice(1);
      html.push(
        '<a class="collab-chip" href="' + roomHref(peer, ev.room_session_id) + '">' +
          '<span class="collab-av">' + esc(name.charAt(0)) + '</span>' +
          '<span>' + esc(name) + '</span></a>'
      );
    }
    row.hidden = !html.length;
    row.innerHTML = html.join("");
  }

  async function refreshChips() {
    if (!state.sessionId || agent !== "aetheria") {
      renderChips([]);
      return;
    }
    try {
      const r = await fetch("/api/rooms/collabs?dm_session_id=" + encodeURIComponent(state.sessionId));
      if (!r.ok) return;
      const d = await r.json();
      renderChips(d.collabs || []);
    } catch (_) {}
  }

  async function ensureSession() {
    if (state.sessionId) return state.sessionId;
    const r = await fetch("/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ agent: state.agent }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.session_id) {
      const msg = (d.error && d.error.message) || ("Could not start chat (" + r.status + ")");
      throw new Error(msg);
    }
    state.sessionId = d.session_id;
    const u = new URL(location.href);
    u.searchParams.set("session", state.sessionId);
    history.replaceState({}, "", u);
    return state.sessionId;
  }

  function showLoadError(detail) {
    thread().innerHTML = "";
    appendBubble(
      "sys",
      "Couldn't load this thread" + (detail ? " — " + detail : "") +
        ". Go back and try again."
    );
  }

  function showEmptyThread() {
    thread().innerHTML = "";
    if (inboxOnly) {
      appendBubble(
        "sys",
        "Overnight inbox — Critic/Scout findings land here.\nNothing yet for this contact."
      );
    } else {
      appendBubble("sys", "Say hello to start the thread.");
    }
  }

  function clearSessionFromUrl() {
    state.sessionId = null;
    const u = new URL(location.href);
    u.searchParams.delete("session");
    history.replaceState({}, "", u);
  }

  async function applyHistory(sessionId) {
    const r = await fetch("/sessions/" + encodeURIComponent(sessionId) + "/history");
    if (!r.ok) {
      // Dead/missing session — drop it so send can mint a fresh one.
      if (r.status === 404) {
        clearSessionFromUrl();
        return null;
      }
      const body = await r.json().catch(() => ({}));
      const detail = (body.error && body.error.message) || ("HTTP " + r.status);
      showLoadError(detail);
      return false;
    }
    const d = await r.json();
    // Wrong contact in ?session=… — drop and let caller resume the right DM.
    if (d.agent && String(d.agent).toLowerCase() !== agent) {
      clearSessionFromUrl();
      return null;
    }
    const c = await collabs();
    renderTurns(d.turns || [], c);
    renderChips(c);
    if (inboxOnly && !(d.turns || []).length) {
      appendBubble("sys", "Overnight inbox — waiting for the next Critic/Scout brief.");
    }
    return true;
  }

  async function collabs() {
    if (!state.sessionId || agent !== "aetheria") return [];
    try {
      const r = await fetch("/api/rooms/collabs?dm_session_id=" + encodeURIComponent(state.sessionId));
      if (!r.ok) return [];
      const d = await r.json();
      return d.collabs || [];
    } catch (_) { return []; }
  }

  function isRoomSession(s) {
    // Group rooms are aetheria sessions titled [room:aetheria+peer].
    // Individual Aetheria chat must never auto-open those.
    const t = ((s && s.title) || "").trim();
    return t.startsWith("[room:");
  }

  function isResumableDmSession(s) {
    if (!s || !s.session_id) return false;
    const t = ((s && s.title) || "").trim();
    // Untitled sessions (just minted) are real DMs — resume them.
    if (!t) return true;
    if (isRoomSession(s)) return false;
    if (/^\[(heartbeat|direct:|commission|signal|specialist|webhook)/i.test(t)) return false;
    if (t.startsWith("automation:")) return false;
    if (t.startsWith("verify-")) return false;
    if (t.startsWith("[m]")) return true;
    if (t.startsWith("[")) return false;
    return true;
  }

  function isActiveCollab(ev) {
    if (!ev || !ev.peer) return false;
    if ((ev.state || "").toLowerCase() === "working") return true;
    if (!ev.at) return false;
    try {
      return (Date.now() - new Date(ev.at).getTime()) < 2 * 3600 * 1000;
    } catch (_) { return false; }
  }

  async function findLatestDmSession() {
    const r = await fetch("/sessions?agent=" + encodeURIComponent(agent) + "&limit=30");
    if (!r.ok) return null;
    const d = await r.json();
    const list = d.sessions || [];
    // Overnight Teammates inboxes: always resume newest session (no chat filters).
    if (inboxOnly) return list[0] || null;
    return list.find(isResumableDmSession) || null;
  }

  async function loadLatestOrHistory() {
    try {
      if (state.sessionId) {
        // If URL pointed at a room session, bounce to /room — keep DM individual.
        try {
          const metaR = await fetch("/sessions?agent=" + encodeURIComponent(agent) + "&limit=50");
          if (metaR.ok) {
            const meta = await metaR.json();
            const hit = (meta.sessions || []).find((s) => s.session_id === state.sessionId);
            if (hit && isRoomSession(hit)) {
              const peer = (/\[room:[^=]+\+([a-z]+)\]/i.exec(hit.title || "") || [])[1] || "vett";
              location.replace("/room?peer=" + encodeURIComponent(peer)
                + "&session=" + encodeURIComponent(state.sessionId));
              return;
            }
          }
        } catch (_) {}
        const ok = await applyHistory(state.sessionId);
        if (ok === true) return;
        if (ok === false) return; // hard error already shown
        // ok === null → wrong agent; fall through to latest DM
      }
      const s = await findLatestDmSession();
      if (s && s.session_id) {
        state.sessionId = s.session_id;
        const u = new URL(location.href);
        u.searchParams.set("session", state.sessionId);
        history.replaceState({}, "", u);
        const ok = await applyHistory(state.sessionId);
        if (ok === true) return;
        if (ok === false) return;
      }
      showEmptyThread();
    } catch (e) {
      showLoadError(e.message || "network error");
    }
  }

  async function send() {
    if (inboxOnly) return;
    if (!state.bootDone) return; // wait for initial history so we don't race a new session
    const input = $("[data-input]");
    const msg = (input.value || "").trim();
    if (!msg || state.sending) return;
    state.sending = true;
    $("[data-send]").disabled = true;
    input.value = "";
    appendBubble("me", msg);
    const them = appendBubble("them", "…");
    try {
      await ensureSession();
      const r = await fetch("/chat_stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          agent: state.agent,
          session_id: state.sessionId,
          message: msg,
        }),
      });
      if (!r.ok) {
        const errBody = await r.json().catch(() => ({}));
        const detail = (errBody.error && errBody.error.message) || ("HTTP " + r.status);
        them.textContent = "error · " + detail;
        return;
      }
      if (!r.body) {
        them.textContent = "error · empty response from house";
        return;
      }
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "", text = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const part of parts) {
          const line = part.split("\n").find((l) => l.startsWith("data: "));
          if (!line) continue;
          let payload;
          try {
            payload = JSON.parse(line.slice(6));
          } catch (_) {
            continue;
          }
          if (payload.type === "token" && payload.delta) {
            text += payload.delta;
            // Stream plain text; render markdown once the turn finishes.
            them.textContent = text;
            thread().scrollTop = thread().scrollHeight;
          } else if (payload.type === "approval_pending") {
            renderApprovalCard(payload);
            startGatePoll();
          } else if (payload.type === "tool_call") {
            appendBubble("sys", "→ " + (payload.name || "tool") + (payload.name === "house_post_send" ? " (messaging peer…)" : "…"));
          } else if (payload.type === "tool_result") {
            try {
              const tr = JSON.parse(payload.content || "{}");
              if (tr && tr.commissioned && (tr.to_id || tr.target)) {
                appendBubble("sys", "Commissioned " + (tr.to_id || tr.target) + " — tap their shape for the group");
                startGatePoll();
              }
              // Eve compose_post — show the draft in this thread (messenger-first)
              if ((payload.name === "compose_post" || tr.drafted) && tr.caption) {
                const card = document.createElement("div");
                card.className = "draft-card";
                const plat = (tr.platform || "post").toString().toUpperCase();
                const via = tr.delivered_via ? (" · via " + tr.delivered_via) : "";
                const img = tr.image_path
                  ? ("<div class=\"dc-meta\">Image: " + esc(String(tr.image_path).split("/").pop()) + "</div>")
                  : "";
                const note = tr.thread_note
                  ? ("<div class=\"dc-meta\">" + esc(tr.thread_note) + "</div>")
                  : (tr.error
                    ? ("<div class=\"dc-meta\">Signal: " + esc(tr.message || tr.error) + " — draft still here</div>")
                    : "");
                card.innerHTML =
                  "<div class=\"dc-head\">Draft · " + esc(plat) + via + "</div>" +
                  "<div class=\"dc-caption\">" + esc(tr.caption) + "</div>" +
                  img + note;
                thread().appendChild(card);
                thread().scrollTop = thread().scrollHeight;
              }
            } catch (_) {}
          } else if (payload.type === "error") {
            them.textContent = "error · " + (payload.message || payload.code);
          }
        }
      }
      if (!text) them.textContent = "(no reply)";
      else setBubbleText(them, text, true);
      // Reload to pick up in-thread Messaged {peer} avatars
      await applyHistory(state.sessionId);
    } catch (e) {
      them.textContent = "error · " + e.message;
    } finally {
      state.sending = false;
      $("[data-send]").disabled = false;
      if (input) input.focus();
    }
  }

  const _sendBtn = $("[data-send]");
  const _inp = $("[data-input]");
  if (_sendBtn && !inboxOnly) _sendBtn.disabled = true;
  if (_sendBtn) _sendBtn.addEventListener("click", send);
  if (_inp) {
    _inp.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); send(); }
    });
  }

  bindKeyboardInset();
  loadLatestOrHistory()
    .then(() => {
      state.bootDone = true;
      if (_sendBtn && !inboxOnly) _sendBtn.disabled = false;
      if (state.waitingPeers) startPoll();
      // Eve compose_post is Gate-approved; Aetheria too for other egress.
      if (agent === "aetheria" || agent === "eve") startGatePoll();
    })
    .catch((e) => {
      state.bootDone = true;
      if (_sendBtn && !inboxOnly) _sendBtn.disabled = false;
      showLoadError(e.message || "network error");
    });
  if (_inp) _inp.focus();
})();
</script>
</body>
</html>
