; SOVERYN router — BLACKWELL. Aetheria ALONE. Nothing else may live here.
;
; The unit sets CUDA_VISIBLE_DEVICES to the Blackwell UUID ONLY, so this
; process cannot even SEE the Quadros. That is the point: llama.cpp/ggml
; initializes a CUDA context on every VISIBLE device — `--device` restricts
; where LAYERS are offloaded, not what is visible — so co-tenants used to
; leak ~1.7GB onto her card. Invisible cards cannot be allocated on.
;
; Pinned by UUID, never index: the 2026-07-13 ConnectX-7 install renumbered
; the PCI bus (Blackwell nvidia-smi idx1 -> idx2). UUIDs cannot renumber.
;
; With only the Blackwell visible, it IS CUDA0 — so `device = CUDA0` below
; is unchanged and still correct.

[aetheria]
; CUTOVER 2026-08-17: live soul → Qwen3.8-27B UD-Q6_K_XL (was Gemma 4 31B Q6_K_L).
; Side-by-side soul suite passed (no overthink, no reasoning leaks, honest tools,
; warm presence ~43 t/s decode). Gemma kept as [aetheria-gemma] rollback.
;
; Thinking OFF for desk/soul feel. Qwen: enable_thinking false (NOT inverse like
; Gemma). reasoning=off is the primary switch; kwargs kept as belt-and-suspenders.
; Blackwell-only (CUDA0). Same operational cache-ram / parallel as prior Gemma slot.
model = /mnt/soveryn_models/GGUF/Qwen3.8-27B-UD-Q6_K_XL.gguf
alias = aetheria,aetheria-qwen,qwen38-soul,Qwen3.8-27B-UD-Q6_K_XL.gguf
mmproj = /mnt/soveryn_models/GGUF/mmproj-Qwen3.8-27B-BF16.gguf
device = CUDA0
ctx-size = 32768
ngl = 99
reasoning = off
chat-template-kwargs = {"enable_thinking":false}
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
; Prompt-cache store, 32 GiB HOST ram. Required so heartbeat/cognition/dream
; taking the slot can restore conversation KV (cache-idle-slots no-op if 0).
cache-ram = 32768
parallel = 1
jinja = true

; ─────────────────────────────────────────────────────────────────────────────
; Aetheria-Gemma — rollback (pre-cutover soul). Load: model=aetheria-gemma
; Unloads Qwen — only ONE model on Blackwell at a time.
; Gemma enable_thinking:true is INVERSE (suppresses thought channel).
; ─────────────────────────────────────────────────────────────────────────────
[aetheria-gemma]
model = /mnt/soveryn_models/GGUF/google_gemma-4-31B-it-Q6_K_L.gguf
alias = aetheria-gemma,google_gemma-4-31B-it-Q6_K_L.gguf,gemma-4-31B-it-Q6_K_L.gguf
mmproj = /mnt/soveryn_models/GGUF/mmproj-google_gemma-4-31B-it-bf16.gguf
device = CUDA0
ctx-size = 32768
ngl = 99
reasoning = off
chat-template-kwargs = {"enable_thinking":true}
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
swa-full = false
cache-ram = 32768
parallel = 1
jinja = true

