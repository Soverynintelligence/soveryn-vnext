; SOVERYN router — QUADROS. Everyone who is NOT Aetheria.
;
; The unit sets CUDA_VISIBLE_DEVICES to the two Quadro UUIDs ONLY, in this
; order:  CUDA0 = GPU-305d1801 (81:00)   CUDA1 = GPU-50b41c93 (01:00)
; So `device = CUDA0` here means the SAME physical card these models were
; already on (formerly addressed as CUDA2 when all 3 GPUs were visible).
; The renumber is why every device= line below changed CUDA2 -> CUDA0.
;
; This process cannot see the Blackwell, so it CANNOT allocate on Aetheria.

[vett-scotty]
; chat-template-file: froggeric/Qwen-Fixed-Chat-Templates v20 (2026-06-12).
; Sandbox-verified on this exact GGUF: multi-system messages survive, tool
; calls return chat-completions nested JSON, <|think_off|> per-prompt
; toggle works, format-compat HARNESS_OK exact. KV cache ~77% warm-cache
; on substantive system prompt (not the claimed 100% — but reasonable).
; SHA256 of template: 27d22ab352efbb63cdcc379cc58924f16b2949931e6f185b959f8930efc9520b
; Revert: comment out the chat-template-file line and restart router.
model = /mnt/soveryn_models/GGUF/Qwen_Qwen3.6-27B-Q8_0.gguf
alias = vett-scotty,Qwen_Qwen3.6-27B-Q8_0.gguf,Qwen3.5-27B-Q8_0.gguf
mmproj = /mnt/soveryn_models/GGUF/mmproj-Qwen_Qwen3.6-27B-bf16.gguf
; 2026-07-06: CUDA1 -> CUDA2 (display Quadro). Safe here: single-GPU, no
; cross-GPU event-wait, so no long kernel to trip the display TDR watchdog.
device = CUDA0
ctx-size = 65536
ngl = 99
reasoning = on
reasoning-format = deepseek
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
jinja = true
chat-template-file = /mnt/soveryn_models/templates/qwen-fixed-v20.jinja

[cognition]
model = /mnt/soveryn_models/GGUF/gemma-4-E4B-it-Q8_0.gguf
alias = cognition,gemma-4-E4B-it-Q8_0.gguf
device = CUDA0
ctx-size = 16384
ngl = 99
reasoning = off
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
jinja = true

[embeddings]
model = /home/jon-deoliveira/SOVERYN_Models/GGUF/nomic-embed-text-v1.5.Q8_0.gguf
alias = embeddings,nomic-embed-text-v1.5.Q8_0.gguf
device = CUDA0
embeddings = true
ngl = 99
; nomic-embed-text-v1.5 supports 8192-token context. Match batch + ubatch
; so a single user message can be embedded in one pass — default batch=512
; was 502-ing chat_stream the moment a user message tokenized past 512.
ctx-size = 8192
batch-size = 8192
ubatch-size = 8192
parallel = 2
pooling = mean

[reflection]
; Qwen3.5-9B (VANILLA) as the non-Gemma reflection-voices surface.
; Honors the reflection-voices design from
; memory:project_soveryn_reflection_voices_persona_overlay.md.
;
; Different family from Aetheria's Gemma 4 31B — that's the whole point.
; If one backend produces five flavors of the same answer across voices,
; that's the data point to provision psych8k for true model diversity.
; For now: single backend, voice differentiation comes from per-voice
; persona overlay.
;
; SWAPPED 2026-07-22 (Jon's call). Was Phi-3.5-mini-instruct_UNCENSORED.
; Why: this surface feeds the continuous-cognition pipeline, whose output
; is written into the LATTICE as durable memory and distilled into the
; sense-of-us note. Running an uncensored/ablated model there contradicts
; the measured house finding that abliteration is the DOMINANT confab lever
; (vanilla ~14% vs abliterated ~60% — memory:project_soveryn_abliterated_
; confab_prior). It was harmless only because the cognition engine has
; never actually run (memory:project_soveryn_cognition_engine_never_wired);
; swapping now, while nothing is live, costs nothing. The design intent was
; NON-GEMMA for voice diversity — not uncensored — and Qwen3.5-9B satisfies
; that intent with vanilla weights.
;
; ~7GB on Quadro #2 alongside cognition (Gemma 4 E4B, ~8GB) + embeddings
; (~150MB) — still ample headroom on a 48GB card.
model = /mnt/soveryn_models/GGUF/Qwen3.5-9B-Q6_K.gguf
; MERGED 2026-08-02. shepherd-9b was a SECOND llama-server process on the
; same weights file, costing ~7 GB of VRAM on a card that was alerting at
; <1 GB free and 82 C. Same root cause as the phantom model row in the
; 2026-07-31 paper: two aliases, one file, treated as two things.
; shepherd-9b MUST stay in this list — ~/shepherd/.env sets
; SHEPHERD_LLM_MODEL=shepherd-9b and requests it by name.
alias = reflection,shepherd-9b,Qwen3.5-9B-reflection,reflection-voices
; carried over from the merged [shepherd-9b] section — reflection had no
; projector, and dropping it would have silently removed vision from a
; caller that had it.
mmproj = /mnt/soveryn_models/GGUF/mmproj-Qwen3.5-9B-F16.gguf
device = CUDA0
ctx-size = 16384
ngl = 99
reasoning = off
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 5
jinja = true

; ─────────────────────────────────────────────────────────────────────────────
; SHEPHERD BAKE-OFF LADDER (2026-07-14)
; Candidates for Shepherd's local brain. All vision-capable (mmproj) — required,
; because shepherd/intake/vision.py sends image_url for license photos.
;
; Pinned to CUDA1 = the formerly-IDLE Quadro (01:00, 46.9GB free). THE RIG panel
; found that card sitting empty. Keeps them off CUDA0, where vett-scotty lives.
;
; Why small is plausible: Shepherd's date path has NO LLM ("dates are computed,
; never generated" — engine.py:5) and the bake-off HARD-FAILS any model that
; invents a date or a CFR citation. So size trades against ABSTENTION RATE and
; fluency, not against compliance correctness.
; ─────────────────────────────────────────────────────────────────────────────

[shepherd-7b]
