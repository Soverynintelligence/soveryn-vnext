; ─────────────────────────────────────────────────────────────────────────────
; LOCAL AIDER / BUILD BENCH — DeepSeek V4 Flash 0731 (moved to NVMe 2026-08-17)
; Load on demand; not always-on. Multi-shard GGUF — llama.cpp uses -00001-of-
; as the entry path and finds the rest next to it.
;
; 145G does NOT fit a Quadro (or both). ngl=99 OOMs (~147GiB cudaMalloc).
; Partial offload: enough layers to use free VRAM; remainder stays in system
; RAM (~500G on the tower). Both Quadros via tensor-split so we can push more
; layers than one card. Aetheria Blackwell is NOT in this process's CUDA view.
;
; 2026-08-17: first CC warm failed with ngl=99 on CUDA1 alone.
; ─────────────────────────────────────────────────────────────────────────────
[bench-flash]
model = /mnt/soveryn_models/GGUF/DeepSeek-V4-Flash-0731/UD-Q4_K_XL/DeepSeek-V4-Flash-0731-UD-Q4_K_XL-00001-of-00005.gguf
; House name: Kernel. Tech alias remains bench-flash.
alias = bench-flash,kernel,deepseek-flash,deepseek-v4-flash,DeepSeek-V4-Flash-0731
device = CUDA0,CUDA1
tensor-split = 50,50
ctx-size = 16384
; ~43 layers; ~3.4G/layer. Co-tenant default ngl=18 (~60G) beside embed/messie/voice.
; Measured 2026-08-17 co-tenant: decode ~5.2–6.2 t/s, prefill ~100 t/s.
ngl = 18
; 2026-08-23: reasoning OFF for agent/OpenCode use. Unset reasoning was letting
; DeepSeek-style think/tool thrash look like "looping" (also burned the 16k ctx).
reasoning = off
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
jinja = true

; TURBO — only when embed/messie/parakeet/f5tts are stopped (empty Quadros).
; Measured 2026-08-17: ngl=24 → decode ~6.3–7.3 t/s (+15–20%), prefill ~128 t/s.
; ngl=28 OOMs. Alias separate so CC/Aider can request either.
[bench-flash-turbo]
model = /mnt/soveryn_models/GGUF/DeepSeek-V4-Flash-0731/UD-Q4_K_XL/DeepSeek-V4-Flash-0731-UD-Q4_K_XL-00001-of-00005.gguf
alias = bench-flash-turbo,deepseek-flash-turbo
device = CUDA0,CUDA1
tensor-split = 50,50
ctx-size = 16384
ngl = 24
reasoning = off
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
jinja = true

