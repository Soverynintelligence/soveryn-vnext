; SOVERYN llama-server router preset
; Replaces the four-process fleet (8084/8085/8086/8089) with one router on :8080.
; Each [section] becomes a child subprocess on an internal dynamic port; clients
; address it via {"model": "<section-name>"} in the chat-completions body.
;
; Per-agent CUDA device pinning via `device =`. This is the modern equivalent of
; the CUDA_VISIBLE_DEVICES table in project_soveryn_2026_05_25_recovery.md.
;
; Reasoning settings per project_soveryn_llama_head_upgrade_research_2026_05_26.md:
;   on  = thinking preserved (Qwen3.6 vision needs this or stalls silently)
;   off = thinking suppressed (Gemma 4 cognition wants this)
; reasoning-format = deepseek keeps reasoning in `reasoning_content` instead
; of `content` on this build. The client-side strip remains defense in depth.

[aetheria]
; Gemma 4 31B (vanilla Google instruct) — swapped 2026-06-01 off Qwen3.6-35B-A3B
; due to the A3B overthinking class bug.
;
; IMPORTANT — Gemma 4 has ITS OWN thinking mode via <|channel>thought markers
; (NOT <think> like Qwen3). The template's enable_thinking flag has INVERSE
; logic from Qwen: enable_thinking=true means "stop injecting thought channel"
; (i.e., disables thinking). Without this kwarg, the model defaults into
; thinking mode and the response lands in reasoning_content, content empty.
;
; Memory: known-good per feedback_omni_models_for_companionship.md.
;
; SWA checkpoint invalidation reappeared in the live router on 2026-06-11:
; short UI turns were paying full 9K-24K prompt prefills before first token.
; swa-full needs more VRAM than Blackwell-only has after full cache allocation,
; so Aetheria uses the known-good 90/10 Blackwell+Quadro layer split.
; Keep this unless a cold/warm probe proves checkpoint reuse is stable without it.
model = /mnt/soveryn_models/GGUF/google_gemma-4-31B-it-Q6_K_L.gguf
alias = aetheria,google_gemma-4-31B-it-Q6_K_L.gguf,gemma-4-31B-it-Q6_K_L.gguf,google_gemma-4-31B-it-Q8_0.gguf
mmproj = /mnt/soveryn_models/GGUF/mmproj-google_gemma-4-31B-it-bf16.gguf
; 2026-07-09: COLLAPSED to Blackwell-only (CUDA0). The cross-GPU tensor split
; was the root of the Xid-8 crash class — every token the Blackwell exchanged
; activations with the Quadro partner over PCIe; when that stalled >7s the
; Blackwell watchdog fired Xid 8 and the backend died. That fragility is
; June-14-old (it's why the 85/15 hedge existed); the tuner's Jul-2 multi-GPU
; experiments spiked it, and denser fleet contention kept it recurring.
; Fix = eliminate the cross-GPU exchange entirely. No cross-GPU wait -> Xid 8
; is structurally impossible.
; 2026-07-09 (later): swapped Q8_0 -> Q6_K_L (27.1GB vs 32.6GB weights, best-quality
; Q6: embed+output stay Q8). The ~5.5GB weight savings let full ctx 32768 fit the
; Blackwell alone with headroom (~4.8GB free, clears the mmproj vision worst-case).
; So: Blackwell-only AND full context restored. Interim Q8@28672 collapse kept her
; up crash-free until this landed.
; Prior (crashing) config: Q8_0 / device=CUDA0,CUDA1 / tensor-split=85,15 / ctx-size=32768.
device = CUDA0
ctx-size = 32768
ngl = 99
reasoning = off
chat-template-kwargs = {"enable_thinking":true}
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
swa-full = true
cache-ram = 0
parallel = 1
jinja = true

[vett-scotty]
; chat-template-file: froggeric/Qwen-Fixed-Chat-Templates v20 (2026-06-12).
; Sandbox-verified on this exact GGUF: multi-system messages survive, tool
; calls return chat-completions nested JSON, <|think_off|> per-prompt
; toggle works, format-compat HARNESS_OK exact. KV cache ~77% warm-cache
; on substantive system prompt (not the claimed 100% — but reasonable).
; SHA256 of template: 27d22ab352efbb63cdcc379cc58924f16b2949931e6f185b959f8930efc9520b
; Revert: comment out the chat-template-file line and restart router.
model = /mnt/soveryn_models/GGUF/Qwen_Qwen3.6-27B-Q8_0.gguf
alias = vett-scotty,Qwen_Qwen3.6-27B-Q8_0.gguf,Qwen3.5-27B-Q8_0.gguf
mmproj = /mnt/soveryn_models/GGUF/mmproj-Qwen_Qwen3.6-27B-bf16.gguf
; 2026-07-06: CUDA1 -> CUDA2 (display Quadro). Safe here: single-GPU, no
; cross-GPU event-wait, so no long kernel to trip the display TDR watchdog.
device = CUDA2
ctx-size = 65536
ngl = 99
reasoning = on
reasoning-format = deepseek
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
jinja = true
chat-template-file = /mnt/soveryn_models/templates/qwen-fixed-v20.jinja

[cognition]
model = /mnt/soveryn_models/GGUF/gemma-4-E4B-it-Q8_0.gguf
alias = cognition,gemma-4-E4B-it-Q8_0.gguf
device = CUDA2
ctx-size = 16384
ngl = 99
reasoning = off
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
jinja = true

[embeddings]
model = /home/jon-deoliveira/SOVERYN_Models/GGUF/nomic-embed-text-v1.5.Q8_0.gguf
alias = embeddings,nomic-embed-text-v1.5.Q8_0.gguf
device = CUDA2
embeddings = true
ngl = 99
; nomic-embed-text-v1.5 supports 8192-token context. Match batch + ubatch
; so a single user message can be embedded in one pass — default batch=512
; was 502-ing chat_stream the moment a user message tokenized past 512.
ctx-size = 8192
batch-size = 8192
ubatch-size = 8192
parallel = 2
pooling = mean

[reflection]
; Phi-3.5-mini-Uncensored as the non-Gemma reflection-voices surface.
; Added 2026-06-08 to honor the reflection-voices design from
; memory:project_soveryn_reflection_voices_persona_overlay.md.
;
; Different family from Aetheria's Gemma 4 31B — that's the whole point.
; If the same Phi backend produces five flavors of the same answer
; across voices, that's the data point to provision psych8k + a Qwen
; variant for true model diversity. For now: single backend, voice
; differentiation comes from per-voice persona overlay.
;
; ~2.5GB on Quadro #2 alongside cognition (Gemma 4 E4B, ~8GB) +
; embeddings (~150MB) — plenty of headroom (36GB free at provision time).
model = /mnt/soveryn_models/GGUF/Phi-3.5-mini-instruct_Uncensored-Q4_K_M.gguf
alias = reflection,Phi-3.5-mini-Uncensored,phi-3.5-mini
device = CUDA2
ctx-size = 8192
ngl = 99
reasoning = off
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 5
jinja = true
