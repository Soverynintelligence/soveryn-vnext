<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages</title>
<style>

  :root {
    --bg:#000; --panel:#0c0b0a; --line:rgba(255,255,255,0.08);
    --ink:#f5f2ea; --mute:rgba(245,242,234,0.45); --gold:#c6a664; --mint:#6fb98a;
    --bubble-them:#1c1a17; --bubble-me:#2a2418;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  header.top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;
    padding:12px;padding-top:max(12px,env(safe-area-inset-top));
    background:rgba(0,0,0,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .back{color:var(--gold);text-decoration:none;font-size:17px;padding:6px 4px}
  .avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:15px;color:#0c0b0a;
    background:linear-gradient(145deg,var(--gold),#8a7038)}
  .avatar.vett{background:linear-gradient(145deg,#7ec8e3,#3a7a9a)}
  .avatar.eve{background:linear-gradient(145deg,#e0b0ff,#7a4a9a)}
  .who{flex:1;min-width:0}
  .who .name{font-weight:600;font-size:17px}
  .who .sub{font-size:12px;color:var(--mute)}
  .thread{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
  .bubble{max-width:78%;padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.35}
  .bubble.them{align-self:flex-start;background:var(--bubble-them);border-bottom-left-radius:4px}
  .bubble.me{align-self:flex-end;background:var(--bubble-me);border:1px solid rgba(198,166,100,.25);border-bottom-right-radius:4px}
  .bubble.sys{align-self:center;max-width:90%;background:transparent;color:var(--mute);font-size:13px;text-align:center}
  .composer{display:flex;gap:8px;align-items:center;padding:8px 12px;
    padding-bottom:max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(0,0,0,.95)}
  .composer input{flex:1;font:inherit;font-size:16px;padding:10px 14px;border-radius:20px;
    border:1px solid var(--line);background:#141210;color:var(--ink);outline:none}
  .composer button{width:36px;height:36px;border-radius:50%;border:none;background:var(--gold);color:#0c0b0a;font-weight:700;font-size:18px}

  header.top .title{font-size:28px;font-weight:700;letter-spacing:-0.02em;flex:1}
  .work{margin:10px 12px;padding:10px 12px;border-radius:14px;border:1px solid rgba(111,185,138,.3);
    background:rgba(111,185,138,.08);font-size:13px;line-height:1.35}
  .work b{color:var(--mint)}
  .list{list-style:none;margin:0;padding:0}
  .row{display:flex;gap:14px;align-items:center;padding:12px 16px;text-decoration:none;color:inherit;
    border-bottom:1px solid var(--line)}
  .row .av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:20px;color:#0c0b0a;background:linear-gradient(145deg,var(--gold),#8a7038);flex-shrink:0}
  .row .av.vett{background:linear-gradient(145deg,#7ec8e3,#3a7a9a)}
  .row .av.scotty{background:linear-gradient(145deg,#e8a87c,#a65d3b)}
  .row .av.eve{background:linear-gradient(145deg,#e0b0ff,#7a4a9a)}
  .row .av.kernel{background:linear-gradient(145deg,#9ee0b8,#3d7a55)}
  .meta{flex:1;min-width:0}
  .meta .n{display:flex;justify-content:space-between;font-weight:600;font-size:17px;margin-bottom:3px}
  .meta .n time{font-weight:400;font-size:13px;color:var(--mute)}
  .meta .p{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .p.hot{color:var(--mint)}
</style></head>
<body>
  <header class="top"><div class="title">Messages</div></header>
  <div class="work"><b>Active · CWG</b> — Vett researching fountain maintenance pricing. You’ll get a brief when it’s ready.</div>
  <ul class="list">
    <li><a class="row" href="02-dm.html"><div class="av">A</div><div class="meta">
      <div class="n"><span>Aetheria</span><time>now</time></div>
      <div class="p hot">Working with Vett on CWG…</div></div></a></li>
    <li><a class="row" href="#"><div class="av vett">V</div><div class="meta">
      <div class="n"><span>Vett</span><time>2h</time></div>
      <div class="p">Tap to talk</div></div></a></li>
    <li><a class="row" href="#"><div class="av scotty">S</div><div class="meta">
      <div class="n"><span>Scotty</span><time>Mon</time></div>
      <div class="p">Tap to talk</div></div></a></li>
    <li><a class="row" href="#"><div class="av eve">E</div><div class="meta">
      <div class="n"><span>Eve</span><time>Sun</time></div>
      <div class="p">Tap to talk</div></div></a></li>
    <li><a class="row" href="#"><div class="av kernel">K</div><div class="meta">
      <div class="n"><span>Kernel</span><time>Sat</time></div>
      <div class="p">Tap to talk</div></div></a></li>
  </ul>
</body></html>
