<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JUMPGATE</title>
<style>
  :root {
    --blue: #3d8bff;
    --ice: #7fc4ff;
    --white: #f4f8ff;
    --violet: #8a5cff;
    --hud-shadow: 0 0 8px rgba(61, 139, 255, 0.45), 0 0 2px rgba(61, 139, 255, 0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, system-ui, monospace;
    -webkit-user-select: none;
    user-select: none;
    cursor: crosshair;
  }

  #space {
    position: fixed;
    inset: 0;
    display: block;
  }

  /* ── frame furniture ─────────────────────────────────────────────── */
  .bar {
    position: fixed;
    left: 0; right: 0;
    height: 6vh;
    background: #000;
    z-index: 6;
    pointer-events: none;
  }
  .bar.top { top: 0; }
  .bar.bottom { bottom: 0; }

  #vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 72% 62% at 50% 50%, transparent 46%, rgba(0,0,0,0.62) 100%);
    z-index: 3;
    pointer-events: none;
  }

  #scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.028) 0px,
      rgba(255,255,255,0.028) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    z-index: 4;
    pointer-events: none;
  }

  /* ── HUD chrome ──────────────────────────────────────────────────── */
  .hud {
    position: fixed;
    z-index: 7;
    color: var(--ice);
    text-shadow: var(--hud-shadow);
    font-size: 11px;
    letter-spacing: 0.08em;
    line-height: 1.75;
    pointer-events: none;
    white-space: pre;
  }
  .hud b { color: var(--white); font-weight: 600; }
  .hud .dim { color: rgba(127, 196, 255, 0.55); }

  #hud-tl { top: calc(6vh + 14px); left: 18px; }
  #hud-tr { top: calc(6vh + 14px); right: 18px; text-align: right; }
  #hud-bl { bottom: calc(6vh + 14px); left: 18px; }
  #hud-br { bottom: calc(6vh + 14px); right: 18px; text-align: right; }

  #title {
    position: fixed;
    top: calc(6vh + 18px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    font-weight: 100;
    font-size: clamp(18px, 3.2vw, 30px);
    letter-spacing: 0.5em;
    text-indent: 0.5em; /* balance the tracking */
    text-transform: uppercase;
    color: var(--white);
    text-shadow: 0 0 14px rgba(61, 139, 255, 0.5);
    pointer-events: none;
  }

  #prompt {
    position: fixed;
    top: calc(6vh + 66px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    font-size: 10px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(127, 196, 255, 0.66);
    text-shadow: var(--hud-shadow);
    transition: opacity 1.4s ease;
    pointer-events: none;
  }
  #prompt.gone { opacity: 0; }

  /* ── speed readout ───────────────────────────────────────────────── */
  #speed-block {
    position: fixed;
    bottom: calc(6vh + 26px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    text-align: center;
    pointer-events: none;
    width: min(480px, 78vw);
  }

  #speed-num {
    font-weight: 100;
    font-size: clamp(44px, 7.5vw, 76px);
    line-height: 1;
    color: var(--white);
    letter-spacing: 0.04em;
    text-shadow: 0 0 18px rgba(61, 139, 255, 0.55);
    transition: text-shadow 0.4s ease, color 0.4s ease;
  }
  #speed-num.max {
    color: #ffffff;
    text-shadow:
      0 0 10px rgba(255, 255, 255, 0.95),
      0 0 34px rgba(244, 248, 255, 0.8),
      0 0 70px rgba(61, 139, 255, 0.6);
  }
  #speed-num .c { font-size: 0.32em; color: var(--ice); letter-spacing: 0.2em; }

  #speed-bar {
    margin: 12px auto 8px;
    width: 100%;
    height: 3px;
    background: rgba(61, 139, 255, 0.16);
    border-radius: 2px;
    overflow: hidden;
  }
  #speed-fill {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    background: linear-gradient(90deg, #3d8bff 0%, #7fc4ff 62%, #8a5cff 88%, #f4f8ff 100%);
    box-shadow: 0 0 10px rgba(61, 139, 255, 0.7);
    transition: width 0.12s linear;
  }

  #stage-label {
    font-size: 10px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--ice);
    text-shadow: var(--hud-shadow);
  }

  /* ── reticle ─────────────────────────────────────────────────────── */
  #reticle {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    width: min(46vmin, 380px);
    height: min(46vmin, 380px);
    pointer-events: none;
    opacity: 0.85;
  }
  #reticle .ring { transform-origin: 50% 50%; }
  #reticle .ring-a { animation: spin 14s linear infinite; }
  #reticle .ring-b { animation: spin 22s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #reticle .dot { animation: pulse 2.4s ease-in-out infinite; transform-origin: 50% 50%; }
  @keyframes pulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    #reticle .ring-a, #reticle .ring-b, #reticle .dot { animation: none; }
  }

  @media (max-width: 640px) {
    .hud { font-size: 9px; line-height: 1.6; }
    #hud-br, #hud-bl { display: none; }
  }
</style>
</head>
<body>
  <canvas id="space"></canvas>
  <div id="vignette"></div>
  <div id="scanlines"></div>
  <div class="bar top"></div>
  <div class="bar bottom"></div>

  <svg id="reticle" viewBox="0 0 200 200" fill="none">
    <g class="ring ring-a" stroke="#3d8bff" stroke-opacity="0.5">
      <circle cx="100" cy="100" r="88" stroke-dasharray="4 10" stroke-width="1"/>
    </g>
    <g class="ring ring-b" stroke="#7fc4ff" stroke-opacity="0.42">
      <circle cx="100" cy="100" r="70" stroke-dasharray="26 14 3 14" stroke-width="1"/>
    </g>
    <g stroke="#7fc4ff" stroke-opacity="0.6" stroke-width="1">
      <line x1="100" y1="4" x2="100" y2="14"/>
      <line x1="100" y1="186" x2="100" y2="196"/>
      <line x1="4" y1="100" x2="14" y2="100"/>
      <line x1="186" y1="100" x2="196" y2="100"/>
    </g>
    <circle class="dot" cx="100" cy="100" r="2.2" fill="#f4f8ff"/>
  </svg>

  <div id="title">Jumpgate</div>
  <div id="prompt">hold to engage &middot; spacebar</div>

  <div class="hud" id="hud-tl"></div>
  <div class="hud" id="hud-tr"></div>
  <div class="hud" id="hud-bl"></div>
  <div class="hud" id="hud-br"></div>

  <div id="speed-block">
    <div id="speed-num">0.00<span class="c"> c</span></div>
    <div id="speed-bar"><div id="speed-fill"></div></div>
    <div id="stage-label">sublight</div>
  </div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("space");
  const ctx = canvas.getContext("2d");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const params = new URLSearchParams(location.search);
  const burnParam = params.has("burn");
  const speedParam = Math.min(1, Math.max(0, parseFloat(params.get("speed")) || 0));

  const FOCAL = 420;
  const Z_NEAR = 30;
  const Z_FAR = 3000;
  const RING_COUNT = 14;
  const RING_RADIUS = 620;

  const COL = {
    blue: [61, 139, 255],
    ice: [127, 196, 255],
    white: [244, 248, 255],
    violet: [138, 92, 255],
  };

  let W = 0, H = 0, CX = 0, CY = 0, dpr = 1;
  let stars = [];
  let rings = [];

  // ── state ──────────────────────────────────────────────────────────
  let speed = speedParam;   // normalized 0..1
  let target = burnParam || speedParam > 0 ? 1 : 0;
  let held = burnParam;
  let flash = 0;
  let prevSpeed = 0;
  let distanceLy = 0;
  let elapsed = 0;
  let fps = 60;
  let heading = 137.4;
  let last = performance.now();

  const els = {
    tl: document.getElementById("hud-tl"),
    tr: document.getElementById("hud-tr"),
    bl: document.getElementById("hud-bl"),
    br: document.getElementById("hud-br"),
    num: document.getElementById("speed-num"),
    fill: document.getElementById("speed-fill"),
    stage: document.getElementById("stage-label"),
    prompt: document.getElementById("prompt"),
  };

  // ── sizing ─────────────────────────────────────────────────────────
  function starBudget() {
    const n = Math.round((W * H) / 1500);
    return Math.max(350, Math.min(1400, n));
  }

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;
    CX = W / 2;
    CY = H / 2;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seedStars();
  }

  function rand(a, b) { return a + Math.random() * (b - a); }

  function resetStar(s, far) {
    const spread = Math.max(W, H) * 1.1;
    s.x = rand(-spread, spread);
    s.y = rand(-spread, spread);
    s.z = far ? rand(Z_NEAR, Z_FAR) : Z_FAR;
    const r = Math.random();
    s.c = r < 0.12 ? COL.violet : r < 0.67 ? COL.blue : COL.white;
  }

  function seedStars() {
    const n = starBudget();
    stars = [];
    for (let i = 0; i < n; i++) {
      const s = {};
      resetStar(s, true);
      stars.push(s);
    }
  }

  function seedRings() {
    rings = [];
    const spacing = (Z_FAR - Z_NEAR) / RING_COUNT;
    for (let i = 0; i < RING_COUNT; i++) {
      rings.push({ z: Z_NEAR + spacing * (i + 0.5), a: rand(0, Math.PI) });
    }
  }

  // ── projection ─────────────────────────────────────────────────────
  function proj(x, y, z) {
    const k = FOCAL / z;
    return [CX + x * k, CY + y * k, k];
  }

  // ── render ─────────────────────────────────────────────────────────
  function draw(dt) {
    // Fade instead of clear — trails lengthen as speed rises.
    const fadeA = 0.5 - 0.38 * speed;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(0,0,0,${fadeA.toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);

    // Screen shake above 75%.
    const shakeAmp = reduceMotion ? 0 : (speed > 0.75 ? 6 * Math.pow((speed - 0.75) / 0.25, 2) : 0);
    ctx.save();
    if (shakeAmp > 0.05) {
      ctx.translate((Math.random() - 0.5) * 2 * shakeAmp, (Math.random() - 0.5) * 2 * shakeAmp);
    }

    ctx.globalCompositeOperation = "lighter";

    // Core glow at the vanishing point — swells toward a white-blue bloom.
    const glowR = 40 + 340 * speed * speed;
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, glowR);
    g.addColorStop(0, `rgba(244,248,255,${(0.10 + 0.75 * speed * speed).toFixed(3)})`);
    g.addColorStop(0.35, `rgba(127,196,255,${(0.06 + 0.38 * speed * speed).toFixed(3)})`);
    g.addColorStop(1, "rgba(61,139,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(CX - glowR, CY - glowR, glowR * 2, glowR * 2);

    // ── tunnel rings ─────────────────────────────────────────────────
    const zShift = (40 + 2960 * speed * speed) * dt;
    const spin = (0.12 + 1.4 * speed * speed) * dt;
    ctx.lineCap = "round";
    for (let i = 0; i < rings.length; i++) {
      const ring = rings[i];
      ring.z -= zShift;
      ring.a += spin;
      if (ring.z < Z_NEAR + 10) ring.z += (Z_FAR - Z_NEAR);

      const depth = ring.z / Z_FAR;
      const verts = [];
      for (let v = 0; v < 8; v++) {
        const ang = ring.a + (v / 8) * Math.PI * 2;
        const wx = Math.cos(ang) * RING_RADIUS;
        const wy = Math.sin(ang) * RING_RADIUS;
        verts.push(proj(wx, wy, ring.z));
      }
      const alpha = 0.5 * (1 - depth) + 0.06;
      ctx.strokeStyle = `rgba(61,139,255,${alpha.toFixed(3)})`;
      ctx.lineWidth = Math.max(0.6, 2.2 * (1 - depth));
      ctx.shadowColor = "rgba(61,139,255,0.8)";
      ctx.shadowBlur = 10 * (1 - depth);
      ctx.beginPath();
      for (let v = 0; v <= 8; v++) {
        const p = verts[v % 8];
        if (v === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
      }
      ctx.stroke();

      // Violet struts: every other ring wired to its neighbour.
      if (i % 2 === 0 && i + 1 < rings.length) {
        const nxt = rings[i + 1];
        const na = nxt.a; // neighbour lags by construction order; fine visually
        ctx.strokeStyle = `rgba(138,92,255,${(alpha * 0.65).toFixed(3)})`;
        ctx.lineWidth = 1;
        ctx.shadowColor = "rgba(138,92,255,0.7)";
        ctx.shadowBlur = 6 * (1 - depth);
        ctx.beginPath();
        for (let v = 0; v < 8; v += 2) {
          const angA = ring.a + (v / 8) * Math.PI * 2;
          const angB = nxt.a + (v / 8) * Math.PI * 2;
          const p1 = proj(Math.cos(angA) * RING_RADIUS, Math.sin(angA) * RING_RADIUS, ring.z);
          const p2 = proj(Math.cos(angB) * RING_RADIUS, Math.sin(angB) * RING_RADIUS, nxt.z);
          ctx.moveTo(p1[0], p1[1]);
          ctx.lineTo(p2[0], p2[1]);
        }
        ctx.stroke();
      }
    }
    ctx.shadowBlur = 0;

    // ── stars ────────────────────────────────────────────────────────
    const zSpeed = 40 + 2960 * speed * speed;
    const tail = 20 + 980 * speed * speed; // world-units; grows with speed
    const chroma = speed > 0.75 ? (speed - 0.75) / 0.25 : 0;

    for (const s of stars) {
      s.z -= zSpeed * dt;
      if (s.z <= Z_NEAR) { resetStar(s, false); continue; }

      const [x1, y1] = proj(s.x, s.y, s.z);
      if (x1 < -80 || x1 > W + 80 || y1 < -80 || y1 > H + 80) { resetStar(s, false); continue; }
      const [x0, y0] = proj(s.x, s.y, s.z + tail);
      const depth = 1 - s.z / Z_FAR;
      const a = 0.25 + 0.75 * depth;
      const [r, gc, b] = s.c;

      const drawStreak = (ox, tint) => {
        if (tint) {
          ctx.strokeStyle = tint(a);
        } else {
          ctx.strokeStyle = `rgba(${r},${gc},${b},${a.toFixed(3)})`;
        }
        ctx.lineWidth = 0.8 + 1.8 * depth;
        ctx.beginPath();
        ctx.moveTo(x0 + ox, y0);
        ctx.lineTo(x1 + ox, y1);
        ctx.stroke();
      };

      drawStreak(0, null);

      // Chromatic split: red/blue offset copies that separate with depth.
      if (chroma > 0) {
        const sep = 6 * chroma * depth;
        drawStreak(-sep, (al) => `rgba(255,64,64,${(al * 0.55).toFixed(3)})`);
        drawStreak(sep, (al) => `rgba(64,140,255,${(al * 0.55).toFixed(3)})`);
      }
    }

    ctx.restore();

    // Threshold flash.
    if (flash > 0.004) {
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = `rgba(244,248,255,${flash.toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
      flash *= Math.exp(-6 * dt);
    }
  }

  // ── HUD ────────────────────────────────────────────────────────────
  function fmtTime(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  }

  function stageOf(s) {
    if (s >= 0.93) return "threshold";
    if (s >= 0.75) return "hyperspace";
    if (s >= 0.25) return "warp entry";
    return "sublight";
  }

  function driveState() {
    if (speed >= 0.97) return "MAX";
    if (held && target > speed) return "BURN";
    if (!held && speed > 0.012) return "COAST";
    return "IDLE";
  }

  function drawHud(dt) {
    const hull = 100 - Math.max(0, speed - 0.85) * 25;
    const shakeMag = reduceMotion ? 0 : (speed > 0.75 ? 6 * Math.pow((speed - 0.75) / 0.25, 2) : 0);
    heading = (heading + dt * (0.4 + speed * 2.2)) % 360;

    els.tl.innerHTML =
      `<span class="dim">VECTOR</span>  <b>${heading.toFixed(1).padStart(5, "0")}\u00b0</b>  ${(Math.sin(elapsed * 0.21) * 0.04).toFixed(3)} c lat\n` +
      `<span class="dim">GATE</span>    <b>K-7 \u00b7 SOVERYN RELAY</b>\n` +
      `<span class="dim">HULL</span>    <b>${hull.toFixed(1)}%</b>`;

    els.tr.innerHTML =
      `<span class="dim">DRIVE</span>    <b>${driveState()}</b>\n` +
      `<span class="dim">FRAME</span>   <b>${fps.toFixed(0)}</b> fps\n` +
      `<span class="dim">STARS</span>   <b>${stars.length}</b>`;

    els.bl.innerHTML =
      `<span class="dim">DIST</span>    <b>${distanceLy.toFixed(2)}</b> ly\n` +
      `<span class="dim">ELAPSED</span> <b>${fmtTime(elapsed)}</b>`;

    els.br.innerHTML =
      `<span class="dim">SHAKE</span>   <b>${shakeMag.toFixed(2)}</b> px\n` +
      `<span class="dim">FLASH</span>   <b>${(flash * 100).toFixed(0)}%</b>`;

    const c = speed * 9.99;
    els.num.innerHTML = `${c.toFixed(2)}<span class="c"> c</span>`;
    els.num.classList.toggle("max", speed >= 0.97);
    els.fill.style.width = (speed * 100).toFixed(1) + "%";
    els.stage.textContent = stageOf(speed);
  }

  // ── input ──────────────────────────────────────────────────────────
  function engage(on) {
    held = on;
    target = on ? 1 : 0;
    if (on) els.prompt.classList.add("gone");
  }

  addEventListener("pointerdown", () => engage(true));
  addEventListener("pointerup", () => engage(false));
  addEventListener("pointercancel", () => engage(false));
  addEventListener("keydown", (e) => {
    if (e.code === "Space" && !e.repeat) { e.preventDefault(); engage(true); }
  });
  addEventListener("keyup", (e) => {
    if (e.code === "Space") engage(false);
  });

  addEventListener("resize", resize);

  // ── loop ───────────────────────────────────────────────────────────
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    if (dt <= 0) return;

    fps += (1 / dt - fps) * 0.06;
    elapsed += dt;

    // Exponential approach — ramp up faster than decay.
    const k = target > speed ? 1.8 : 0.9;
    speed += (target - speed) * (1 - Math.exp(-k * dt));
    if (speed < 0.0005) speed = 0;

    // Threshold crossing → flash.
    if (prevSpeed < 0.93 && speed >= 0.93) flash = 0.85;
    prevSpeed = speed;

    distanceLy += speed * speed * dt * 0.42;

    draw(dt);
    drawHud(dt);
  }

  resize();
  seedRings();
  if (burnParam) els.prompt.style.display = "none";
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
