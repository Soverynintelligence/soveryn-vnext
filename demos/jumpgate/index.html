<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JUMPGATE — GLM-5.3-Flash vs Qwen3.8-Flash-Next</title>
<style>
  :root { --line: rgba(127,196,255,.22); --ice:#9fd4ff; --dim:rgba(191,233,255,.45); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #d9f0ff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    background: #05070c;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  }
  header b { color: #fff; letter-spacing: .28em; font-weight: 600; }
  header span { color: var(--dim); letter-spacing: .08em; text-transform: none; }
  header a { color: var(--ice); text-decoration: none; }
  header a:hover { color: #fff; }
  .stage { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .pane {
    position: relative; min-height: 0;
    border-right: 1px solid var(--line);
  }
  .pane:last-child { border-right: 0; }
  .pane iframe { display: block; width: 100%; height: 100%; border: 0; background: #000; }
  .tag {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    display: flex; align-items: baseline; gap: 10px;
    padding: 6px 10px;
    background: rgba(0,0,0,.72);
    border: 1px solid var(--line);
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    pointer-events: none;
  }
  .tag em { font-style: normal; color: #fff; }
  .tag i { font-style: normal; color: var(--dim); letter-spacing: .06em; }
  .solo {
    pointer-events: auto;
    color: var(--ice); text-decoration: none; letter-spacing: .1em;
  }
  .solo:hover { color: #fff; }
  .hint { color: var(--dim); font-size: 10px; letter-spacing: .04em; text-transform: none; }
  @media (max-width: 820px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .pane { border-right: 0; border-bottom: 1px solid var(--line); }
    .pane:last-child { border-bottom: 0; }
    header { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <div><b>JUMPGATE</b> <span>same Fable 5.1 prompt · two Kernel brains</span></div>
  <div class="hint">Click a pane, then hold click / space to burn</div>
</header>
<div class="stage">
  <div class="pane">
    <div class="tag">
      <em>GLM-5.3-Flash</em>
      <i>TP=2 · Pi · Fable 029</i>
      <a class="solo" href="./glm.html" target="_blank" rel="noopener">solo →</a>
    </div>
    <iframe src="./glm.html" title="JUMPGATE by GLM-5.3-Flash" allow="autoplay"></iframe>
  </div>
  <div class="pane">
    <div class="tag">
      <em>Qwen3.8-Flash-Next</em>
      <i>TP=1 spark2 · Pi · thinking off</i>
      <a class="solo" href="./flash-next.html" target="_blank" rel="noopener">solo →</a>
    </div>
    <iframe src="./flash-next.html" title="JUMPGATE by Qwen3.8-Flash-Next" allow="autoplay"></iframe>
  </div>
</div>
</body>
</html>
